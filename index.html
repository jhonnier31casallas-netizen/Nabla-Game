<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>NABLA Cálculo Multivariable</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#04060f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NABLA">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Unbounded:wght@500;700;800;900&display=swap">
<style>
/* ================= NABLA · estilo neón cian/magenta ================= */
:root{
  --bg:#050818; --bg2:#0a1030; --ink:#e4eeff; --ink2:#9db0d4; --dim:#647aa3;
  --cyan:#22e6ff; --mag:#ff3df0; --vio:#9b7bff; --lime:#3dffa0; --amber:#ffc24d; --red:#ff4d79;
  --line:rgba(120,190,255,.18); --line2:rgba(120,190,255,.32);
  --glass:rgba(9,14,38,.68); --glass2:rgba(14,22,56,.72); --glass3:rgba(20,32,74,.6);
  --wh:190; --ac:hsl(var(--wh) 100% 62%); --ac2:hsl(calc(var(--wh) + 70) 100% 68%); --acs:hsla(var(--wh),100%,62%,.16);
  --font-d:'Unbounded','Exo 2',system-ui,sans-serif; --font-b:'Exo 2',system-ui,-apple-system,'Segoe UI',sans-serif; --font-m:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:16px; --fs:16px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.55 var(--font-b);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--cyan)}
b,strong{font-weight:700}
code{font-family:var(--font-m);font-size:.9em;background:rgba(120,190,255,.1);padding:1px 6px;border-radius:6px}
h1,h2,h3,h4{margin:0;font-family:var(--font-d);font-weight:700;letter-spacing:.01em;line-height:1.2;text-wrap:balance}
p{margin:0 0 .8em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:8px}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#bg{z-index:0}
#fx{z-index:60;pointer-events:none}
#app{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(120,190,255,.25);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
mjx-container{color:inherit!important;max-width:100%}
mjx-container[display="true"]{margin:.6em 0!important;overflow-x:auto;overflow-y:hidden;padding:2px 0}
mjx-container svg{max-width:none}
.tex-wait{opacity:.5;transition:opacity .25s}

/* ---------- Botones y chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:12px;border:1px solid var(--line2);background:rgba(34,230,255,.06);color:var(--ink);font-weight:600;letter-spacing:.01em;transition:transform .15s,background .2s,border-color .2s,box-shadow .2s;min-height:42px}
.btn:hover{background:rgba(34,230,255,.14);border-color:var(--cyan);box-shadow:0 0 18px rgba(34,230,255,.25)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.primary{background:linear-gradient(120deg,rgba(34,230,255,.28),rgba(255,61,240,.26));border-color:rgba(34,230,255,.7);box-shadow:0 0 22px rgba(34,230,255,.22),inset 0 0 18px rgba(255,255,255,.05)}
.btn.primary:hover{box-shadow:0 0 30px rgba(34,230,255,.45),0 0 44px rgba(255,61,240,.2);background:linear-gradient(120deg,rgba(34,230,255,.4),rgba(255,61,240,.36))}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:rgba(255,255,255,.07);box-shadow:none;border-color:var(--line)}
.btn.danger{border-color:rgba(255,77,121,.6);background:rgba(255,77,121,.1)}
.btn.danger:hover{background:rgba(255,77,121,.22);border-color:var(--red);box-shadow:0 0 18px rgba(255,77,121,.3)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.88rem;border-radius:10px}
.btn.on{background:rgba(34,230,255,.2);border-color:var(--cyan)}
.btn.icon{padding:8px;min-width:42px}
.btn svg{width:1.15em;height:1.15em;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font:500 .8rem/1.5 var(--font-m);border:1px solid var(--line2);background:rgba(34,230,255,.08);color:var(--ink)}
.chip.amber{border-color:rgba(255,194,77,.55);background:rgba(255,194,77,.1);color:#ffe2a0}
.chip.lime{border-color:rgba(61,255,160,.55);background:rgba(61,255,160,.1);color:#b8ffe0}
.chip.glow{box-shadow:0 0 14px rgba(61,255,160,.45);animation:pulse 1.4s infinite}
.tbl{display:grid;grid-template-columns:auto repeat(5,1fr);gap:2px 10px;font:500 .8rem var(--font-m);margin-top:6px}
.tbl .k{color:var(--ink2)}
input[type=text],input[type=password],input[type=search],textarea,select{width:100%;background:rgba(3,6,20,.75);border:1px solid var(--line2);border-radius:12px;padding:10px 14px;color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,230,255,.18)}
textarea{font-family:var(--font-m);font-size:.82rem;resize:vertical}
select{appearance:auto}
input[type=range]{accent-color:var(--cyan);width:100%}

/* ---------- Pantalla de inicio ---------- */
#start{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px;transition:opacity .9s,transform 1.1s cubic-bezier(.6,0,.2,1),filter .9s}
#start.out{opacity:0;transform:scale(1.9);filter:blur(10px);pointer-events:none}
.logo-mark{font-family:var(--font-d);font-weight:900;font-size:clamp(3.6rem,15vw,9rem);line-height:.95;letter-spacing:.02em;background:linear-gradient(100deg,var(--cyan) 10%,#fff 45%,var(--mag) 90%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(34,230,255,.5)) drop-shadow(0 0 60px rgba(255,61,240,.3));animation:floaty 5s ease-in-out infinite}
.logo-mark .nab{display:inline-block;transform:translateY(-.06em) scaleY(-1);font-weight:400;margin-right:.04em;background:linear-gradient(100deg,var(--cyan),#dffaff);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo-sub{font-family:var(--font-m);letter-spacing:.42em;text-transform:uppercase;font-size:clamp(.66rem,2.4vw,.9rem);color:var(--cyan);text-shadow:0 0 12px rgba(34,230,255,.7)}
.logo-tag{max-width:560px;color:var(--ink2);margin:10px auto 22px;font-size:clamp(.95rem,2.6vw,1.1rem);color:var(--ink);opacity:.88;text-shadow:0 0 6px #050818,0 0 14px #050818,0 0 22px rgba(5,8,24,.9)}
.start-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.start-actions .btn{min-width:210px;font-size:1.05rem;padding:14px 26px}
.start-foot{position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;color:var(--dim);font:500 .74rem var(--font-m);padding:0 16px}
.start-foot button{background:none;border:none;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;padding:2px 6px;font:inherit}
.boot{font:500 .74rem var(--font-m);color:var(--cyan);text-align:left;min-height:5.4em;opacity:.85;margin-top:20px}
.boot i{color:var(--lime);font-style:normal}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.shake{animation:shake .45s}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes glowline{0%,100%{opacity:.5}50%{opacity:1}}

/* ---------- HUD ---------- */
#hud{display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(180deg,rgba(5,8,24,.92),rgba(5,8,24,.55));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:5;flex:none}
#hud .brand{display:flex;align-items:center;gap:8px;font:800 1.05rem var(--font-d);letter-spacing:.06em;background:none;border:none;padding:4px 6px}
#hud .brand b{display:inline-block;transform:scaleY(-1);color:var(--cyan);text-shadow:0 0 12px var(--cyan);font-size:1.3em}
#hud .brand span{background:linear-gradient(90deg,var(--cyan),var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent}
.rank{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1;max-width:420px}
.rank-top{display:flex;justify-content:space-between;gap:8px;font:600 .74rem var(--font-m);color:var(--ink2);white-space:nowrap}
.rank-top b{color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.xpbar{height:9px;border-radius:99px;background:rgba(120,190,255,.14);overflow:hidden;position:relative}
.xpbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--mag));box-shadow:0 0 12px var(--cyan);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.hud-stats{display:flex;gap:6px;margin-left:auto;align-items:center}
.stat{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:rgba(20,32,74,.5);font:700 .85rem var(--font-m)}
.stat svg{width:1.05em;height:1.05em}
.stat.fire svg{color:var(--amber);filter:drop-shadow(0 0 6px var(--amber))}
.stat.star svg{color:var(--amber)}
.stat.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25);box-shadow:0 0 20px var(--amber)}}
.hud-btns{display:flex;gap:2px}
.hud-btns .btn{min-height:38px}
.modechip{font:700 .7rem var(--font-m);letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:99px;background:rgba(255,194,77,.14);border:1px solid var(--amber);color:var(--amber)}

/* ---------- Mapa (hub) ---------- */
#hub{flex:1;overflow-y:auto;overflow-x:hidden;padding:26px clamp(16px,4vw,48px) 70px;scroll-behavior:smooth}
.hub-in{max-width:1180px;margin:0 auto}
.hub-head{display:flex;flex-wrap:wrap;gap:14px;align-items:end;justify-content:space-between;margin-bottom:22px;animation:fadeUp .7s both}
.hub-head h1{font-size:clamp(1.5rem,4.2vw,2.4rem);background:linear-gradient(90deg,#fff,var(--cyan) 60%,var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent}
.hub-head p{color:var(--ink2);margin:6px 0 0;max-width:640px}
.hub-quick{display:flex;gap:8px;flex-wrap:wrap}
.hub-remind{position:relative;display:flex;gap:14px;align-items:flex-start;padding:16px 44px 16px 18px;margin-bottom:20px;border-radius:16px;border:1px solid rgba(255,194,77,.4);background:linear-gradient(120deg,rgba(255,194,77,.12),rgba(9,14,38,.85));box-shadow:0 0 30px rgba(255,194,77,.12);animation:fadeUp .5s both}
.hub-remind .hr-ic{flex:none;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:rgba(255,194,77,.18);color:var(--amber)}
.hub-remind .hr-ic svg{width:19px;height:19px}
.hub-remind .hr-body{flex:1;min-width:0}
.hub-remind b{font-family:var(--font-d);font-size:.98rem;color:#ffe2a0}
.hub-remind p{margin:4px 0 10px;color:var(--ink2);font-size:.88rem}
.hr-chips{display:flex;gap:8px;flex-wrap:wrap}
.hr-chip{--wh:190;padding:5px 12px;border-radius:99px;border:1px solid hsla(var(--wh),100%,65%,.5);background:hsla(var(--wh),100%,60%,.12);color:hsl(var(--wh),100%,80%);font:600 .8rem var(--font-m);cursor:pointer;transition:.2s}
.hr-chip:hover{background:hsla(var(--wh),100%,60%,.24);box-shadow:0 0 14px hsla(var(--wh),100%,60%,.35);transform:translateY(-1px)}
.hub-remind .hr-x{position:absolute;top:10px;right:10px}
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px}
.wcard{--wh:190;position:relative;text-align:left;padding:0;border-radius:20px;border:1px solid var(--line);background:rgba(9,14,38,.82);overflow:hidden;display:flex;flex-direction:column;transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,box-shadow .25s;animation:fadeUp .6s both;color:var(--ink)}
.wcard:hover:not(.locked){transform:translateY(-5px) scale(1.012);border-color:var(--ac);box-shadow:0 12px 44px rgba(0,0,0,.5),0 0 32px hsla(var(--wh),100%,60%,.35)}
.wcard::before{content:'';position:absolute;inset:0;background:radial-gradient(120% 80% at 100% 0%,hsla(var(--wh),100%,60%,.22),transparent 60%);pointer-events:none}
.wcard .wth{position:relative;height:150px;overflow:hidden;background:rgba(3,5,16,.6)}
.wcard .wth .vz-stage{position:absolute;inset:0;aspect-ratio:auto;border:none;border-radius:0;background:transparent}
.wcard .wth canvas{filter:hue-rotate(var(--hr,0deg)) saturate(1.1)}
.wcard .wnum{position:absolute;left:14px;top:12px;font:700 .7rem var(--font-m);letter-spacing:.2em;color:var(--ac);text-shadow:0 0 10px var(--ac);z-index:2}
.wcard .wgl{position:absolute;right:14px;top:6px;font:800 2.2rem var(--font-d);color:hsla(var(--wh),100%,70%,.9);text-shadow:0 0 22px var(--ac);z-index:2}
.wcard .wb{position:relative;padding:14px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.wcard h3{font-size:1.05rem}
.wcard .wsub{color:var(--ink2);font-size:.9rem;margin:0}
.wprog{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.wprog .chip{font-size:.72rem}
.wbar{height:5px;border-radius:9px;background:rgba(120,190,255,.15);overflow:hidden}
.wbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));box-shadow:0 0 10px var(--ac)}
.wcard.locked{cursor:not-allowed;filter:saturate(.3) brightness(.7)}
.wcard.locked .wth::after{content:'';position:absolute;inset:0;background:rgba(3,5,16,.6)}
.wlock{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink2);font:600 .82rem var(--font-m);text-align:center;padding:12px}
.wlock svg{width:34px;height:34px;color:var(--dim)}
.wcard.done{border-color:rgba(61,255,160,.5)}
.hub-side{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px;margin-top:22px}
.sidecard{padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:rgba(9,14,38,.8);text-align:left;display:flex;gap:14px;align-items:center;transition:.2s;color:var(--ink)}
.sidecard:hover{border-color:var(--mag);box-shadow:0 0 26px rgba(255,61,240,.22);transform:translateY(-2px)}
.sidecard .ic{font:800 1.6rem var(--font-d);color:var(--mag);text-shadow:0 0 16px var(--mag);width:44px;text-align:center;flex:none}
.sidecard b{display:block;font-family:var(--font-d);font-size:.92rem}
.sidecard span{color:var(--ink2);font-size:.86rem}

/* ---------- Pila de paneles ---------- */
#panels{position:fixed;inset:0;z-index:30;pointer-events:none}
.pback{position:absolute;inset:0;background:radial-gradient(90% 90% at 50% 40%,rgba(3,5,18,.55),rgba(3,5,18,.9));opacity:0;transition:opacity .3s;pointer-events:none}
.pback.in{opacity:1;pointer-events:auto}
.panel{--wh:190;position:absolute;left:50%;top:50%;width:min(1120px,calc(100vw - 28px));height:min(94vh,calc(100vh - 28px));height:min(94dvh,calc(100dvh - 28px));transform:translate(-50%,-46%) scale(.94);opacity:0;display:flex;flex-direction:column;border-radius:22px;border:1px solid var(--line2);background:linear-gradient(160deg,rgba(14,22,60,.985),rgba(6,10,30,.99));box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.03) inset,0 0 60px hsla(var(--wh),100%,55%,.14);pointer-events:auto;transition:transform .42s cubic-bezier(.2,.9,.2,1),opacity .3s,filter .35s;overflow:hidden}
.panel::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--ac),var(--mag),transparent);animation:glowline 3s infinite;z-index:3}
.panel.in{transform:translate(-50%,-50%) scale(1);opacity:1}
.panel.out{transform:translate(-50%,-44%) scale(.95);opacity:0}
.panel.behind{transform:translate(-50%,-52%) scale(.93);filter:blur(2px) brightness(.55);pointer-events:none}
.panel.behind+.panel.behind{transform:translate(-50%,-54%) scale(.9)}
.phead{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);flex:none;background:rgba(5,8,24,.4)}
.phead .pk{font:700 .68rem var(--font-m);letter-spacing:.22em;text-transform:uppercase;color:var(--ac);text-shadow:0 0 10px var(--ac)}
.phead h2{font-size:clamp(1rem,2.6vw,1.35rem);margin-top:2px}
.phead .pt{flex:1;min-width:0}
.phead .px{margin-left:auto;display:flex;gap:6px;align-items:center}
.pbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:22px clamp(16px,3vw,34px) 34px;scroll-behavior:smooth}
.pfoot{flex:none;display:flex;gap:10px;justify-content:space-between;align-items:center;padding:12px 18px;border-top:1px solid var(--line);background:rgba(5,8,24,.5);flex-wrap:wrap}
.pin{animation:fadeUp .5s both}

/* ---------- Mundo: teselas ---------- */
.brief{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-bottom:22px}
.card{border:1px solid var(--line);background:var(--glass2);border-radius:var(--r);padding:16px 18px}
.card h3{font-size:.92rem;margin-bottom:8px;color:var(--ac)}
.card.ai{border-color:rgba(255,61,240,.4);background:linear-gradient(140deg,rgba(255,61,240,.1),rgba(20,32,74,.5))}
.card.ai h3{color:var(--mag)}
.dipcard{border-color:rgba(255,194,77,.5);background:linear-gradient(140deg,rgba(255,194,77,.14),rgba(20,32,74,.5))}
.dipcard h3{color:var(--amber)}
.dipcard p{margin-bottom:12px}
.sect{margin:24px 0 12px;display:flex;align-items:center;gap:10px}
.sect h3{font-size:.86rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);font-family:var(--font-m);font-weight:700}
.sect::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}
.tile{position:relative;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--glass3);display:flex;flex-direction:column;gap:6px;min-height:104px;transition:transform .2s,border-color .2s,box-shadow .2s;color:var(--ink);overflow:hidden}
.tile:hover:not(.locked){transform:translateY(-3px);border-color:var(--ac);box-shadow:0 8px 26px rgba(0,0,0,.4),0 0 22px hsla(var(--wh),100%,60%,.28)}
.tile .tk{font:700 .66rem var(--font-m);letter-spacing:.16em;text-transform:uppercase;color:var(--ac)}
.tile .tt{font:700 .95rem/1.25 var(--font-d);font-size:.86rem}
.tile .ts{color:var(--ink2);font-size:.82rem;margin-top:auto}
.tile .tst{position:absolute;right:10px;top:10px;display:flex;gap:1px;color:var(--amber)}
.tile .tst svg{width:14px;height:14px}
.tile .tst .off{color:rgba(255,255,255,.18)}
.tile.done{border-color:rgba(61,255,160,.45)}
.tile.done .tk::after{content:' ✓';color:var(--lime)}
.tile.locked{opacity:.45;cursor:not-allowed}
.tile.boss{grid-column:1/-1;min-height:96px;border-color:rgba(255,61,240,.5);background:linear-gradient(120deg,rgba(255,61,240,.16),rgba(20,32,74,.55))}
.tile.boss .tk{color:var(--mag)}
.tile.boss:hover:not(.locked){border-color:var(--mag);box-shadow:0 0 34px rgba(255,61,240,.4)}
.tile.boss .tt{font-size:1.05rem}
.list{margin:0;padding-left:1.1em}
.list li{margin:.35em 0}
.steps-recipe{counter-reset:s;list-style:none;padding:0;margin:0}
.steps-recipe li{counter-increment:s;position:relative;padding:8px 0 8px 40px}
.steps-recipe li::before{content:counter(s);position:absolute;left:0;top:7px;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font:700 .8rem var(--font-m);background:var(--acs);border:1px solid var(--ac);color:var(--ac)}
.pit{list-style:none;padding:0;margin:0}
.pit li{padding:8px 12px 8px 34px;position:relative;margin:6px 0;border-radius:10px;background:rgba(255,77,121,.07);border:1px solid rgba(255,77,121,.25)}
.pit li::before{content:'!';position:absolute;left:10px;top:8px;color:var(--red);font:800 1rem var(--font-m)}

/* ---------- Lecciones ---------- */
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:26px;height:5px;border-radius:9px;background:rgba(120,190,255,.2);transition:.3s}
.dots i.on{background:var(--ac);box-shadow:0 0 10px var(--ac)}
.dots i.done{background:rgba(61,255,160,.7)}
.lstep{animation:fadeUp .45s both}
.lstep h3{font-size:1.15rem;margin-bottom:12px}
.lstep .big{font-size:1.06rem}
.callout{padding:12px 16px;border-radius:12px;border-left:3px solid var(--ac);background:var(--acs);margin:12px 0}
.callout.warn{border-color:var(--amber);background:rgba(255,194,77,.09)}
.callout.ai{border-color:var(--mag);background:rgba(255,61,240,.09)}
.callout b.t{display:block;font:700 .7rem var(--font-m);letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px;color:var(--ink2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.qz{margin-top:18px;padding:16px;border-radius:14px;border:1px dashed var(--line2);background:rgba(20,32,74,.35)}
.qz h4{font-size:.85rem;color:var(--mag);margin-bottom:8px}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:10px 14px;border-radius:12px;border:1px solid var(--line2);background:rgba(10,16,44,.6);transition:.15s;min-height:46px;width:100%}
.opt:hover:not(:disabled){border-color:var(--cyan);background:rgba(34,230,255,.09)}
.opt .ol{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line2);font:700 .78rem var(--font-m);color:var(--ink2)}
.opt.sel{border-color:var(--amber);background:rgba(255,194,77,.1)}
.opt.ok{border-color:var(--lime);background:rgba(61,255,160,.12)}
.opt.ok .ol{background:var(--lime);color:#021;border-color:var(--lime)}
.opt.bad{border-color:var(--red);background:rgba(255,77,121,.1);animation:shake .4s}
.opt.bad .ol{background:var(--red);color:#fff;border-color:var(--red)}
.opt .thumbhost{width:120px;flex:none}
.opts.thumbs{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.opts.thumbs .opt{flex-direction:column;align-items:stretch}
.opts.thumbs .opt .thumbhost{width:100%}

/* ---------- Ejercicios ---------- */
.exq{font-size:1.06rem;margin-bottom:14px}
.exq .exq-t{display:block}
.vzhost{margin:14px 0}
.part{margin:14px 0;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--glass3);transition:border-color .3s,background .3s}
.part.ok{border-color:rgba(61,255,160,.55);background:rgba(61,255,160,.07)}
.part.ok .plab::before{content:'✓ ';color:var(--lime)}
.plab{font-weight:600;margin-bottom:8px}
.arow{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.arow input{flex:1;min-width:180px;font-family:var(--font-m);font-size:.95rem}
.prev{min-height:1.9em;margin:6px 2px 0;color:var(--ink2);font-size:.95rem;overflow-x:auto}
.syn{font:500 .74rem var(--font-m);color:var(--dim);margin-top:4px}
.fb{margin-top:10px;padding:10px 14px;border-radius:12px;border:1px solid var(--line2);background:rgba(34,230,255,.07);animation:fadeUp .3s both}
.fb b{display:block}
.fb.ok{border-color:var(--lime);background:rgba(61,255,160,.1)}
.fb.bad,.fb.err{border-color:var(--red);background:rgba(255,77,121,.09)}
.fb.hint{border-color:var(--amber);background:rgba(255,194,77,.09)}
.fb.warn{border-color:var(--amber)}
.exbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 6px}
.exbar .grow{flex:1}
.starsrow{display:flex;gap:3px;color:var(--amber)}
.starsrow svg{width:22px;height:22px;filter:drop-shadow(0 0 6px rgba(255,194,77,.6));transition:.3s}
.starsrow .off{color:rgba(255,255,255,.16);filter:none}
.reward{margin:22px 0;padding:22px;border-radius:18px;text-align:center;border:1px solid var(--lime);background:radial-gradient(120% 100% at 50% 0%,rgba(61,255,160,.16),rgba(20,32,74,.5));animation:fadeUp .5s both}
.reward.boss{border-color:var(--mag);background:radial-gradient(120% 100% at 50% 0%,rgba(255,61,240,.22),rgba(20,32,74,.5))}
.reward h3{font-size:1.3rem;margin-bottom:6px}
.reward .rstars{display:flex;justify-content:center;gap:8px;margin:10px 0}
.reward .rstars svg{width:42px;height:42px;color:var(--amber);opacity:0;transform:scale(.2) rotate(-40deg);filter:drop-shadow(0 0 12px var(--amber))}
.reward .rstars svg.pop{animation:starpop .6s cubic-bezier(.2,1.4,.3,1) forwards}
.reward .rstars svg.off{color:rgba(255,255,255,.18);filter:none}
@keyframes starpop{to{opacity:1;transform:none}}
.rxp{font:800 1.5rem var(--font-d);color:var(--cyan);text-shadow:0 0 18px var(--cyan)}
.solbox{margin-top:16px;padding:16px 18px;border-radius:14px;border:1px solid var(--line2);background:rgba(10,16,44,.55)}
.solbox h4{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);margin-bottom:8px;font-family:var(--font-m)}
.float{position:fixed;z-index:80;pointer-events:none;font:800 1.5rem var(--font-d);color:var(--cyan);text-shadow:0 0 16px var(--cyan);transform:translate(-50%,-50%);animation:floatup 1.6s ease-out forwards;white-space:nowrap}
.float.amber{color:var(--amber);text-shadow:0 0 16px var(--amber)}
.float.mag{color:var(--mag);text-shadow:0 0 16px var(--mag)}
.float.red{color:var(--red);text-shadow:0 0 16px var(--red)}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-70%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}

/* ---------- Jefe ---------- */
.bosshud{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-bottom:18px;padding:14px 18px;border-radius:16px;border:1px solid rgba(255,61,240,.5);background:linear-gradient(120deg,rgba(255,61,240,.14),rgba(20,32,74,.5))}
.bosshud .bicon{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font:900 2rem var(--font-d);color:var(--mag);border:1px solid var(--mag);box-shadow:0 0 26px rgba(255,61,240,.5),inset 0 0 20px rgba(255,61,240,.25);animation:pulse 2s infinite}
.bosshud h3{font-size:1.05rem;color:#fff}
.bosshud p{margin:.2em 0 .5em;color:var(--ink2);font-size:.9rem}
.hp{height:14px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid rgba(255,61,240,.4);position:relative}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--mag),var(--red));box-shadow:0 0 16px var(--mag);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.hp .ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(33.333% - 1px),rgba(5,8,24,.9) calc(33.333% - 1px) 33.333%)}
.phase-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.phase-tabs .chip.on{background:rgba(255,61,240,.2);border-color:var(--mag)}
.phase-tabs .chip.done{background:rgba(61,255,160,.12);border-color:var(--lime);color:#b8ffe0}
.bosshit{animation:bosshit .6s}
@keyframes bosshit{20%{filter:brightness(2.4) hue-rotate(50deg);transform:translateX(-7px)}50%{transform:translateX(6px)}}

/* ---------- Avisos y ventanas ---------- */
#toasts{position:fixed;right:14px;bottom:14px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none;max-width:min(380px,calc(100vw - 28px))}
.toast{pointer-events:auto;display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:14px;border:1px solid var(--line2);background:rgba(8,14,40,.94);backdrop-filter:blur(10px);box-shadow:0 10px 36px rgba(0,0,0,.5);transform:translateX(120%);opacity:0;transition:transform .4s cubic-bezier(.2,.9,.2,1),opacity .3s;cursor:pointer}
.toast.in{transform:none;opacity:1}
.toast.out{transform:translateX(120%);opacity:0}
.toast.ach{border-color:var(--amber);box-shadow:0 0 30px rgba(255,194,77,.3)}
.toast.lvl{border-color:var(--mag);box-shadow:0 0 34px rgba(255,61,240,.4)}
.toast .tb{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;background:rgba(255,194,77,.15);color:var(--amber);border:1px solid var(--amber)}
.toast .tb svg{width:22px;height:22px}
.toast .tx b{display:block;font:700 .92rem var(--font-d)}
.toast .tx span{color:var(--ink2);font-size:.86rem}
.modal-back{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:rgba(3,5,18,.72);backdrop-filter:blur(5px);opacity:0;transition:opacity .25s}
.modal-back.in{opacity:1}
.modal{position:relative;width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:24px 26px;border-radius:20px;border:1px solid var(--line2);background:linear-gradient(160deg,rgba(16,26,68,.97),rgba(7,11,32,.98));box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 40px rgba(34,230,255,.12);transform:scale(.94) translateY(10px);transition:transform .3s cubic-bezier(.2,1,.3,1)}
.modal-back.in .modal{transform:none}
.modal.wide{width:min(940px,100%)}
.modal.report{width:min(640px,100%)}
.modal h2{font-size:1.2rem;margin-bottom:10px}
.modal .mx{position:absolute;right:12px;top:12px;font-size:1.4rem;line-height:1}
.mactions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.flab{display:block;font:600 .8rem var(--font-m);color:var(--ink2);margin:10px 0 5px}
.note{color:var(--ink2);font-size:.88rem}
.setrow{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow>span{flex:1}
.setrow .rng{width:150px}
.switch{position:relative;width:48px;height:26px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;width:100%;height:100%}
.switch i{position:absolute;inset:0;border-radius:99px;background:rgba(120,190,255,.2);border:1px solid var(--line2);transition:.2s;pointer-events:none}
.switch i::after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--ink2);transition:.2s}
.switch input:checked+i{background:rgba(34,230,255,.3);border-color:var(--cyan)}
.switch input:checked+i::after{left:25px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.switch input:focus-visible+i{outline:2px solid var(--cyan);outline-offset:2px}
.menu-list{display:grid;gap:8px;margin-top:10px}
.menu-list .btn{justify-content:flex-start;width:100%}

/* ---------- Logros ---------- */
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.ach{display:flex;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--glass3)}
.ach .ab{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;border:1px solid var(--amber);background:rgba(255,194,77,.14);color:var(--amber);box-shadow:0 0 18px rgba(255,194,77,.3)}
.ach .ab svg{width:24px;height:24px}
.ach.locked{opacity:.5}
.ach.locked .ab{border-color:var(--line2);background:rgba(120,190,255,.06);color:var(--dim);box-shadow:none}
.ach b{display:block;font:700 .84rem var(--font-d)}
.ach span{color:var(--ink2);font-size:.82rem}
.ach .pr{height:4px;background:rgba(120,190,255,.15);border-radius:9px;margin-top:6px;overflow:hidden}
.ach .pr i{display:block;height:100%;background:var(--amber)}

/* ---------- Formulario ---------- */
.fgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.fcard{padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--glass3)}
.fcard h4{font-size:.8rem;margin-bottom:6px;color:var(--ac);letter-spacing:.06em}
.fcard mjx-container[display="true"]{margin:.35em 0!important}

/* ---------- Arcade ---------- */
.arc-hud{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.arc-time{flex:1;min-width:160px;height:12px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid var(--line2)}
.arc-time i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--lime),var(--amber),var(--red));transform-origin:left;transition:transform .2s linear}
.arc-score{font:800 1.8rem var(--font-d);color:var(--cyan);text-shadow:0 0 16px var(--cyan)}
.arc-q{font-size:1.25rem;padding:20px;border:1px solid var(--line2);border-radius:16px;background:rgba(10,16,44,.65);text-align:center;margin-bottom:12px}
.arc-q .cat{display:block;font:700 .68rem var(--font-m);letter-spacing:.2em;text-transform:uppercase;color:var(--mag);margin-bottom:8px}
.combo{font:800 1rem var(--font-m);color:var(--amber)}
.arc-final{text-align:center;padding:16px}
.arc-final .big{font:900 3.2rem var(--font-d);color:var(--cyan);text-shadow:0 0 30px var(--cyan)}

/* ---------- Visualizaciones ---------- */
.vz{display:flex;flex-direction:column;gap:8px}
.vz-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:0}
.vz-bar:empty{display:none}
.vz-hint{font:500 .76rem var(--font-m);color:var(--ink2)}
.vz-tabs{display:flex;gap:4px;padding:3px;border-radius:12px;background:rgba(3,6,20,.7);border:1px solid var(--line)}
.vz-tabs button{border:none;background:transparent;color:var(--ink2);padding:6px 12px;border-radius:9px;font:600 .82rem var(--font-b)}
.vz-tabs button.on{background:rgba(34,230,255,.2);color:#fff;box-shadow:0 0 12px rgba(34,230,255,.3)}
.vz-panes{position:relative}
.vz-stage{position:relative;width:100%;aspect-ratio:16/10;max-height:min(58vh,560px);border-radius:14px;overflow:hidden;background:radial-gradient(120% 100% at 50% 0%,#0a1236,#03050f);border:1px solid var(--line2);touch-action:pan-y}
.vz-stage canvas{position:absolute;left:0;top:0;display:block}
.vz-stage.thumb{aspect-ratio:1.3;max-height:none;border-radius:10px;pointer-events:none}
.vz-read{position:absolute;left:46px;top:10px;font:500 .72rem/1.45 var(--font-m);white-space:pre;color:#cfe4ff;text-shadow:0 1px 6px #000,0 0 3px #000;pointer-events:none}
.vz-ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vz-ctl:empty{display:none}
.vz-sl{display:flex;align-items:center;gap:10px;flex:1;min-width:200px;padding:4px 12px;border-radius:12px;background:rgba(3,6,20,.6);border:1px solid var(--line)}
.vz-sl .k{font:700 .85rem var(--font-m);color:var(--cyan)}
.vz-sl output{font:600 .82rem var(--font-m);min-width:3.6em;text-align:right;color:var(--ink)}
.vz-sel{width:auto;padding:6px 10px;border-radius:10px;font-size:.85rem}
.vz-info{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vz-info:empty{display:none}
.vz-gauge{width:100%;padding:8px 2px}
.vz-gauge .gz{position:relative;height:14px;border-radius:99px;background:rgba(120,190,255,.14);border:1px solid var(--line)}
.vz-gauge .gz::after{content:'';position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--ink2)}
.vz-gauge .gz i{position:absolute;top:0;bottom:0;border-radius:99px}
.vz-gauge .gz i.pos{background:linear-gradient(90deg,var(--cyan),var(--lime));box-shadow:0 0 12px var(--lime)}
.vz-gauge .gz i.neg{background:linear-gradient(90deg,var(--red),var(--mag));box-shadow:0 0 12px var(--red)}
.vz-gauge .gl{display:flex;justify-content:space-between;font:500 .72rem var(--font-m);color:var(--ink2);margin-top:4px}
.vz-gauge .gv{font:500 .86rem var(--font-m);margin-top:6px}
.vz-lg{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- Panel docente ---------- */
.tp-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tp-tab{padding:8px 16px;border-radius:99px;border:1px solid var(--line2);background:transparent;font-weight:600;color:var(--ink2)}
.tp-tab[aria-selected=true]{background:rgba(34,230,255,.2);border-color:var(--cyan);color:#fff}
.tp-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:end}
.tp-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tp-sel{width:auto}
.tp-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px;margin:14px 0}
.tp-kpi{padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--glass3);display:flex;flex-direction:column;gap:2px}
.tp-kpi span{font:600 .74rem var(--font-m);color:var(--ink2)}
.tp-kpi b{font:800 1.7rem var(--font-d);color:var(--cyan)}
.tp-kpi i{font-style:normal;font-size:.78rem;color:var(--dim)}
.tp-kpis.sm .tp-kpi b{font-size:1.2rem}
.tp-cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.tp-cols h2,.tp-h2b{font-size:1rem;margin:0 0 8px}
.tp-h2b{margin-top:22px}
.tp-fix{margin:12px 0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--glass3)}
.tp-fix h3{font-size:.9rem;margin-bottom:6px}
.tp-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:var(--cyan);box-shadow:0 0 8px currentColor}
.tp-bar{display:flex;align-items:center;gap:10px;margin:4px 0}
.tp-segs{display:flex;height:12px;border-radius:9px;overflow:hidden;min-width:2px}
.tp-segs i{display:block;min-width:2px}
.tp-bar b{font:700 .8rem var(--font-m)}
.tp-legend{list-style:none;padding:0;margin:8px 0;display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--ink2)}
.tp-legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.tp-legend.big{flex-direction:column;gap:6px}
.tp-legend.big li{display:flex;gap:6px;align-items:center}.tp-legend.big b{margin-left:auto;color:var(--ink)}
.tp-share{display:flex;height:22px;border-radius:99px;overflow:hidden;margin:8px 0}
.tp-share i{display:block}
.tp-top{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.tp-top li{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--glass3)}
.tp-topname{display:flex;flex-direction:column;gap:2px}
.tp-meta{font-size:.78rem;color:var(--dim)}
.tp-tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;margin:8px 0 14px}
.tp-t{width:100%;border-collapse:collapse;font-size:.86rem}
.tp-t th,.tp-t td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
.tp-t thead th{font:700 .7rem var(--font-m);letter-spacing:.06em;color:var(--ink2);background:rgba(20,32,74,.5);white-space:nowrap}
.tp-t .num{text-align:right;font-family:var(--font-m);white-space:nowrap}
.tp-t small{color:var(--dim);margin-left:4px}
.tp-adv td{color:var(--ink2);font-size:.82rem;padding-top:0;background:rgba(20,32,74,.2)}
.tp-barcell{min-width:180px}
.tp-link{background:none;border:none;color:var(--cyan);padding:0;font-weight:600;text-align:left}
.tp-link:hover{text-decoration:underline}
.tp-sortb{background:none;border:none;color:inherit;font:inherit;padding:0;white-space:nowrap}
.tp-sortb i{font-style:normal;margin-left:4px;color:var(--cyan)}
.tp-search{max-width:340px}
.tp-tools{display:flex;gap:12px;align-items:center;margin:8px 0}
.tp-heat{border-collapse:separate;border-spacing:3px;font-size:.82rem}
.tp-heat th{font:600 .72rem var(--font-m);color:var(--ink2);padding:4px 6px}
.hm-name{text-align:left;white-space:nowrap;min-width:150px}
.hc{position:relative;text-align:center;min-width:52px;height:36px;border-radius:8px;font:700 .85rem var(--font-m);background:rgba(120,190,255,.06)}

      }

    }
    musTimer=setTimeout(tickMusic,140);
  }
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) S.suspend(); else S.resume(); });
  return S;
})();

/* ================= FONDO ANIMADO: terreno de una función f(x,y) que se transforma ================= */
const BG=(()=>{

    glyphs=[]; for(let i=0;i<Q[q].glyphs;i++) glyphs.push(newGlyph(true));

  function newGlyph(init){ return {c:GL[Math.floor(Math.random()*GL.length)],x:Math.random(),y:init?Math.random():1.05,s:14+Math.random()*30,v:.008+Math.random()*.02,a:.05+Math.random()*.13,r:Math.random()*6}; }

  function draw(dt){

    const sky=cx.createLinearGradient(0,0,0,H);

    g.addColorStop(0,hsl(hue+40,100,62,.55)); g.addColorStop(.25,hsl(hue+20,100,50,.22)); g.addColorStop(1,'rgba(0,0,0,0)');

    const bob=Math.sin(t*.55)*.06;

      cx.strokeStyle=hsl(hue+30,100,64,.34); cx.lineWidth=1; cx.stroke();

  }
  function frame(now){
    raf=0; if(!run) return;
    const dtRaw=now-last||16; last=now;
    const fps=dimmed&&Q[q].fps?Math.min(Q[q].fps,24):Q[q].fps; acc+=dtRaw;
    if(fps&&acc<1000/fps-1){ raf=requestAnimationFrame(frame); return; }

    const k=1-Math.pow(.001,dt/1000*1.1);

/* ================= PARTÍCULAS NEÓN (chispas, anillos, confeti) ================= */
const FX=(()=>{
  let cv=null,cx=null,W=0,H=0,dpr=1,parts=[],rings=[],raf=0;
  function resize(){ if(!cv) return; dpr=Math.min(window.devicePixelRatio||1,2); W=window.innerWidth; H=window.innerHeight; cv.width=W*dpr; cv.height=H*dpr; cx.setTransform(dpr,0,0,dpr,0,0); }
  function loop(){
    cx.clearRect(0,0,W,H); cx.globalCompositeOperation='lighter';
    parts=parts.filter(p=>p.life>0&&p.y<H+40);
    for(const p of parts){
      p.vy+=p.g; p.vx*=.985; p.vy*=.995; p.x+=p.vx; p.y+=p.vy; p.life--; p.rot+=p.vr;
      const a=Math.min(1,p.life/22);
      cx.globalAlpha=a; cx.fillStyle=p.col;
      if(p.shape===0){ cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.fillRect(-p.s,-p.s*.25,p.s*2,p.s*.5); cx.restore(); }
      else{ cx.beginPath(); cx.arc(p.x,p.y,p.s*.6,0,TAU); cx.fill(); }
    }
    rings=rings.filter(r=>r.life>0);
    for(const r of rings){
      r.life--; const k=1-r.life/r.max; r.r=r.r0+(r.r1-r.r0)*(1-Math.pow(1-k,3));
      cx.globalAlpha=(1-k)*.85; cx.strokeStyle=r.col; cx.lineWidth=r.w*(1-k)+.5; cx.beginPath(); cx.arc(r.x,r.y,r.r,0,TAU); cx.stroke();
    }
    cx.globalAlpha=1; cx.globalCompositeOperation='source-over';
    if(parts.length||rings.length) raf=requestAnimationFrame(loop); else{ raf=0; cx.clearRect(0,0,W,H); }
  }
  const PALS=[[COL.cyan,COL.mag,COL.lime,COL.vio,'#ffffff'],[COL.amber,'#ffe08a',COL.mag,'#ffffff']];
  const api={
    init(){ cv=document.getElementById('fx'); cx=cv.getContext('2d'); resize(); window.addEventListener('resize',resize); },
    burst(n,o){
      if(REDUCED||isClass()&&!(o&&o.force)||!cx) return; o=o||{};
      const cols=o.cols||PALS[0], x=(o.x!=null?o.x:.5)*W, y=(o.y!=null?o.y:.4)*H;
      const cap=BG.quality>=3?1:BG.quality===2?.6:.35; n=Math.round((n||80)*cap);

        const a=(o.up?-Math.PI/2+(Math.random()-.5)*1.5:Math.random()*TAU), sp=(o.up?7:3)+Math.random()*(o.up?10:9);
        parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(o.up?2:0),g:.16,vr:(Math.random()-.5)*.4,rot:Math.random()*6,s:2+Math.random()*4.5,col:cols[i%cols.length],shape:Math.random()<.55?0:1,life:60+Math.random()*60});
      }
      if(!raf) raf=requestAnimationFrame(loop);
    },
    ring(x,y,col,r1){
      if(REDUCED||!cx) return; rings.push({x:x*W,y:y*H,r0:6,r1:r1||160,col:col||COL.cyan,w:4,life:34,max:34,r:6});
      if(!raf) raf=requestAnimationFrame(loop);
    },
    ringAt(el,col){ if(!el||!el.getBoundingClientRect) return; const r=el.getBoundingClientRect(); FX.ring((r.left+r.width/2)/W,(r.top+r.height/2)/H,col,Math.max(80,r.width*.7)); },
    float(txt,anchor,cls){
      const r=anchor&&anchor.getBoundingClientRect?anchor.getBoundingClientRect():{left:window.innerWidth/2,top:window.innerHeight/3,width:0,height:0};
      const f=document.createElement('div'); f.className='float '+(cls||''); f.textContent=txt;
      f.style.left=(r.left+r.width/2)+'px'; f.style.top=(r.top+r.height/2)+'px';

    },
    shake(el){ if(REDUCED||!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); setTimeout(()=>el.classList.remove('shake'),520); }
  };
  return api;

function makeLUT(stops,n){
  n=n||256; const out=new Array(n);
  for(let i=0;i<n;i++){
    const t=i/(n-1); let k=0; while(k<stops.length-2&&t>stops[k+1][0]) k++;
    const a=stops[k], b=stops[k+1], u=clamp((t-a[0])/(b[0]-a[0]),0,1);
    out[i]=[Math.round(lerp(a[1][0],b[1][0],u)),Math.round(lerp(a[1][1],b[1][1],u)),Math.round(lerp(a[1][2],b[1][2],u))];
  }
  return out;
}

    for(const g of this.geo){

    }

function fieldStats(f,xr,yr,n){
  const vals=[]; n=n||26;
  for(let j=0;j<=n;j++)for(let i=0;i<=n;i++){ const v=f(xr[0]+(xr[1]-xr[0])*i/n,yr[0]+(yr[1]-yr[0])*j/n); if(isFinite(v)) vals.push(v); }

/* ---------- Cociente incremental: la secante se convierte en tangente ---------- */
function vSecant(host,spec,o){
  const fr=vzFrame(host), f=F2(spec.f), wrt=spec.wrt||'x', a=spec.a, b=spec.b, t0=wrt==='x'?a:b;

  const m=(hi-lo)*.25+.3; const yr=spec.yr||[lo-m,hi+m];

  const quot=h=>(phi(t0+h)-phi(t0))/h;
  const P=new Plot2D(p.cv,{xr:win,yr,eq:false,paint:(pl,cx)=>{
    pl.bg(); pl.axes({xl:wrt,yl:'z'});
    pl.curve(t=>[t,phi(t)],win[0],win[1],160,COL.cyan,2.6,null,true);
    const h=st.h, q=quot(h);
    pl.lineSlope(t0,phi(t0),d,COL.mag,1.8,[6,5]);
    if(Math.abs(h)>1e-9){
      pl.lineSlope(t0,phi(t0),q,COL.amber,2.2);
      pl.line(t0,phi(t0),t0+h,phi(t0),'rgba(255,255,255,.5)',1.2,[3,4]);
      pl.line(t0+h,phi(t0),t0+h,phi(t0+h),'rgba(255,255,255,.5)',1.2,[3,4]);
      pl.dot(t0+h,phi(t0+h),COL.amber,5.5);
      pl.label('h',t0+h/2,phi(t0),'#fff',11,'center',0,15);

    }

  }});
  const upd=()=>{ const h=st.h; p.rd.textContent=(Math.abs(h)<1e-9?'h → 0':'h = '+nfmt(h,3))+'\ncociente = '+(Math.abs(h)<1e-9?'—':nfmt(quot(h),4))+'\nf'+wrt+'(a,b) = '+nfmt(d,4); };
  const sl=mkSlider('h',-1.5,1.5,.01,st.h,v=>nfmt(v,2),v=>{ if(Math.abs(v)<.005){v=v<0?-.005:.005;} st.h=v; upd(); P.ask(); });
  const go=mkBtn('Animar h → 0','primary',()=>{ const from=st.h||1, t1=performance.now(); cancelAnimationFrame(st.anim);
    const step=now=>{ const u=clamp((now-t1)/2600,0,1), e=1-Math.pow(1-u,3); st.h=from*Math.pow(.004,e); if(u>=1) st.h=from>0?.004:-.004; sl.set(st.h); upd(); P.ask(); if(u<1) st.anim=requestAnimationFrame(step); };
    st.anim=requestAnimationFrame(step); });

  upd();
  return {dispose(){cancelAnimationFrame(st.anim);P.dispose();}};

/* ---------- Multiplicadores de Lagrange: punto sobre la restricción ---------- */

  const st={t:spec.t0!=null?spec.t0:tr[0]+(tr[1]-tr[0])*.13}, p=vzPane(fr.panes), key='l'+spec.f;
  const pt=t=>[px(t),py(t)];
  const P=new Plot2D(p.cv,{xr,yr,paint:(pl,cx)=>{
    const h=pl.heat(f,key,spec.zr); pl.levels(f,key,autoLevels(h.lo,h.hi,11),'rgba(230,248,255,.3)',1,1); pl.axes({xl:'x',yl:'y'});
    pl.curve(pt,tr[0],tr[1],240,COL.mag,3,null,true);

    const nf=Math.hypot(Gf[0],Gf[1])||1, ng=Math.hypot(Gg[0],Gg[1])||1;
    pl.arrow(q[0],q[1],q[0]+Gf[0]/nf*s,q[1]+Gf[1]/nf*s,COL.cyan,2.8,12); pl.arrow(q[0],q[1],q[0]+Gg[0]/ng*s*.85,q[1]+Gg[1]/ng*s*.85,'#ffffff',2.4,11);

/* ---------- Región de integración con franja móvil (integral iterada) ---------- */
function vRegion(host,spec,o){
  const fr=vzFrame(host), f=F2(spec.f), xr=spec.xr||[-.5,2], yr=spec.yr||[-.5,2], p=vzPane(fr.panes);
  const polar=!!spec.polar, ordY=spec.ord==='y';
  const lo=polar?null:(ordY?F1(spec.lo.replace(/\by\b/g,'x')):F1(spec.lo)), hi=polar?null:(ordY?F1(spec.hi.replace(/\by\b/g,'x')):F1(spec.hi));
  const A=polar?spec.polar.th[0]:spec.a, B=polar?spec.polar.th[1]:spec.b;
  const st={s:A+(B-A)*.35};
  const inner=s=>{
    if(polar){ const r1=spec.polar.r[0], r2=spec.polar.r[1]; return integ1(r=>f(r*Math.cos(s),r*Math.sin(s))*r,r1,r2,4); }
    return ordY?integ1(x=>f(x,s),lo(s),hi(s),4):integ1(y=>f(s,y),lo(s),hi(s),4);
  };
  const total=spec.exact!=null?spec.exact:integ1(inner,A,B,10);
  const bnd=(n)=>{ const pts=[];
    if(polar){ const [r1,r2]=spec.polar.r, [t1,t2]=spec.polar.th; for(let i=0;i<=n;i++){const t=t1+(t2-t1)*i/n; pts.push([r2*Math.cos(t),r2*Math.sin(t)]);} for(let i=n;i>=0;i--){const t=t1+(t2-t1)*i/n; pts.push([r1*Math.cos(t),r1*Math.sin(t)]);} return pts; }
    if(!ordY){ for(let i=0;i<=n;i++){const x=A+(B-A)*i/n; pts.push([x,lo(x)]);} for(let i=n;i>=0;i--){const x=A+(B-A)*i/n; pts.push([x,hi(x)]);} }
    else{ for(let i=0;i<=n;i++){const y=A+(B-A)*i/n; pts.push([lo(y),y]);} for(let i=n;i>=0;i--){const y=A+(B-A)*i/n; pts.push([hi(y),y]);} }
    return pts; };
  const P=new Plot2D(p.cv,{xr,yr,paint:(pl,cx)=>{
    pl.bg(); pl.axes({xl:'x',yl:'y'});
    const poly=bnd(80); pl.poly(poly,'rgba(34,230,255,.16)',COL.cyan,2.2);
    // franja acumulada
    let acc=[]; const n=40;
    if(polar){ const [r1,r2]=spec.polar.r, t1=spec.polar.th[0]; for(let i=0;i<=n;i++){const t=t1+(st.s-t1)*i/n; acc.push([r2*Math.cos(t),r2*Math.sin(t)]);} for(let i=n;i>=0;i--){const t=t1+(st.s-t1)*i/n; acc.push([r1*Math.cos(t),r1*Math.sin(t)]);} }
    else if(!ordY){ for(let i=0;i<=n;i++){const x=A+(st.s-A)*i/n; acc.push([x,lo(x)]);} for(let i=n;i>=0;i--){const x=A+(st.s-A)*i/n; acc.push([x,hi(x)]);} }
    else{ for(let i=0;i<=n;i++){const y=A+(st.s-A)*i/n; acc.push([lo(y),y]);} for(let i=n;i>=0;i--){const y=A+(st.s-A)*i/n; acc.push([hi(y),y]);} }
    pl.poly(acc,'rgba(255,61,240,.16)');
    if(polar){ pl.line(spec.polar.r[0]*Math.cos(st.s),spec.polar.r[0]*Math.sin(st.s),spec.polar.r[1]*Math.cos(st.s),spec.polar.r[1]*Math.sin(st.s),COL.amber,3.2); }
    else if(!ordY) pl.line(st.s,lo(st.s),st.s,hi(st.s),COL.amber,3.2); else pl.line(lo(st.s),st.s,hi(st.s),st.s,COL.amber,3.2);
    (spec.labels||[]).forEach(l=>pl.label(l[2],l[0],l[1],'#fff',12,'left',6,-6));
  }});
  const upd=()=>{ const I=inner(st.s); p.rd.textContent=(polar?'θ':ordY?'y':'x')+' = '+nfmt(st.s,2)+'\ninterna = '+nfmt(I,4); };
  const sl=mkSlider(polar?'θ':ordY?'y':'x',A,B,(B-A)/200,st.s,v=>nfmt(v,2),v=>{st.s=v;upd();P.ask();});
  fr.bar.appendChild(el('span','vz-hint','La franja ámbar es la integral interna; al barrer la región se acumula la integral externa.'));
  fr.ctl.appendChild(sl.el); fr.info.innerHTML='<span class="chip">Integral total = '+nfmt(total,4)+'</span>'+(spec.note?'<span class="chip">'+spec.note+'</span>':''); upd();
  return {dispose(){P.dispose();}};
}

/* ---------- Sumas de Riemann dobles como barras 3D ---------- */
function vRiemann(host,spec,o){
  const fr=vzFrame(host), f=F2(spec.f), xr=spec.xr, yr=spec.yr, exact=spec.exact!=null?spec.exact:integ2(f,xr[0],xr[1],yr[0],yr[1]);
  const p=vzPane(fr.panes), st={n:spec.n0||3,mode:'ll'};
  const s=fieldStats(f,xr,yr), zr=[Math.min(0,s[0]),Math.max(s[1],.001)*1.05];
  const P=new Plot3D(p.cv,{auto:!REDUCED});
  const sum=()=>{
    const n=st.n, dx=(xr[1]-xr[0])/n, dy=(yr[1]-yr[0])/n; let S=0;
    for(let j=0;j<n;j++)for(let i=0;i<n;i++){ const fx=st.mode==='ll'?0:st.mode==='mid'?.5:1; S+=f(xr[0]+(i+fx)*dx,yr[0]+(j+fx)*dy)*dx*dy; }
    return S;
  };
  const build=()=>{
    P.clear(); P.setBox(xr,yr,zr); P.boxAxes(['x','y','z']);
    P.surface(f,xr,yr,14,{zr,alpha:.16,edge:'rgba(150,235,255,.2)'});
    const n=st.n, dx=(xr[1]-xr[0])/n, dy=(yr[1]-yr[0])/n, fx=st.mode==='ll'?0:st.mode==='mid'?.5:1;
    for(let j=0;j<n;j++)for(let i=0;i<n;i++){
      const x0=xr[0]+i*dx, y0=yr[0]+j*dy, h=clamp(f(x0+fx*dx,y0+fx*dy),zr[0],zr[1]); if(!isFinite(h)) continue;
      const t=(h-zr[0])/(zr[1]-zr[0]), col=lutRGB(HEAT,t,.72), edge='rgba(255,255,255,.32)', z0=0;
      const c=(x,y,z)=>[x,y,z];
      P.poly([c(x0,y0,h),c(x0+dx,y0,h),c(x0+dx,y0+dy,h),c(x0,y0+dy,h)],col,edge);
      P.poly([c(x0,y0,z0),c(x0+dx,y0,z0),c(x0+dx,y0,h),c(x0,y0,h)],lutRGB(HEAT,t*.85,.6),edge);
      P.poly([c(x0+dx,y0,z0),c(x0+dx,y0+dy,z0),c(x0+dx,y0+dy,h),c(x0+dx,y0,h)],lutRGB(HEAT,t*.7,.6),edge);
      P.poly([c(x0+dx,y0+dy,z0),c(x0,y0+dy,z0),c(x0,y0+dy,h),c(x0+dx,y0+dy,h)],lutRGB(HEAT,t*.85,.6),edge);
      P.poly([c(x0,y0+dy,z0),c(x0,y0,z0),c(x0,y0,h),c(x0,y0+dy,h)],lutRGB(HEAT,t*.7,.6),edge);
    }
    const S=sum(); p.rd.textContent='n = '+n+' → '+(n*n)+' rectángulos\nsuma = '+nfmt(S,4)+'\nexacto = '+nfmt(exact,4)+'\nerror = '+nfmt(Math.abs(S-exact),4);
    P.ask();
  };
  const sl=mkSlider('n',1,14,1,st.n,v=>String(v),v=>{st.n=v;build();});
  const sel=el('select','vz-sel'); sel.innerHTML='<option value="ll">Esquina inferior izquierda</option><option value="mid">Centro</option><option value="ur">Esquina superior derecha</option>';
  sel.addEventListener('change',()=>{st.mode=sel.value;build();});
  fr.bar.appendChild(el('span','vz-hint','Cada barra tiene volumen f(xᵢ, yⱼ)·ΔA. Más barras: la suma converge a la integral doble.'));
  fr.ctl.append(sl.el,sel); build();
  return {dispose(){P.dispose();}};
}

/* ================= Selectores interactivos: pintar dominio, elegir dirección, señalar un punto ================= */
function makePaint(host,cfg){
  const fr=vzFrame(host), p=vzPane(fr.panes), N=cfg.n||20, xr=cfg.xr||[-4,4], yr=cfg.yr||[-4,4];
  const cells=new Uint8Array(N*N), st={brush:1,down:false,reveal:false,fx:null};
  const cw=(xr[1]-xr[0])/N, ch=(yr[1]-yr[0])/N;
  const cellAt=(x,y)=>{const i=Math.floor((x-xr[0])/cw), j=Math.floor((y-yr[0])/ch); return (i<0||j<0||i>=N||j>=N)?-1:j*N+i;};
  const truth=(i,j)=>{ const xs=[xr[0]+(i+.5)*cw, xr[0]+(i+.02)*cw, xr[0]+(i+.98)*cw], ys=[yr[0]+(j+.5)*ch, yr[0]+(j+.02)*ch, yr[0]+(j+.98)*ch]; let a=null,amb=false; for(const x of xs)for(const y of ys){const v=!!cfg.pred(x,y); if(a===null)a=v; else if(a!==v) amb=true;} return {v:cfg.pred(xs[0],ys[0]),amb}; };
  const P=new Plot2D(p.cv,{xr:[xr[0]-.4,xr[1]+.4],yr:[yr[0]-.4,yr[1]+.4],paint:(pl,cx)=>{
    pl.bg(); pl.axes({xl:'x',yl:'y'});
    for(let j=0;j<N;j++)for(let i=0;i<N;i++){
      const x0=xr[0]+i*cw, y0=yr[0]+j*ch, X0=pl.X(x0), Y0=pl.Y(y0+ch), w=cw*pl.sx, h=ch*pl.sy;
      if(cells[j*N+i]){ cx.fillStyle='rgba(34,230,255,.42)'; cx.fillRect(X0+.5,Y0+.5,w-1,h-1); }
      if(st.reveal){ const t=truth(i,j); if(!t.amb&&t.v){ cx.strokeStyle='rgba(61,255,160,.9)'; cx.lineWidth=1.4; cx.strokeRect(X0+1.5,Y0+1.5,w-3,h-3); } }
    }
    cx.strokeStyle='rgba(255,255,255,.14)'; cx.lineWidth=1; cx.beginPath();
    for(let i=0;i<=N;i++){const X=Math.round(pl.X(xr[0]+i*cw))+.5; cx.moveTo(X,pl.Y(yr[1])); cx.lineTo(X,pl.Y(yr[0]));}
    for(let j=0;j<=N;j++){const Y=Math.round(pl.Y(yr[0]+j*ch))+.5; cx.moveTo(pl.X(xr[0]),Y); cx.lineTo(pl.X(xr[1]),Y);}
    cx.stroke();
    if(cfg.curves) cfg.curves.forEach(c=>pl.curve(c.fn,c.t0,c.t1,200,c.col||COL.lime,2.2,c.dash));
  }});
  const paintAt=e=>{ const r=p.cv.getBoundingClientRect(), c=cellAt(P.ix(e.clientX-r.left),P.iy(e.clientY-r.top)); if(c>=0&&cells[c]!==st.brush){cells[c]=st.brush;P.ask();SND.tick();} };
  p.cv.style.touchAction='none'; p.cv.style.cursor='crosshair';
  p.cv.addEventListener('pointerdown',e=>{ if(st.reveal) return; const r=p.cv.getBoundingClientRect(), c=cellAt(P.ix(e.clientX-r.left),P.iy(e.clientY-r.top)); if(c<0) return; st.brush=e.button===2||e.altKey?0:(cells[c]?0:1); st.down=true; try{p.cv.setPointerCapture(e.pointerId);}catch(_){} paintAt(e); });
  p.cv.addEventListener('pointermove',e=>{ if(st.down) paintAt(e); });
  p.cv.addEventListener('pointerup',()=>{st.down=false;}); p.cv.addEventListener('pointercancel',()=>{st.down=false;});
  p.cv.addEventListener('contextmenu',e=>e.preventDefault());
  fr.bar.appendChild(el('span','vz-hint','Haz clic o arrastra para pintar la región. Clic sobre una celda pintada la borra.'));
  fr.ctl.append(mkBtn('Limpiar','',()=>{cells.fill(0);P.ask();}),mkBtn('Rellenar todo','',()=>{cells.fill(1);P.ask();}),mkBtn('Invertir','',()=>{for(let i=0;i<cells.length;i++)cells[i]^=1;P.ask();}));
  return {
    check(){
      let tp=0,tn=0,fp=0,fn=0;
      for(let j=0;j<N;j++)for(let i=0;i<N;i++){ const t=truth(i,j); if(t.amb) continue; const c=!!cells[j*N+i]; if(t.v&&c)tp++; else if(!t.v&&!c)tn++; else if(c)fp++; else fn++; }
      const tot=tp+tn+fp+fn, acc=(tp+tn)/tot;
      return {ok:acc>=.94&&fp/tot<.045&&fn/tot<.045,acc,fp,fn,empty:!cells.some(Boolean)};
    },
    reveal(){ st.reveal=true; P.ask(); },
    dispose(){P.dispose();}
  };
}
function makeDirPick(host,cfg){
  const fr=vzFrame(host), p=vzPane(fr.panes), f=F2(cfg.f), xr=cfg.xr||[-3,3], yr=cfg.yr||[-3,3], P0=cfg.P;
  const st={hov:null,sel:null,reveal:false}, key='dp'+cfg.f, G=grad2(f,P0[0],P0[1]);
  const P=new Plot2D(p.cv,{xr,yr,paint:(pl,cx)=>{
    const h=pl.heat(f,key,cfg.zr); pl.levels(f,key,autoLevels(h.lo,h.hi,11),'rgba(230,248,255,.4)',1,1); pl.axes({xl:'x',yl:'y'});
    const s=(pl.vx[1]-pl.vx[0])*.22;
    const arr=(a,col,dash)=>{ const r=a*Math.PI/180; if(dash){ pl.line(P0[0],P0[1],P0[0]+Math.cos(r)*s,P0[1]+Math.sin(r)*s,col,2,[5,5]); } else pl.arrow(P0[0],P0[1],P0[0]+Math.cos(r)*s,P0[1]+Math.sin(r)*s,col,3,13); };
    if(st.hov!=null&&st.sel==null) arr(st.hov,'rgba(255,255,255,.7)',true);
    if(st.sel!=null) arr(st.sel,COL.amber);
    if(st.reveal) arr(ang(G[0],G[1]),COL.cyan);
    pl.dot(P0[0],P0[1],'#fff',6,true); pl.label('P',P0[0],P0[1],'#fff',12,'left',9,-9);
  }});
  p.cv.style.touchAction='none'; p.cv.style.cursor='crosshair';
  const angFrom=e=>{const r=p.cv.getBoundingClientRect(); return ang(P.ix(e.clientX-r.left)-P0[0],P.iy(e.clientY-r.top)-P0[1]);};
  p.cv.addEventListener('pointermove',e=>{ if(st.reveal) return; st.hov=angFrom(e); P.ask(); });
  p.cv.addEventListener('pointerleave',()=>{st.hov=null;P.ask();});
  p.cv.addEventListener('pointerdown',e=>{ if(st.reveal) return; st.sel=angFrom(e); p.rd.textContent='Dirección elegida: '+Math.round(st.sel)+'°'; P.ask(); SND.click(); });
  fr.bar.appendChild(el('span','vz-hint','Haz clic en el mapa: la flecha ámbar sale de P hacia el punto donde hiciste clic.'));
  p.rd.textContent='Elige una dirección con un clic';
  return {
    angle(){return st.sel;}, target(){return ang(G[0],G[1]);},
    reveal(){st.reveal=true;P.ask();}, dispose(){P.dispose();}
  };
}
function makePtPick(host,cfg){
  const fr=vzFrame(host), p=vzPane(fr.panes), f=F2(cfg.f), xr=cfg.xr||[-3,3], yr=cfg.yr||[-3,3];
  const st={sel:null,reveal:false}, key='pp'+cfg.f;
  const P=new Plot2D(p.cv,{xr,yr,paint:(pl,cx)=>{
    const h=pl.heat(f,key,cfg.zr); pl.levels(f,key,cfg.levels||autoLevels(h.lo,h.hi,11),'rgba(230,248,255,.4)',1,1); pl.axes({xl:'x',yl:'y'});
    if(st.reveal&&cfg.reveal) cfg.reveal.forEach(c=>{ pl.level(f,key,c,COL.lime,2.6,1); });

  p.cv.addEventListener('pointerdown',e=>{ if(st.reveal) return; const r=p.cv.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top; if(!P.inside(px,py)) return; st.sel=[P.ix(px),P.iy(py)]; p.rd.textContent='x='+nfmt(st.sel[0])+'  y='+nfmt(st.sel[1])+'  f='+nfmt(f(st.sel[0],st.sel[1])); P.ask(); SND.click(); });

/* ================= NABLA · Contenido: ayudantes para definir mundos ================= */
const WORLDS=[];
/* Partes de respuesta */
const qNum=(lab,v,o)=>Object.assign({k:'num',lab,v},o||{});                 // número con tolerancia (dec = decimales)
const qExpr=(lab,e,vars,o)=>Object.assign({k:'expr',lab,e,vars:vars||['x','y']},o||{});   // expresión equivalente
const qVec=(lab,comps,vars,o)=>Object.assign({k:'vec',lab,comps,vars:vars||['x','y']},o||{}); // vector (cada componente número o expresión)
const qPts=(lab,pts,o)=>Object.assign({k:'pts',lab,pts},o||{});             // lista de puntos
const qMC=(lab,opts,ans,o)=>Object.assign({k:'mc',lab,opts,ans},o||{});   // opción múltiple (opts puede ser texto TeX o {tex,thumb})
const qPaint=(lab,cfg,o)=>Object.assign({k:'paint',lab,cfg},o||{});       // pintar una región
const qDir=(lab,cfg,o)=>Object.assign({k:'dir',lab,cfg,tol:14},o||{});    // elegir una dirección en el mapa
const qPt=(lab,cfg,ok,o)=>Object.assign({k:'pt',lab,cfg,ok},o||{});       // señalar un punto en el mapa
/* Un mundo */
function defWorld(w){ w.n=WORLDS.length+1; WORLDS.push(w); return w; }
/* Gradiente numérico de f(...) en un punto (arreglo), para verificar respuestas */
const gradN=(f,pt,h)=>{ h=h||1e-5; return pt.map((_,i)=>{ const a=pt.slice(), b=pt.slice(); a[i]+=h; b[i]-=h; return (f.apply(null,a)-f.apply(null,b))/(2*h); }); };
/* Segundas derivadas numéricas y discriminante de la prueba de la segunda derivada */
const hess2=(f,x,y,h)=>{ h=h||1e-3; const fxx=(f(x+h,y)-2*f(x,y)+f(x-h,y))/(h*h), fyy=(f(x,y+h)-2*f(x,y)+f(x,y-h))/(h*h), fxy=(f(x+h,y+h)-f(x+h,y-h)-f(x-h,y+h)+f(x-h,y-h))/(4*h*h); return {fxx,fyy,fxy,D:fxx*fyy-fxy*fxy}; };
/* Mínimo y máximo de f en el disco x²+y²<=R² (barrido en polares) */
const scanDisk=(f,R)=>{ let mx=-1e18,mn=1e18; for(let i=0;i<=200;i++){ const r=R*i/200; for(let j=0;j<720;j++){ const t=j*Math.PI/360, v=f(r*Math.cos(t),r*Math.sin(t)); if(v>mx)mx=v; if(v<mn)mn=v; } } return [mn,mx]; };

defWorld({

  brief:T`<p>Una función de <b>varias variables</b> recibe varios números a la vez y devuelve uno solo. La temperatura de una placa depende de \(x\) y de \(y\); el costo de una bodega, de su largo, ancho y alto. Aquí aprendes a <b>evaluarlas</b>, a <b>graficarlas</b> como superficies y a reconocer las formas típicas.</p>`,
  goals:['Evaluar funciones de 2 y 3 variables','Interpretar \\(z=f(x,y)\\) como una superficie','Usar trazas para entender una gráfica','Reconocer paraboloides, sillas, conos y elipsoides'],
  ai:T`<p>Una red neuronal es una función \(\mathbb{R}^n\to\mathbb{R}\): recibe \(n\) pesos o características y entrega un número, la <b>pérdida</b> \(L(w_1,w_2,\dots)\). Entrenarla es explorar esa superficie buscando su valle más bajo.</p>`,
  recipe:['Identifica cuántas variables entran y qué representa cada una.','Sustituye todos los valores a la vez, respetando paréntesis y signos.','Para graficar: fija una variable (una traza) y dibuja la curva que queda.','Junta varias trazas para ver la forma de la superficie.'],
  pitfalls:['Sustituir en el orden equivocado: \\(f(2,-1)\\) no es \\(f(-1,2)\\).','Perder un signo al sustituir un número negativo: usa paréntesis.','Creer que la gráfica de \\(f(x,y)\\) vive en el plano: vive en \\(\\mathbb{R}^3\\).'],
  classQ:[T`¿Qué variable elegirías para medir la calidad de una siesta: solo la duración, o duración y temperatura? ¿Qué cambia en la gráfica?`,T`Si \(f(x,y)=x^2+y^2\), ¿cuál es el valor mínimo de \(f\) y en qué punto ocurre?`],
  lessons:[
   {id:'l1',t:'De una a varias variables',sub:'Entradas múltiples, una salida',steps:[
     {h:'Una función con varias entradas',html:T`<p class="big">Una función \(f:\mathbb{R}^2\to\mathbb{R}\) asigna a cada par \((x,y)\) un único número \(f(x,y)\).</p><div class="callout"><b class="t">Ejemplo</b>La temperatura de una placa metálica: \(T(x,y)=20+5x-2y^2\) grados. En el punto \((2,1)\) la temperatura es \(T(2,1)=20+10-2=28\).</div><p>Con tres variables, \(f:\mathbb{R}^3\to\mathbb{R}\), escribimos \(f(x,y,z)\): por ejemplo la densidad del aire en cada punto del espacio.</p>`},
     {h:'Evaluar es sustituir con cuidado',html:T`<p>Sea \(f(x,y)=x^2y-3x\). Para \(f(2,-1)\), sustituye \(x=2\) y \(y=-1\):</p>\[f(2,-1)=(2)^2(-1)-3(2)=-4-6=-10.\]<div class="callout warn"><b class="t">Ojo</b>Escribe los números negativos entre paréntesis antes de operar. \((-1)^2=1\), pero \(-1^2\) suele leerse como \(-1\).</div>`},
     {h:'Su gráfica es una superficie',html:T`<p>El conjunto de puntos \((x,y,f(x,y))\) forma una <b>superficie</b> en el espacio. Arrástrala para rotarla y pasa a «Mapa de nivel» para verla desde arriba, con el color como altura.</p>`,viz:{k:'surf',f:'sin(x)*cos(y)+0.15*x^2',xr:[-3,3],yr:[-3,3],pt:[1,1]}}],
    quiz:[qNum(T`Si \(f(x,y)=x^2y-3x\), calcula \(f(3,2)\).`,9,{dec:0,chk:()=>F2('x^2*y-3*x')(3,2),traps:[{v:-9,msg:'Casi: revisa el signo del término \\(-3x\\).'}]})]},
   {id:'l2',t:'Trazas: cortar la superficie',sub:'Fijar una variable para ver una curva',steps:[
     {h:'Una traza es una curva',html:T`<p>Si <b>fijas</b> una variable, la función vuelve a depender de una sola: obtienes una curva plana llamada <b>traza</b>.</p><p>Para \(f(x,y)=x^2+y^2\): con \(y=1\) queda \(z=x^2+1\), una parábola. Con \(z=4\) queda \(x^2+y^2=4\), una circunferencia.</p>`},
     {h:'Mira el corte',html:T`<p>El plano ámbar corta la superficie donde \(y=1\). La curva ámbar es la traza. Cambia al mapa de nivel: ahí ves los cortes horizontales, que se llaman <b>curvas de nivel</b>.</p>`,viz:{k:'surf',f:'x^2+y^2',xr:[-2,2],yr:[-2,2],slice:{axis:'y',v:1}}},
     {h:'Para qué sirve',html:T`<div class="callout ai"><b class="t">Conexión con IA</b>Al ajustar un solo parámetro de un modelo y dejar los demás fijos, dibujas una traza de la superficie de pérdida. Así se hacen las curvas de «sensibilidad» de un hiperparámetro.</div><p>Las trazas te permiten dibujar una superficie a mano: junta tres o cuatro cortes y la forma aparece.</p>`}],
    quiz:[qMC(T`La traza de \(z=x^2+y^2\) con \(z=9\) es:`,[T`una parábola`,T`una circunferencia de radio 3`,T`una circunferencia de radio 9`,T`un punto`],1,{why:T`\(x^2+y^2=9=3^2\): circunferencia de radio 3.`})]},
   {id:'l3',t:'Superficies típicas',sub:'Paraboloide, silla, cono, elipsoide',steps:[
     {h:'El paraboloide y la silla',html:T`<p>\(z=x^2+y^2\) es un <b>paraboloide</b>: un valle con fondo en el origen. \(z=x^2-y^2\) es una <b>silla de montar</b>: sube en una dirección y baja en la otra.</p>`,viz:{k:'surf',f:'x^2-y^2',xr:[-2,2],yr:[-2,2]}},
     {h:'El cono y el elipsoide',html:T`<p>\(z=\sqrt{x^2+y^2}\) es un <b>cono</b>. \(\dfrac{x^2}{a^2}+\dfrac{y^2}{b^2}+\dfrac{z^2}{c^2}=1\) es un <b>elipsoide</b>: no es la gráfica de una función (para un mismo \((x,y)\) hay dos valores de \(z\)), pero sí una superficie cuádrica.</p>`,viz:{k:'solid',box:{xr:[-2,2],yr:[-2,2],zr:[-1.6,1.6]},items:[{t:'p',p:['2*sin(u)*cos(v)','1.5*sin(u)*sin(v)','1.4*cos(u)'],u:[0,3.14159],v:[0,6.28319],col:[34,230,255],alpha:.55}],legend:'elipsoide'}},
     {h:'Regla práctica',html:T`<div class="callout"><b class="t">Cómo reconocerlas</b>Mira los signos: suma de cuadrados igual a \(z\) → paraboloide; diferencia de cuadrados → silla; raíz de la suma de cuadrados → cono; suma de tres cuadrados igual a 1 → elipsoide.</div>`}],
    quiz:[qMC(T`La superficie \(z=x^2-y^2\) se llama:`,[T`paraboloide elíptico`,T`silla (paraboloide hiperbólico)`,T`cono`,T`elipsoide`],1,{why:T`La diferencia de cuadrados produce la silla de montar.`})]}

  retos:[
   {id:'p1',t:'Evaluar sin errores',q:T`Sea \(f(x,y)=x^2y+3y-xy^2\) y \(g(x,y,z)=xy+z^2-\dfrac{x}{z}\).`,
    parts:[qNum(T`\(f(2,-1)\)`,-9,{dec:0,chk:()=>F2('x^2*y+3*y-x*y^2')(2,-1),traps:[{v:-1,msg:'Cuidado con \\(-xy^2\\): con \\(y=-1\\), \\(y^2=1\\).'}]}),qNum(T`\(f(1,2)\)`,4,{dec:0,chk:()=>F2('x^2*y+3*y-x*y^2')(1,2)}),qNum(T`\(g(2,3,-1)\)`,9,{dec:0,chk:()=>F3('x*y+z^2-x/z')(2,3,-1),traps:[{v:5,msg:'El último término es \\(-x/z=-2/(-1)=+2\\): revisa el signo.'}]})],

});
