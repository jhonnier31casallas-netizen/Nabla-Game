/* ================= MUNDO 2 · Dominio y curvas de nivel ================= */
defWorld({
  id:'niv', name:'Dominio y curvas de nivel', short:'Dominio y niveles', glyph:'D', hue:262,
  bg:'cos(3*sqrt(x^2+y^2))*0.7-0.4*(x^2+y^2)', thumb:{k:'cont',f:'x^2-y^2+0.3*x',xr:[-3,3],yr:[-3,3]},
  sub:'¿Dónde vive la función? ¿Cómo se lee un mapa de alturas?',
  brief:T`<p>Antes de trabajar con una función hay que saber <b>dónde está definida</b>: su dominio. Después aprenderás a leer un <b>mapa de curvas de nivel</b>, igual que un mapa topográfico: cada línea une los puntos con el mismo valor.</p>`,
  goals:['Hallar y dibujar el dominio de \\(f(x,y)\\)','Definir curvas de nivel \\(f(x,y)=c\\)','Leer un mapa de niveles','Extender la idea a superficies de nivel en 3 variables'],
  ai:T`<p>Las curvas de nivel de una función de pérdida son los mapas que ves en los artículos de optimización: valles alargados hacen que el entrenamiento sea lento, y los círculos concéntricos indican un problema bien condicionado.</p>`,
  recipe:['Lista las restricciones: denominador \\(\\ne0\\), radicando \\(\\ge0\\), argumento del logaritmo \\(>0\\).','Escribe cada restricción como una desigualdad en \\(x\\) y \\(y\\) y dibuja su frontera.','Decide qué lado cumple la desigualdad probando un punto.','Para un nivel: iguala \\(f(x,y)=c\\) y reconoce la curva (recta, circunferencia, parábola, hipérbola).'],
  pitfalls:['Olvidar que dentro de una raíz par el valor puede ser \\(0\\) (frontera incluida) pero en un logaritmo no.','Dibujar solo la frontera y no decidir qué lado es el dominio.','Confundir el nivel \\(c\\) (un valor de \\(z\\)) con una coordenada del plano.'],
  classQ:[T`¿Por qué las curvas de nivel de una función nunca se cruzan?`,T`Si en un mapa las curvas están muy juntas, ¿la superficie es empinada o suave?`],
  lessons:[
   {id:'l1',t:'Dominio natural',sub:'Dónde tiene sentido evaluar',steps:[
     {h:'Restricciones típicas',html:T`<p>El <b>dominio natural</b> de \(f(x,y)\) es el conjunto de puntos \((x,y)\) donde la fórmula da un número real.</p><ul class="list"><li>Cociente: el denominador no puede ser \(0\).</li><li>Raíz cuadrada: el radicando debe ser \(\ge 0\).</li><li>Logaritmo: el argumento debe ser \(>0\).</li></ul>`},
     {h:'Un dominio que se ve',html:T`<p>Para \(f(x,y)=\sqrt{4-x^2-y^2}\) exigimos \(4-x^2-y^2\ge0\), es decir \(x^2+y^2\le4\): el disco de radio 2. Fuera de él la función no existe, y el mapa queda vacío.</p>`,viz:{k:'cont',f:'sqrt(4-x^2-y^2)',xr:[-3,3],yr:[-3,3]}},
     {h:'Frontera incluida o no',html:T`<p>Con \(\ln(y-x^2)\) exigimos \(y-x^2>0\): la región <b>sobre</b> la parábola \(y=x^2\), sin incluir la parábola (ahí el logaritmo vale \(\ln0\)).</p>`,viz:{k:'cont',f:'ln(y-x^2)',xr:[-3,3],yr:[-3,3]}}],
    quiz:[qMC(T`El dominio natural de \(f(x,y)=\dfrac{1}{x-y}\) es:`,[T`todo el plano`,T`el plano sin la recta \(y=x\)`,T`solo \(x>y\)`,T`la recta \(y=x\)`],1,{why:T`El denominador se anula solo cuando \(x=y\).`})]},
   {id:'l2',t:'Curvas de nivel',sub:'El mapa topográfico de una función',steps:[
     {h:'Definición',html:T`<p>La <b>curva de nivel</b> de \(f\) con valor \(c\) es el conjunto \(\{(x,y): f(x,y)=c\}\). Es lo que obtienes al cortar la superficie con el plano horizontal \(z=c\) y proyectar sobre el plano \(xy\).</p>`},
     {h:'Muévete por los niveles',html:T`<p>Para \(f(x,y)=x^2-y^2\) las curvas de nivel son hipérbolas. Mueve el deslizador para resaltar el nivel \(c\).</p>`,viz:{k:'cont',f:'x^2-y^2',xr:[-3,3],yr:[-3,3],hlSlider:{min:-4,max:4,step:.5,val:1,tex:'x²−y²'}}},
     {h:'Cómo leer el mapa',html:T`<div class="callout"><b class="t">Regla</b>Curvas muy juntas: la superficie cambia rápido (ladera empinada). Curvas separadas: cambia despacio. Las curvas de niveles distintos nunca se cruzan: una función da un solo valor por punto.</div>`}],
    quiz:[qNum(T`La curva de nivel de \(f(x,y)=x^2+y^2\) que pasa por \((3,4)\) es la circunferencia \(x^2+y^2=c\). ¿Cuánto vale \(c\)?`,25,{dec:0,chk:()=>F2('x^2+y^2')(3,4)})]},
   {id:'l3',t:'Superficies de nivel',sub:'Tres variables: el nivel es una superficie',steps:[
     {h:'Un paso más',html:T`<p>Para \(f(x,y,z)\) el nivel \(f=c\) es una <b>superficie de nivel</b>. Si \(f(x,y,z)=x^2+y^2+z^2\), el nivel \(c=4\) es la esfera de radio 2.</p>`},
     {h:'Rebánala con un plano',html:T`<p>Corta con el plano \(z=z_0\): queda una curva de nivel en \(xy\). La curva ámbar es la esfera \(x^2+y^2+z^2=4\) a esa altura. Mueve \(z\) hasta \(\pm2\): la circunferencia se encoge hasta un punto.</p>`,viz:{k:'cont',f:'x^2+y^2+z^2',zSlider:{min:-2.5,max:2.5,step:.1,val:0},hl:[4],xr:[-3,3],yr:[-3,3]}},
     {h:'Por qué importa',html:T`<div class="callout ai"><b class="t">Conexión con IA</b>La frontera de decisión de un clasificador es una superficie de nivel de su función de puntaje: \(s(x)=0\). Las superficies de nivel son la «forma» de las decisiones del modelo.</div>`}],
    quiz:[qMC(T`El nivel \(z-x^2-y^2=0\) de \(F(x,y,z)=z-x^2-y^2\) es:`,[T`una esfera`,T`un paraboloide`,T`un plano`,T`un cono`],1,{why:T`\(z=x^2+y^2\): paraboloide.`})]}
  ],
  retos:[
   {id:'p1',t:'Dominio con raíz',q:T`Sea \(f(x,y)=\sqrt{4-x^2-y^2}\).`,
    parts:[qPaint(T`Pinta el dominio de \(f\) en el plano (haz clic o arrastra sobre las celdas).`,{n:20,xr:[-4,4],yr:[-4,4],pred:(x,y)=>x*x+y*y<=4}),qNum(T`Área del dominio (número, puedes escribir \(4\pi\) como \(4*pi\))`,4*Math.PI,{dec:2,show:T`4\pi`,chk:()=>Math.PI*4})],
    hint:T`El radicando debe ser \(\ge0\): \(x^2+y^2\le4\). Es un disco de radio 2 centrado en el origen.`,
    sol:T`<p>\(4-x^2-y^2\ge0\iff x^2+y^2\le4\): disco de radio 2. Su área es \(\pi r^2=4\pi\approx12{,}57\).</p>`},
   {id:'p2',t:'Dominio con logaritmo',q:T`Sea \(g(x,y)=\ln(y-x^2)\).`,
    parts:[qPaint(T`Pinta el dominio de \(g\): la región donde \(y-x^2>0\).`,{n:20,xr:[-4,4],yr:[-4,4],pred:(x,y)=>y>x*x}),qMC(T`¿Pertenece la parábola \(y=x^2\) al dominio?`,[T`Sí, porque \(0\) es un número`,T`No, porque \(\ln0\) no está definido`,T`Solo si \(x>0\)`,T`Solo en el origen`],1,{why:T`Sobre la parábola \(y-x^2=0\) y \(\ln 0\) no existe: es una frontera excluida.`})],
    hint:T`El argumento del logaritmo debe ser estrictamente positivo: \(y>x^2\). Prueba el punto \((0,1)\).`,
    sol:T`<p>\(y-x^2>0\iff y>x^2\): la región abierta sobre la parábola. Los puntos de la parábola quedan excluidos.</p>`},
   {id:'p3',t:'Nivel de una elipse',q:T`Sea \(f(x,y)=x^2+4y^2\).`,viz:{k:'cont',f:'x^2+4*y^2',xr:[-5,5],yr:[-3,3]},
    parts:[qNum(T`La curva de nivel \(f=16\) corta al eje \(x\) en \((\pm a,0)\). Calcula \(a\).`,4,{dec:1,chk:()=>Math.sqrt(16)}),qNum(T`Y corta al eje \(y\) en \((0,\pm b)\). Calcula \(b\).`,2,{dec:1,chk:()=>Math.sqrt(16/4)}),qNum(T`¿Qué nivel \(c\) pasa por el punto \(P(2,1)\)?`,8,{dec:0,chk:()=>F2('x^2+4*y^2')(2,1)})],
    hint:T`Con \(y=0\): \(x^2=16\). Con \(x=0\): \(4y^2=16\). Para el nivel de \(P\), evalúa \(f(2,1)\).`,
    sol:T`<p>\(\dfrac{x^2}{16}+\dfrac{y^2}{4}=1\): \(a=4\), \(b=2\). \(f(2,1)=4+4=8\).</p>`},
   {id:'p4',t:'Señala el nivel',q:T`El mapa muestra \(f(x,y)=x^2-y^2\). Haz clic en un punto donde \(f(x,y)=3\).`,
    parts:[qPt(T`Haz clic sobre la curva de nivel \(c=3\) (tolerancia ±0,4).`,{f:'x^2-y^2',xr:[-4,4],yr:[-3,3],levels:[-6,-4,-2,0,2,4,6],reveal:[3],hint:'La curva de nivel c = 3 es una hipérbola que corta al eje x en (±√3, 0).'},(x,y)=>Math.abs(x*x-y*y-3)<=.4,{sample:[2,1]})],
    hint:T`Si \(y=0\), \(x^2=3\): \(x\approx\pm1{,}73\). Otro punto: \(y=1\Rightarrow x^2=4\).`,
    sol:T`<p>\(x^2-y^2=3\) es una hipérbola con vértices \((\pm\sqrt3,0)\). Por ejemplo \((2,1)\) cumple \(4-1=3\).</p>`},
   {id:'p5',t:'Tres variables',q:T`Sea \(F(x,y,z)=x^2+y^2+z^2\).`,
    parts:[qNum(T`El nivel \(F=36\) es una esfera. ¿Cuál es su radio?`,6,{dec:1,chk:()=>Math.sqrt(36)}),qNum(T`¿Qué nivel \(c\) pasa por el punto \((1,2,3)\)?`,14,{dec:0,chk:()=>F3('x^2+y^2+z^2')(1,2,3)}),qMC(T`La superficie de nivel \(z-x^2-y^2=0\) es:`,[T`una esfera`,T`un paraboloide`,T`un plano`,T`un cilindro`],1,{why:T`\(z=x^2+y^2\): paraboloide.`})],
    hint:T`Una esfera \(x^2+y^2+z^2=r^2\) tiene radio \(\sqrt{c}\). Para el nivel de un punto, evalúa \(F\) ahí.`,
    sol:T`<p>\(r=\sqrt{36}=6\). \(F(1,2,3)=1+4+9=14\). \(z=x^2+y^2\) es un paraboloide.</p>`}
  ],
  boss:{name:'El Cartógrafo Fantasma',glyph:'D',story:'Un cartógrafo borra partes del mapa. Solo quien domine dominios y niveles puede recuperarlo.',phases:[
    {t:'Fase 1 · El dominio perdido',q:T`Sea \(f(x,y)=\sqrt{4-x^2}+\sqrt{y}\).`,parts:[qPaint(T`Pinta el dominio de \(f\).`,{n:20,xr:[-4,4],yr:[-4,4],pred:(x,y)=>Math.abs(x)<=2&&y>=0})],hint:T`Necesitas \(4-x^2\ge0\) (es decir \(|x|\le2\)) y \(y\ge0\).`,sol:T`<p>Dominio: la franja \(-2\le x\le2\) con \(y\ge0\).</p>`},
    {t:'Fase 2 · Niveles y elipses',q:T`Sea \(f(x,y)=x^2+2y^2\) y \(P(2,1)\).`,parts:[qNum(T`Nivel \(c\) de la curva que pasa por \(P\)`,6,{dec:0,chk:()=>F2('x^2+2*y^2')(2,1)}),qNum(T`Esa curva corta al eje \(y\) en \((0,\pm b)\). Calcula \(b\) con 2 decimales.`,Math.sqrt(3),{dec:2,show:T`\sqrt3`,chk:()=>Math.sqrt(6/2)})],hint:T`\(c=f(2,1)\). Con \(x=0\): \(2y^2=c\).`,sol:T`<p>\(c=4+2=6\). Con \(x=0\): \(2b^2=6\Rightarrow b=\sqrt3\approx1{,}73\).</p>`},
    {t:'Fase 3 · Encuentra el nivel',q:T`Mapa de \(f(x,y)=x\,y\). Señala un punto donde \(f=2\).`,parts:[qPt(T`Haz clic sobre la curva \(xy=2\) (tolerancia ±0,3).`,{f:'x*y',xr:[-4,4],yr:[-3,3],levels:[-4,-2,0,2,4],reveal:[2]},(x,y)=>Math.abs(x*y-2)<=.3,{sample:[2,1]})],hint:T`\(xy=2\) es una hipérbola: \((1,2)\), \((2,1)\), \((-1,-2)\)…`,sol:T`<p>\(xy=2\): hipérbola en los cuadrantes I y III.</p>`}
  ]}
});

/* ---- 04c-world-par.js ---- */
/* ================= MUNDO 3 · Derivadas parciales por definición ================= */
defWorld({
  id:'par', name:'Derivadas parciales', short:'Parciales', glyph:'∂', hue:322,
  bg:'x*exp(-(x^2+y^2)*1.6)*2.2+0.15*y', thumb:{k:'surf',f:'x^2*y+sin(x*y)',xr:[-2,2],yr:[-2,2]},
  sub:'Cambiar una variable a la vez: el límite del cociente incremental.',
  brief:T`<p>¿Qué tan rápido cambia \(f(x,y)\) si solo mueves \(x\) y dejas \(y\) quieta? Esa pendiente es la <b>derivada parcial</b>. Primero la construirás con el límite (la definición), luego con reglas y, al final, con derivadas de orden superior y el plano tangente.</p>`,
  goals:['Calcular \\(f_x\\) y \\(f_y\\) con el límite','Derivar tratando la otra variable como constante','Trabajar con 3 variables','Derivadas de segundo orden y plano tangente'],
  ai:T`<p>El aprendizaje profundo entrena con derivadas parciales de la pérdida respecto a <b>cada peso</b>: \(\partial L/\partial w_i\). La retropropagación es una manera muy eficiente de calcularlas todas.</p>`,
  recipe:['Elige la variable respecto a la cual derivas; las demás son constantes.','Por definición: forma \\(\\dfrac{f(x+h,y)-f(x,y)}{h}\\), simplifica y haz \\(h\\to0\\).','Con reglas: deriva normal (potencia, producto, cadena) sin tocar las otras variables.','Evalúa en el punto pedido al final, no antes de derivar.'],
  pitfalls:['Derivar también la otra variable: en \\(f_x\\), \\(y\\) es una constante.','Evaluar el punto antes de derivar: eso convierte la función en un número.','Olvidar la regla de la cadena en \\(e^{xy}\\) o \\(\\sin(xy)\\).'],
  classQ:[T`Si \(f_x(a,b)>0\), ¿qué le pasa a \(f\) cuando aumentas un poco \(x\) desde \((a,b)\)?`,T`¿Por qué \(f_{xy}=f_{yx}\) casi siempre? ¿Cuándo podría fallar?`],
  lessons:[
   {id:'l1',t:'La definición',sub:'Una secante que se vuelve tangente',steps:[
     {h:'Cociente incremental',html:T`<p>Si fijas \(y=b\), tienes una función de una variable, \(x\mapsto f(x,b)\). Su derivada en \(x=a\) es la <b>derivada parcial</b> respecto a \(x\):</p>\[f_x(a,b)=\lim_{h\to0}\frac{f(a+h,b)-f(a,b)}{h}.\]<p>Análogamente, \(f_y(a,b)=\displaystyle\lim_{h\to0}\frac{f(a,b+h)-f(a,b)}{h}\).</p>`},
     {h:'De la secante a la tangente',html:T`<p>La curva es la traza \(y=2\) de \(f(x,y)=x^2y\). La recta ámbar es la secante con paso \(h\); la magenta es la tangente (pendiente \(f_x(1,2)=4\)). Pulsa «Animar» y mira cómo el cociente se acerca a \(4\).</p>`,viz:{k:'secant',f:'x^2*y',wrt:'x',a:1,b:2,h0:1}},
     {h:'Hazlo tú con álgebra',html:T`<p>Para \(f(x,y)=x^2y\) en \((1,2)\):</p>\[\frac{f(1+h,2)-f(1,2)}{h}=\frac{2(1+h)^2-2}{h}=\frac{4h+2h^2}{h}=4+2h\;\xrightarrow[h\to0]{}\;4.\]<div class="callout warn"><b class="t">Ojo</b>Simplifica el cociente antes de hacer \(h\to0\): al sustituir \(h=0\) directamente sale \(0/0\).</div>`}],
    quiz:[qNum(T`Para \(f(x,y)=x^2y\), calcula \(f_x(1,2)\) con el límite de la lección (el resultado del cociente cuando \(h\to0\)).`,4,{dec:0,chk:()=>dfx(F2('x^2*y'),1,2,1e-6)})]},
   {id:'l2',t:'Derivar con reglas',sub:'Las demás variables son constantes',steps:[
     {h:'La otra variable es constante',html:T`<p>Para \(f_x\), trata a \(y\) como si fuera un número. Ejemplo con \(f(x,y)=x^2y+\sin(xy)\):</p>\[f_x=2xy+y\cos(xy),\qquad f_y=x^2+x\cos(xy).\]<p>La regla de la cadena en \(\sin(xy)\) deriva el interior respecto a la variable elegida: \(\partial_x(xy)=y\).</p>`},
     {h:'Qué significa geométricamente',html:T`<p>\(f_x(a,b)\) es la pendiente de la curva que resulta al cortar la superficie con el plano \(y=b\). \(f_y(a,b)\) es la pendiente al cortar con \(x=a\).</p>`,viz:{k:'surf',f:'x^2*y+sin(x*y)',xr:[-2,2],yr:[-2,2],slice:{axis:'y',v:1}}},
     {h:'Notaciones y tres variables',html:T`<p>\(f_x=\dfrac{\partial f}{\partial x}=\partial_xf\). Con tres variables se derivan las tres: si \(g=xe^{yz}\), entonces \(g_x=e^{yz}\), \(g_y=xze^{yz}\), \(g_z=xye^{yz}\).</p>`}],
    quiz:[qExpr(T`Si \(f(x,y)=x^3y^2\), escribe \(f_x\).`,'3*x^2*y^2',['x','y'],{chk:(x,y)=>dfx(F2('x^3*y^2'),x,y),traps:[{e:'2*x^3*y',msg:'Esa es \\(f_y\\): derivaste respecto a la variable equivocada.'}]})]},
   {id:'l3',t:'Orden superior y plano tangente',sub:'Curvatura y aproximación lineal',steps:[
     {h:'Segundas derivadas',html:T`<p>Derivar de nuevo da \(f_{xx},\;f_{yy}\) y las mixtas \(f_{xy},\;f_{yx}\). Si las segundas derivadas son continuas, el <b>teorema de Clairaut</b> asegura \(f_{xy}=f_{yx}\).</p>\[f=x^2e^y\;\Rightarrow\;f_x=2xe^y,\;f_{xy}=2xe^y,\;f_y=x^2e^y,\;f_{yx}=2xe^y.\]`},
     {h:'El plano tangente',html:T`<p>Cerca de \((a,b)\), la superficie se parece a su plano tangente:</p>\[L(x,y)=f(a,b)+f_x(a,b)(x-a)+f_y(a,b)(y-b).\]<p>Aquí, la superficie \(z=x^2e^y\) y su plano tangente en \((1,0)\).</p>`,viz:{k:'solid',box:{xr:[0,2],yr:[-1,1],zr:[-1,11]},items:[{t:'surf',f:'x^2*exp(y)',xr:[0,2],yr:[-1,1],col:[255,61,240],alpha:.6},{t:'surf',f:'1+2*(x-1)+y',xr:[0,2],yr:[-1,1],col:[34,230,255],alpha:.42},{t:'pt',p:[1,0,1],col:[255,194,77],label:'P'}],legend:'magenta: superficie · cian: plano tangente'}},
     {h:'Para qué sirve',html:T`<div class="callout ai"><b class="t">Conexión con IA</b>La <b>matriz hessiana</b> de la pérdida (todas las segundas parciales) dice qué tan curvo es el valle. Métodos como Newton la usan para dar pasos más inteligentes que el descenso simple.</div>`}],
    quiz:[qNum(T`Con \(f(x,y)=x^2e^y\), el plano tangente en \((1,0)\) es \(L=1+2(x-1)+y\). Calcula \(L(1{,}1;\,0{,}2)\).`,1.4,{dec:2,chk:()=>1+2*(1.1-1)+0.2})]}
  ],
  retos:[
   {id:'p1',t:'Límite con números',q:T`Sea \(f(x,y)=x^2y\) y el punto \((1,2)\).`,
    parts:[qExpr(T`El cociente \(\dfrac{f(1+h,2)-f(1,2)}{h}\) simplificado (en función de \(h\))`,'4+2*h',['h'],{chk:(h)=>(F2('x^2*y')(1+h,2)-F2('x^2*y')(1,2))/h}),qNum(T`\(f_x(1,2)\) por definición`,4,{dec:0,chk:()=>dfx(F2('x^2*y'),1,2,1e-6)}),qNum(T`\(f_y(1,2)\) por definición: \(\displaystyle\lim_{h\to0}\frac{f(1,2+h)-f(1,2)}{h}\)`,1,{dec:0,chk:()=>dfy(F2('x^2*y'),1,2,1e-6)})],
    hint:T`\(f(1+h,2)=2(1+h)^2\). Resta \(f(1,2)=2\) y divide entre \(h\). Para \(f_y\): \(f(1,2+h)=2+h\).`,
    sol:T`<p>\(\dfrac{2(1+h)^2-2}{h}=4+2h\to4\). Para \(f_y\): \(\dfrac{(2+h)-2}{h}=1\).</p>`},
   {id:'p2',t:'Definición con variables',q:T`Sea \(f(x,y)=x^2+3xy\).`,
    parts:[qExpr(T`\(\dfrac{f(x+h,y)-f(x,y)}{h}\), simplificado`,'2*x+h+3*y',['x','y','h'],{chk:(x,y,h)=>(F2('x^2+3*x*y')(x+h,y)-F2('x^2+3*x*y')(x,y))/h,traps:[{e:'2*x+3*y',msg:'Ese es el límite. Escribe el cociente antes de hacer \\(h\\to0\\).'}]}),qExpr(T`\(f_x(x,y)\)`,'2*x+3*y',['x','y'],{chk:(x,y)=>dfx(F2('x^2+3*x*y'),x,y)}),qExpr(T`\(f_y(x,y)\)`,'3*x',['x','y'],{chk:(x,y)=>dfy(F2('x^2+3*x*y'),x,y)})],
    hint:T`\((x+h)^2+3(x+h)y-x^2-3xy=2xh+h^2+3hy\). Divide entre \(h\).`,
    sol:T`<p>\(\dfrac{2xh+h^2+3hy}{h}=2x+h+3y\to2x+3y\). \(f_y\): \(\dfrac{3xh}{h}=3x\).</p>`},
   {id:'p3',t:'Reglas de derivación',q:T`Sea \(f(x,y)=x^3y^2-4xy+\ln y\), con \(y>0\).`,
    parts:[qExpr(T`\(f_x\)`,'3*x^2*y^2-4*y',['x','y'],{chk:(x,y)=>dfx(F2('x^3*y^2-4*x*y+ln(y)'),x,y)}),qExpr(T`\(f_y\)`,'2*x^3*y-4*x+1/y',['x','y'],{chk:(x,y)=>dfy(F2('x^3*y^2-4*x*y+ln(y)'),x,y)}),qNum(T`\(f_x(1,2)\)`,4,{dec:0,chk:()=>dfx(F2('x^3*y^2-4*x*y+ln(y)'),1,2)})],
    hint:T`En \(f_x\) el término \(\ln y\) es constante y su derivada es \(0\). En \(f_y\), \(\dfrac{d}{dy}\ln y=\dfrac1y\).`,
    sol:T`<p>\(f_x=3x^2y^2-4y\). \(f_y=2x^3y-4x+\dfrac1y\). \(f_x(1,2)=12-8=4\).</p>`},
   {id:'p4',t:'Tres variables',q:T`Sea \(g(x,y,z)=x\,e^{yz}+z^2\).`,
    parts:[qExpr(T`\(g_x\)`,'exp(y*z)',['x','y','z'],{chk:(x,y,z)=>(F3('x*exp(y*z)+z^2')(x+1e-5,y,z)-F3('x*exp(y*z)+z^2')(x-1e-5,y,z))/2e-5}),qExpr(T`\(g_y\)`,'x*z*exp(y*z)',['x','y','z'],{chk:(x,y,z)=>(F3('x*exp(y*z)+z^2')(x,y+1e-5,z)-F3('x*exp(y*z)+z^2')(x,y-1e-5,z))/2e-5}),qExpr(T`\(g_z\)`,'x*y*exp(y*z)+2*z',['x','y','z'],{chk:(x,y,z)=>(F3('x*exp(y*z)+z^2')(x,y,z+1e-5)-F3('x*exp(y*z)+z^2')(x,y,z-1e-5))/2e-5})],
    hint:T`Usa la regla de la cadena en \(e^{yz}\): \(\partial_y(yz)=z\) y \(\partial_z(yz)=y\). En \(g_z\), no olvides \(z^2\).`,
    sol:T`<p>\(g_x=e^{yz}\); \(g_y=xz\,e^{yz}\); \(g_z=xy\,e^{yz}+2z\).</p>`},
   {id:'p5',t:'Segundo orden y plano tangente',q:T`Sea \(f(x,y)=x^2e^y\). En \((1,0)\): \(f=1,\;f_x=2,\;f_y=1\).`,viz:{k:'solid',box:{xr:[0,2],yr:[-1,1],zr:[-1,11]},items:[{t:'surf',f:'x^2*exp(y)',xr:[0,2],yr:[-1,1],col:[255,61,240],alpha:.6},{t:'surf',f:'1+2*(x-1)+y',xr:[0,2],yr:[-1,1],col:[34,230,255],alpha:.42},{t:'pt',p:[1,0,1],col:[255,194,77],label:'P'}],legend:'superficie y plano tangente en (1, 0)'},
    parts:[qExpr(T`\(f_{xy}\) (deriva \(f_x\) respecto a \(y\))`,'2*x*exp(y)',['x','y'],{chk:(x,y)=>dfy((a,b)=>dfx(F2('x^2*exp(y)'),a,b,1e-4),x,y,1e-4)}),qNum(T`Con el plano tangente \(L\) en \((1,0)\), estima \(f(0{,}9;\,0{,}1)\)`,0.9,{dec:2,chk:()=>1+2*(0.9-1)+0.1,traps:[{v:1.1,msg:'Revisa el signo de \\(x-a=-0{,}1\\).'}]}),qMC(T`¿Qué dice el teorema de Clairaut para esta \(f\)?`,[T`\(f_{xy}=f_{yx}\)`,T`\(f_{xy}=-f_{yx}\)`,T`\(f_{xy}=0\)`,T`\(f_{xy}=f_x\)`],0,{why:T`Las segundas derivadas son continuas, así que las mixtas coinciden.`})],
    hint:T`\(f_x=2xe^y\). Deriva esa expresión respecto a \(y\). Para \(L\): \(1+2(x-1)+1\cdot(y-0)\).`,
    sol:T`<p>\(f_{xy}=2xe^y\). \(L(0{,}9;0{,}1)=1+2(-0{,}1)+0{,}1=0{,}9\); el valor real es \(0{,}81e^{0{,}1}\approx0{,}895\).</p>`}
  ],
  boss:{name:'El Rey Δh',glyph:'∂',story:'Su trono es un cociente incremental. Solo cae ante quien mezcle definición, reglas y segundas derivadas.',phases:[
    {t:'Fase 1 · La definición',q:T`Sea \(f(x,y)=xy^2\) y el punto \((2,1)\).`,parts:[qExpr(T`\(\dfrac{f(2,1+h)-f(2,1)}{h}\), simplificado`,'4+2*h',['h'],{chk:(h)=>(F2('x*y^2')(2,1+h)-F2('x*y^2')(2,1))/h}),qNum(T`\(f_y(2,1)\) por definición`,4,{dec:0,chk:()=>dfy(F2('x*y^2'),2,1,1e-6)})],hint:T`\(f(2,1+h)=2(1+h)^2\). Resta \(2\) y divide entre \(h\).`,sol:T`<p>\(\dfrac{2(1+h)^2-2}{h}=\dfrac{4h+2h^2}{h}=4+2h\to4\).</p>`},
    {t:'Fase 2 · La cadena',q:T`Sea \(f(x,y)=\arctan\!\left(\dfrac{y}{x}\right)\), con \(x>0\). (En el teclado: <code>atan(y/x)</code>.)`,parts:[qExpr(T`\(f_x\)`,'-y/(x^2+y^2)',['x','y'],{chk:(x,y)=>dfx(F2('atan(y/x)'),x,y)}),qExpr(T`\(f_y\)`,'x/(x^2+y^2)',['x','y'],{chk:(x,y)=>dfy(F2('atan(y/x)'),x,y)})],hint:T`\(\dfrac{d}{du}\arctan u=\dfrac1{1+u^2}\). Con \(u=y/x\): \(u_x=-y/x^2\) y \(u_y=1/x\).`,sol:T`<p>\(f_x=\dfrac{1}{1+y^2/x^2}\cdot\left(-\dfrac{y}{x^2}\right)=-\dfrac{y}{x^2+y^2}\). \(f_y=\dfrac{1}{1+y^2/x^2}\cdot\dfrac1x=\dfrac{x}{x^2+y^2}\).</p>`},
    {t:'Fase 3 · Laplace',q:T`Sea \(u(x,y)=e^x\sin y\), en el punto \((0,\pi/2)\).`,parts:[qNum(T`\(u_{xx}(0,\pi/2)\)`,1,{dec:0,chk:()=>dfx((a,b)=>dfx(F2('exp(x)*sin(y)'),a,b,1e-4),0,Math.PI/2,1e-4)}),qNum(T`\(u_{yy}(0,\pi/2)\)`,-1,{dec:0,chk:()=>dfy((a,b)=>dfy(F2('exp(x)*sin(y)'),a,b,1e-4),0,Math.PI/2,1e-4)}),qMC(T`¿Cumple \(u\) la ecuación de Laplace \(u_{xx}+u_{yy}=0\)?`,[T`Sí`,T`No`],0,{why:T`\(u_{xx}=e^x\sin y\) y \(u_{yy}=-e^x\sin y\): suman \(0\).`})],hint:T`\(u_x=e^x\sin y\Rightarrow u_{xx}=e^x\sin y\). \(u_y=e^x\cos y\Rightarrow u_{yy}=-e^x\sin y\).`,sol:T`<p>En \((0,\pi/2)\): \(u_{xx}=1\), \(u_{yy}=-1\). La suma es \(0\) en todo punto: \(u\) es armónica.</p>`}
  ]}
});

/* ---- 04d-world-gra.js ---- */
/* ================= MUNDO 4 · Gradiente y derivada direccional ================= */
defWorld({
  id:'gra', name:'Gradiente y derivada direccional', short:'Gradiente', glyph:'∇', hue:152,
  bg:'-(x^2+2*y^2)*1.3+0.5*cos(3*x)*0.3', thumb:{k:'cont',f:'x^2+2*y^2',xr:[-3,3],yr:[-3,3]},
  sub:'La brújula de una superficie: hacia dónde sube más rápido.',
  brief:T`<p>Las derivadas parciales miden el cambio en los ejes. Pero, ¿y si te mueves en <b>cualquier dirección</b>? El <b>gradiente</b> \(\nabla f\) junta todas las parciales en un vector que apunta hacia donde \(f\) crece más deprisa. Con él calculas la derivada direccional y entiendes por qué el descenso del gradiente funciona.</p>`,
  goals:['Calcular \\(\\nabla f\\) en 2 y 3 variables','Hallar \\(D_{\\mathbf u}f=\\nabla f\\cdot\\mathbf u\\)','Dirección y tasa de máximo crecimiento','Gradiente como normal a curvas y superficies de nivel'],
  ai:T`<p>El <b>descenso del gradiente</b> actualiza los pesos con \(\mathbf w\leftarrow\mathbf w-\eta\,\nabla L(\mathbf w)\): camina en la dirección de máxima <i>bajada</i>. Todo el entrenamiento moderno se apoya en este vector.</p>`,
  recipe:['Calcula todas las derivadas parciales y arma \\(\\nabla f=(f_x,f_y)\\) (o \\((f_x,f_y,f_z)\\)).','Evalúa \\(\\nabla f\\) en el punto pedido.','Normaliza la dirección: \\(\\mathbf u=\\mathbf v/\\|\\mathbf v\\|\\).','Calcula \\(D_{\\mathbf u}f=\\nabla f\\cdot\\mathbf u\\). Máximo: \\(\\|\\nabla f\\|\\); mínimo: \\(-\\|\\nabla f\\|\\).'],
  pitfalls:['Olvidar hacer unitario el vector de dirección antes de multiplicar.','Evaluar el gradiente en el punto equivocado.','Creer que \\(\\nabla f\\) apunta a lo largo de la curva de nivel: es <b>perpendicular</b> a ella.'],
  classQ:[T`Si \(D_{\mathbf u}f=0\), ¿qué puedes decir de la dirección \(\mathbf u\) respecto al gradiente?`,T`¿Por qué el descenso del gradiente usa \(-\nabla L\) y no \(\nabla L\)?`],
  lessons:[
   {id:'l1',t:'El vector gradiente',sub:'Todas las parciales en un solo vector',steps:[
     {h:'Definición',html:T`<p>El <b>gradiente</b> de \(f(x,y)\) es el vector de sus derivadas parciales:</p>\[\nabla f(x,y)=\left(\frac{\partial f}{\partial x},\,\frac{\partial f}{\partial y}\right)=(f_x,f_y).\]<p>Para \(f=x^2+2y^2\): \(\nabla f=(2x,\,4y)\). En \((1,1)\): \(\nabla f=(2,4)\).</p>`},
     {h:'Pasa el cursor por el mapa',html:T`<p>La flecha cian es \(\nabla f\) en cada punto. Fíjate: siempre apunta «cuesta arriba» y es <b>perpendicular</b> a la curva de nivel que pasa por ahí.</p>`,viz:{k:'cont',f:'x^2+2*y^2',xr:[-3,3],yr:[-3,3],hoverGrad:true,pt:[1,1],grad:true}},
     {h:'En tres variables',html:T`<p>Se añade una componente: \(\nabla f=(f_x,f_y,f_z)\). Para \(f=xyz\): \(\nabla f=(yz,\,xz,\,xy)\).</p>`}],
    quiz:[qVec(T`Para \(f(x,y)=x^2y\), calcula \(\nabla f(1,2)\).`,[4,1],[],{chk:()=>gradN(F2('x^2*y'),[1,2])})]},
   {id:'l2',t:'Derivada direccional',sub:'Cambio en cualquier dirección',steps:[
     {h:'La fórmula',html:T`<p>La razón de cambio de \(f\) en \(P\) en la dirección del vector <b>unitario</b> \(\mathbf u\) es</p>\[D_{\mathbf u}f(P)=\nabla f(P)\cdot\mathbf u=\|\nabla f\|\cos\theta,\]<p>donde \(\theta\) es el ángulo entre \(\nabla f\) y \(\mathbf u\).</p>`},
     {h:'Gira la dirección',html:T`<p>Gira \(\mathbf u\) con el deslizador o arrastrando sobre el mapa. El medidor muestra \(D_{\mathbf u}f\): es máximo cuando \(\mathbf u\) apunta como \(\nabla f\), cero cuando es perpendicular y mínimo en sentido contrario.</p>`,viz:{k:'dirder',f:'x^2+2*y^2',P:[1,1],xr:[-3,3],yr:[-3,3]}},
     {h:'Un ejemplo completo',html:T`<p>\(f=x^2+2y^2\), \(P(1,1)\), dirección \(\mathbf v=(3,4)\). Como \(\|\mathbf v\|=5\), \(\mathbf u=(3/5,4/5)\). Entonces</p>\[D_{\mathbf u}f=(2,4)\cdot\left(\tfrac35,\tfrac45\right)=\tfrac65+\tfrac{16}{5}=\tfrac{22}{5}=4{,}4.\]`}],
    quiz:[qNum(T`Con \(\nabla f(P)=(2,4)\) y \(\mathbf u=(0{,}6;\,0{,}8)\), calcula \(D_{\mathbf u}f(P)\).`,4.4,{dec:1,chk:()=>2*0.6+4*0.8})]},
   {id:'l3',t:'Máximo crecimiento y normales',sub:'Por qué el gradiente manda',steps:[
     {h:'La dirección de mayor cambio',html:T`<p>Como \(D_{\mathbf u}f=\|\nabla f\|\cos\theta\), el valor más grande ocurre con \(\theta=0\) (dirección \(\nabla f\)) y vale \(\|\nabla f\|\). El más negativo, en \(-\nabla f\), vale \(-\|\nabla f\|\). Y con \(\theta=90^\circ\) la derivada es \(0\): te mueves sobre la curva de nivel.</p>`},
     {h:'Perpendicular al nivel',html:T`<p>\(\nabla f(P)\) es <b>normal</b> a la curva de nivel (o superficie de nivel) que pasa por \(P\). Aquí, el nivel de \(f=x^2-y^2\) por \((1,0{,}5)\).</p>`,viz:{k:'cont',f:'x^2-y^2',xr:[-3,3],yr:[-3,3],hl:[0.75],pt:[1,0.5],grad:true,hoverGrad:true}},
     {h:'Plano tangente a una superficie de nivel',html:T`<p>Para \(F(x,y,z)=c\), el plano tangente en \(P_0\) es \(\nabla F(P_0)\cdot(x-x_0,\,y-y_0,\,z-z_0)=0\).</p><div class="callout ai"><b class="t">Conexión con IA</b>El descenso del gradiente usa \(-\nabla L\): la dirección de <i>máxima bajada</i> de la pérdida.</div>`}],
    quiz:[qMC(T`¿Cuál es la dirección de máximo <b>descenso</b> de \(f\) en un punto?`,[T`\(\nabla f\)`,T`\(-\nabla f\)`,T`un vector perpendicular a \(\nabla f\)`,T`\(\mathbf 0\)`],1,{why:T`\(D_{\mathbf u}f\) es mínimo (\(-\|\nabla f\|\)) cuando \(\mathbf u\) apunta como \(-\nabla f\).`})]}
  ],
  retos:[
   {id:'p1',t:'Calcular el gradiente',q:T`Sea \(f(x,y)=x^2y+\ln y\), con \(y>0\).`,
    parts:[qVec(T`\(\nabla f(x,y)\) (escribe <code>(a, b)</code>)`,['2*x*y','x^2+1/y'],['x','y'],{chk:(x,y)=>gradN(F2('x^2*y+ln(y)'),[x,y])}),qVec(T`\(\nabla f(2,1)\)`,[4,5],[],{chk:()=>gradN(F2('x^2*y+ln(y)'),[2,1])})],
    hint:T`\(f_x=2xy\) (el \(\ln y\) es constante) y \(f_y=x^2+\dfrac1y\).`,
    sol:T`<p>\(\nabla f=\left(2xy,\;x^2+\dfrac1y\right)\). En \((2,1)\): \((4,\,4+1)=(4,5)\).</p>`},
   {id:'p2',t:'Derivada direccional',q:T`Sea \(f(x,y)=x^2+xy+y^2\), el punto \(P(1,2)\) y la dirección del vector \(\mathbf v=(3,4)\).`,
    parts:[qVec(T`El vector unitario \(\mathbf u\) en la dirección de \(\mathbf v\)`,[0.6,0.8],[],{tol:0.01,chk:()=>[3/5,4/5]}),qNum(T`\(D_{\mathbf u}f(P)\)`,6.4,{dec:2,show:T`\tfrac{32}{5}`,chk:()=>{const g=gradN(F2('x^2+x*y+y^2'),[1,2]); return g[0]*.6+g[1]*.8;},traps:[{v:32,msg:'Olvidaste normalizar: \\(\\mathbf v\\) tiene longitud 5, no 1.'}]})],
    hint:T`\(\nabla f=(2x+y,\;x+2y)=(4,5)\) en \(P\). Normaliza \(\mathbf v\) dividiendo entre \(\|\mathbf v\|=5\).`,
    sol:T`<p>\(\nabla f(1,2)=(4,5)\), \(\mathbf u=(3/5,4/5)\). \(D_{\mathbf u}f=\tfrac{12}{5}+\tfrac{20}{5}=\tfrac{32}{5}=6{,}4\).</p>`},
   {id:'p3',t:'Apunta al ascenso',q:T`Sea \(f(x,y)=x^2+2y^2\) y \(P(1,1)\).`,
    parts:[qDir(T`Haz clic en el mapa para que la flecha ámbar salga de \(P\) en la dirección de máximo crecimiento (±14°).`,{f:'x^2+2*y^2',P:[1,1],xr:[-3,3],yr:[-3,3]}),qNum(T`La tasa máxima de cambio en \(P\) (con 2 decimales)`,Math.sqrt(20),{dec:2,show:T`\sqrt{20}`,chk:()=>Math.hypot(...gradN(F2('x^2+2*y^2'),[1,1]))})],
    hint:T`\(\nabla f=(2x,4y)=(2,4)\) en \(P\). La dirección de máximo ascenso es \(\nabla f\); la tasa es \(\|\nabla f\|\).`,
    sol:T`<p>\(\nabla f(1,1)=(2,4)\): apunta unos \(63^\circ\) respecto al eje \(x\). Tasa máxima \(\|\nabla f\|=\sqrt{20}\approx4{,}47\).</p>`},
   {id:'p4',t:'En tres variables',q:T`Sea \(f(x,y,z)=xy+yz+zx\) y \(P(1,2,3)\).`,
    parts:[qVec(T`\(\nabla f(P)\)`,[5,4,3],[],{chk:()=>gradN(F3('x*y+y*z+z*x'),[1,2,3])}),qNum(T`\(D_{\mathbf u}f(P)\) en la dirección de \(\mathbf v=(1,2,2)\) (recuerda normalizar; \(\|\mathbf v\|=3\))`,19/3,{dec:2,show:T`\tfrac{19}{3}`,chk:()=>{const g=gradN(F3('x*y+y*z+z*x'),[1,2,3]); return (g[0]*1+g[1]*2+g[2]*2)/3;},traps:[{v:19,msg:'Falta dividir entre \\(\\|\\mathbf v\\|=3\\).'}]}),qNum(T`La tasa de <b>máximo descenso</b> en \(P\) (número negativo, 2 decimales)`,-Math.sqrt(50),{dec:2,show:T`-\sqrt{50}`,chk:()=>-Math.hypot(...gradN(F3('x*y+y*z+z*x'),[1,2,3]))})],
    hint:T`\(\nabla f=(y+z,\;x+z,\;x+y)\). El descenso más rápido vale \(-\|\nabla f\|\).`,
    sol:T`<p>\(\nabla f(P)=(5,4,3)\). \(D_{\mathbf u}f=\dfrac{5+8+6}{3}=\dfrac{19}{3}\approx6{,}33\). Máximo descenso: \(-\sqrt{25+16+9}=-\sqrt{50}\approx-7{,}07\).</p>`},
   {id:'p5',t:'Plano tangente a una esfera',q:T`La esfera \(x^2+y^2+z^2=14\) pasa por \(P_0(1,2,3)\). Sea \(F(x,y,z)=x^2+y^2+z^2\).`,
    parts:[qVec(T`Un vector normal a la esfera en \(P_0\): \(\nabla F(P_0)\)`,[2,4,6],[],{chk:()=>gradN(F3('x^2+y^2+z^2'),[1,2,3])}),qNum(T`El plano tangente \(2(x-1)+4(y-2)+6(z-3)=0\) corta al eje \(z\) (con \(x=y=0\)) en \(z=\)`,14/3,{dec:2,show:T`\tfrac{14}{3}`,chk:()=>{const n=[2,4,6]; return 3+(n[0]*1+n[1]*2)/n[2];}})],
    hint:T`Con \(x=y=0\): \(-2-8+6(z-3)=0\).`,
    sol:T`<p>\(\nabla F=(2x,2y,2z)=(2,4,6)\). Plano: \(2x+4y+6z=28\). Con \(x=y=0\): \(z=\dfrac{28}{6}=\dfrac{14}{3}\approx4{,}67\).</p>`}
  ],
  boss:{name:'El Coloso del Gradiente',glyph:'∇',story:'Un gigante de campos vectoriales bloquea el paso. Solo quien lea gradientes y direcciones lo vencerá.',phases:[
    {t:'Fase 1 · Gradiente',q:T`Sea \(f(x,y)=\ln(x^2+y^2)\) y el punto \((1,-1)\).`,parts:[qVec(T`\(\nabla f(1,-1)\)`,[1,-1],[],{chk:()=>gradN(F2('ln(x^2+y^2)'),[1,-1])})],hint:T`\(f_x=\dfrac{2x}{x^2+y^2}\) y \(f_y=\dfrac{2y}{x^2+y^2}\).`,sol:T`<p>\(\nabla f=\dfrac{(2x,2y)}{x^2+y^2}\). En \((1,-1)\): \(\dfrac{(2,-2)}{2}=(1,-1)\).</p>`},
    {t:'Fase 2 · Rumbo',q:T`Sea \(f(x,y)=x^2y\). Desde \(P(2,1)\) te mueves hacia \(Q(5,5)\).`,parts:[qNum(T`\(D_{\mathbf u}f(P)\) con \(\mathbf u\) unitario hacia \(Q\)`,5.6,{dec:2,show:T`\tfrac{28}{5}`,chk:()=>{const g=gradN(F2('x^2*y'),[2,1]); return (g[0]*3+g[1]*4)/5;},traps:[{v:28,msg:'Falta normalizar \\(\\overrightarrow{PQ}=(3,4)\\): su longitud es 5.'}]})],hint:T`\(\overrightarrow{PQ}=(3,4)\), \(\mathbf u=(3,4)/5\). \(\nabla f=(2xy,\,x^2)\).`,sol:T`<p>\(\nabla f(2,1)=(4,4)\). \(D_{\mathbf u}f=\dfrac{12+16}{5}=5{,}6\).</p>`},
    {t:'Fase 3 · Descenso',q:T`Pérdida \(L(w_1,w_2)=w_1^2+3w_2^2\). Partes de \(\mathbf w_0=(2,1)\) con tasa de aprendizaje \(\eta=0{,}1\). Un paso: \(\mathbf w_1=\mathbf w_0-\eta\nabla L(\mathbf w_0)\).`,parts:[qVec(T`\(\mathbf w_1\)`,[1.6,0.4],[],{tol:0.01,chk:()=>{const g=gradN(F2('x^2+3*y^2'),[2,1]); return [2-.1*g[0],1-.1*g[1]];}}),qNum(T`\(L(\mathbf w_1)\) (antes valía \(L(\mathbf w_0)=7\))`,3.04,{dec:2,chk:()=>F2('x^2+3*y^2')(1.6,0.4)})],hint:T`\(\nabla L=(2w_1,\,6w_2)=(4,6)\). Entonces \(\mathbf w_1=(2-0{,}4,\;1-0{,}6)\).`,sol:T`<p>\(\mathbf w_1=(1{,}6;\,0{,}4)\). \(L(\mathbf w_1)=2{,}56+3(0{,}16)=3{,}04<7\): la pérdida bajó.</p>`}
  ]}
});

/* ---- 04e-world-ext.js ---- */
/* ================= MUNDO 5 · Puntos críticos y multiplicadores de Lagrange ================= */
defWorld({
  id:'ext', name:'Puntos críticos y Lagrange', short:'Extremos', glyph:'λ', hue:38,
  bg:'x^3/3-x+y^2*0.9-0.2', thumb:{k:'surf',f:'x^3+y^3-3*x*y',xr:[-1.6,2],yr:[-1.6,2],zr:[-4,6]},
  sub:'Cimas, valles y sillas; y cómo optimizar sobre una restricción.',
  brief:T`<p>Optimizar es encontrar el <b>mejor valor</b>: el punto más bajo de una pérdida, el volumen máximo con un material fijo. Primero buscas los <b>puntos críticos</b> (\(\nabla f=\mathbf0\)) y los clasificas con las segundas derivadas. Cuando hay una <b>restricción</b>, entran los multiplicadores de Lagrange.</p>`,
  goals:['Resolver \\(\\nabla f=\\mathbf0\\)','Clasificar con \\(D=f_{xx}f_{yy}-f_{xy}^2\\)','Hallar extremos absolutos en una región cerrada','Aplicar \\(\\nabla f=\\lambda\\nabla g\\)'],
  ai:T`<p>Entrenar un modelo es minimizar una pérdida. Los <b>puntos silla</b> son mucho más comunes que los mínimos locales en redes grandes, y el análisis del hessiano explica por qué el entrenamiento a veces «se atasca» en mesetas. Y regularizar (por ejemplo, limitar la norma de los pesos) es optimizar con restricción.</p>`,
  recipe:['Calcula \\(f_x\\) y \\(f_y\\); resuelve \\(f_x=0,\;f_y=0\\) para hallar los puntos críticos.','En cada uno calcula \\(D=f_{xx}f_{yy}-f_{xy}^2\\).','\\(D>0\\) y \\(f_{xx}>0\\): mínimo local. \\(D>0\\) y \\(f_{xx}<0\\): máximo local. \\(D<0\\): silla. \\(D=0\\): no concluye.','Con restricción \\(g=c\\): resuelve \\(\\nabla f=\\lambda\\nabla g\\) junto con \\(g=c\\) y compara los valores de \\(f\\).'],
  pitfalls:['Perder soluciones al resolver el sistema: cuidado al dividir entre una variable que puede ser \\(0\\).','Olvidar mirar la frontera al buscar extremos absolutos.','Creer que \\(D=0\\) significa silla: el criterio no concluye.'],
  classQ:[T`¿Puede una función tener un máximo local sin ser máximo absoluto? Da un ejemplo con \(f(x,y)\).`,T`En Lagrange, ¿qué significa geométricamente que \(\nabla f\) sea paralelo a \(\nabla g\) en el óptimo?`],
  lessons:[
   {id:'l1',t:'Puntos críticos',sub:'Donde el gradiente se anula',steps:[
     {h:'Qué son',html:T`<p>Un punto \((a,b)\) es <b>crítico</b> si \(\nabla f(a,b)=\mathbf0\) (o si \(f\) no es derivable ahí). Es donde el plano tangente es horizontal: candidato a cima, valle o silla.</p>`},
     {h:'Un ejemplo',html:T`<p>\(f=x^3+y^3-3xy\). Igualamos \(f_x=3x^2-3y=0\) y \(f_y=3y^2-3x=0\). De la primera, \(y=x^2\); en la segunda, \(3x^4-3x=0\Rightarrow x(x^3-1)=0\): \(x=0\) o \(x=1\). Puntos críticos: \((0,0)\) y \((1,1)\).</p>`,viz:{k:'surf',f:'x^3+y^3-3*x*y',xr:[-1.6,2],yr:[-1.6,2],zr:[-4,6],marks:[[0,0,'#ffc24d','silla'],[1,1,'#3dffa0','mínimo']]}},
     {h:'Cuidado al resolver',html:T`<div class="callout warn"><b class="t">Ojo</b>Al resolver el sistema, no dividas entre \(x\) sin comprobar el caso \(x=0\): perderías el punto \((0,0)\). Factoriza en vez de simplificar.</div>`}],
    quiz:[qPts(T`Halla el punto crítico de \(f(x,y)=x^2-4x+y^2+2y+1\). Escríbelo como <code>(a, b)</code>.`,[[2,-1]],{chk:(q)=>gradN(F2('x^2-4*x+y^2+2*y+1'),q).every(g=>Math.abs(g)<1e-6)})]},
   {id:'l2',t:'Criterio de la segunda derivada',sub:'Mínimo, máximo o silla',steps:[
     {h:'El discriminante',html:T`<p>En un punto crítico, calcula \(D=f_{xx}f_{yy}-f_{xy}^2\) (el determinante de la hessiana).</p><ul class="list"><li>\(D>0,\;f_{xx}>0\): <b>mínimo local</b>.</li><li>\(D>0,\;f_{xx}<0\): <b>máximo local</b>.</li><li>\(D<0\): <b>punto silla</b>.</li><li>\(D=0\): el criterio no decide.</li></ul>`},
     {h:'Aplícalo',html:T`<p>Con \(f=x^3+y^3-3xy\): \(f_{xx}=6x,\;f_{yy}=6y,\;f_{xy}=-3\). En \((0,0)\): \(D=0-9=-9<0\): silla. En \((1,1)\): \(D=36-9=27>0\) y \(f_{xx}=6>0\): mínimo local, con \(f(1,1)=-1\). Gira la superficie y localiza los dos puntos.</p>`,viz:{k:'surf',f:'x^3+y^3-3*x*y',xr:[-1.6,2],yr:[-1.6,2],zr:[-4,6],marks:[[0,0,'#ffc24d','silla'],[1,1,'#3dffa0','mínimo']]}},
     {h:'Para qué sirve',html:T`<div class="callout ai"><b class="t">Conexión con IA</b>\(D>0\) significa curvatura del mismo signo en todas las direcciones: un valle. \(D<0\): sube en unas direcciones y baja en otras, como una silla. En redes profundas abundan las sillas.</div>`}],
    quiz:[qMC(T`En un punto crítico de \(f=x^2-y^2\) tenemos \(D=-4\). Es:`,[T`mínimo local`,T`máximo local`,T`punto silla`,T`el criterio no decide`],2,{why:T`\(D<0\): silla.`})]},
   {id:'l3',t:'Multiplicadores de Lagrange',sub:'Optimizar sobre una curva',steps:[
     {h:'La idea',html:T`<p>Para optimizar \(f\) sujeta a \(g(x,y)=c\), en el óptimo la curva de nivel de \(f\) es <b>tangente</b> a la restricción; entonces los gradientes son paralelos:</p>\[\nabla f=\lambda\,\nabla g,\qquad g(x,y)=c.\]`},
     {h:'Recórrelo',html:T`<p>Optimiza \(f=xy\) sobre la circunferencia \(x^2+y^2=4\). Mueve el punto: donde la curva ámbar toca la restricción de lado, \(\nabla f\) y \(\nabla g\) son paralelos (el chip se ilumina).</p>`,viz:{k:'lagr',f:'x*y',g:'x^2+y^2',p:['2*cos(t)','2*sin(t)'],gtxt:'x²+y²=4',opt:[{t:Math.PI/4,label:'Máx (√2, √2)'},{t:3*Math.PI/4,label:'Mín (−√2, √2)'},{t:5*Math.PI/4,label:'Máx (−√2, −√2)'},{t:7*Math.PI/4,label:'Mín (√2, −√2)'}],xr:[-3.4,3.4],yr:[-2.6,2.6]}},
     {h:'El procedimiento',html:T`<p>Resuelve el sistema \(f_x=\lambda g_x,\;f_y=\lambda g_y,\;g=c\); evalúa \(f\) en todas las soluciones; el mayor valor es el máximo y el menor, el mínimo.</p>`}],
    quiz:[qNum(T`Maximiza \(f=x+y\) sujeta a \(x^2+y^2=2\). ¿Cuál es el valor máximo de \(f\)?`,2,{dec:1,chk:()=>Math.max(...Array.from({length:3600},(_,i)=>{const t=i*Math.PI/1800; return Math.sqrt(2)*(Math.cos(t)+Math.sin(t));}))})]}
  ],
  retos:[
   {id:'p1',t:'Encuentra los críticos',q:T`Sea \(f(x,y)=x^3+y^3-3xy\).`,viz:{k:'surf',f:'x^3+y^3-3*x*y',xr:[-1.6,2],yr:[-1.6,2],zr:[-4,6]},
    parts:[qPts(T`Todos los puntos críticos, separados por punto y coma: <code>(a, b); (c, d)</code>`,[[0,0],[1,1]],{chk:(q)=>gradN(F2('x^3+y^3-3*x*y'),q).every(g=>Math.abs(g)<1e-6)})],
    hint:T`\(f_x=3x^2-3y\) y \(f_y=3y^2-3x\). De \(f_x=0\): \(y=x^2\). Sustituye en \(f_y=0\).`,
    sol:T`<p>\(y=x^2\Rightarrow 3x^4-3x=0\Rightarrow x(x^3-1)=0\). Con \(x=0\): \(y=0\). Con \(x=1\): \(y=1\). Puntos: \((0,0)\) y \((1,1)\).</p>`},
   {id:'p2',t:'Clasifícalos',q:T`Con la misma \(f(x,y)=x^3+y^3-3xy\), \(f_{xx}=6x,\;f_{yy}=6y,\;f_{xy}=-3\).`,
    parts:[qNum(T`\(D(0,0)\)`,-9,{dec:0,chk:()=>hess2(F2('x^3+y^3-3*x*y'),0,0).D}),qNum(T`\(D(1,1)\)`,27,{dec:0,chk:()=>hess2(F2('x^3+y^3-3*x*y'),1,1).D}),qMC(T`El punto \((1,1)\) es:`,[T`máximo local`,T`mínimo local`,T`punto silla`,T`el criterio no decide`],1,{why:T`\(D=27>0\) y \(f_{xx}=6>0\).`}),qNum(T`El valor \(f(1,1)\)`,-1,{dec:0,chk:()=>F2('x^3+y^3-3*x*y')(1,1)})],
    hint:T`\(D=f_{xx}f_{yy}-f_{xy}^2=(6x)(6y)-9\). Evalúa en cada punto.`,
    sol:T`<p>\(D(0,0)=0-9=-9\) (silla). \(D(1,1)=36-9=27>0\), \(f_{xx}=6>0\): mínimo local. \(f(1,1)=1+1-3=-1\).</p>`},
   {id:'p3',t:'Extremos absolutos en un disco',q:T`Halla los valores máximo y mínimo absolutos de \(f(x,y)=x^2+y^2-2x\) en el disco cerrado \(x^2+y^2\le4\).`,viz:{k:'cont',f:'x^2+y^2-2*x',xr:[-3,3],yr:[-3,3],levels:[-1,0,1,2,4,6,8],marks:[[1,0,'#3dffa0','crítico'],[-2,0,'#ff4d79','frontera']]},
    parts:[qNum(T`Máximo absoluto`,8,{dec:0,chk:()=>scanDisk(F2('x^2+y^2-2*x'),2)[1]}),qNum(T`Mínimo absoluto`,-1,{dec:0,chk:()=>scanDisk(F2('x^2+y^2-2*x'),2)[0]})],
    hint:T`Interior: \(\nabla f=(2x-2,\,2y)=0\Rightarrow(1,0)\), donde \(f=-1\). Frontera: \(x^2+y^2=4\Rightarrow f=4-2x\) con \(x\in[-2,2]\).`,
    sol:T`<p>Interior: \((1,0)\), \(f=-1\). Frontera: \(f=4-2x\), entre \(0\) (en \(x=2\)) y \(8\) (en \(x=-2\)). Máximo \(8\) en \((-2,0)\); mínimo \(-1\) en \((1,0)\).</p>`},
   {id:'p4',t:'Lagrange con una circunferencia',q:T`Optimiza \(f(x,y)=x+2y\) sujeta a \(x^2+y^2=5\).`,viz:{k:'lagr',f:'x+2*y',g:'x^2+y^2',p:['sqrt(5)*cos(t)','sqrt(5)*sin(t)'],gtxt:'x²+y²=5',opt:[{t:1.1071,label:'Máx'},{t:1.1071+Math.PI,label:'Mín'}],xr:[-3.6,3.6],yr:[-3,3]},
    parts:[qPts(T`Los dos puntos candidatos: <code>(a, b); (c, d)</code>`,[[1,2],[-1,-2]],{chk:(q)=>Math.abs(q[0]*q[0]+q[1]*q[1]-5)<1e-9&&Math.abs(q[1]-2*q[0])<1e-9}),qNum(T`El valor máximo de \(f\)`,5,{dec:1,chk:()=>Math.max(...Array.from({length:3600},(_,i)=>{const t=i*Math.PI/1800; return Math.sqrt(5)*Math.cos(t)+2*Math.sqrt(5)*Math.sin(t);}))})],
    hint:T`\(\nabla f=(1,2)=\lambda(2x,2y)\Rightarrow x=\dfrac1{2\lambda},\;y=\dfrac1\lambda\). Sustituye en \(x^2+y^2=5\).`,
    sol:T`<p>\(\dfrac1{4\lambda^2}+\dfrac1{\lambda^2}=5\Rightarrow\lambda=\pm\dfrac12\). Puntos \((1,2)\) con \(f=5\) (máximo) y \((-1,-2)\) con \(f=-5\) (mínimo).</p>`},
   {id:'p5',t:'Lagrange con una recta',q:T`Maximiza \(f(x,y)=xy\) sujeta a \(2x+3y=12\), con \(x,y>0\).`,viz:{k:'lagr',f:'x*y',g:'2*x+3*y',p:['t','(12-2*t)/3'],tr:[0,6],gtxt:'2x+3y=12',opt:[{t:3,label:'Máx (3, 2)'}],xr:[-1,7],yr:[-1,6]},
    parts:[qPts(T`El punto óptimo <code>(a, b)</code>`,[[3,2]],{chk:(q)=>Math.abs(2*q[0]+3*q[1]-12)<1e-9&&Math.abs(q[0]/3-q[1]/2)<1e-9}),qNum(T`El valor máximo de \(f\)`,6,{dec:1,chk:()=>Math.max(...Array.from({length:1201},(_,i)=>{const x=i*0.005; return x*(12-2*x)/3;}))}),qNum(T`El multiplicador \(\lambda\) (con \(\nabla f=\lambda\nabla g\))`,1,{dec:1,chk:()=>2/2})],
    hint:T`\(\nabla f=(y,x)=\lambda(2,3)\Rightarrow y=2\lambda,\;x=3\lambda\). Sustituye en \(2x+3y=12\).`,
    sol:T`<p>\(6\lambda+6\lambda=12\Rightarrow\lambda=1\Rightarrow(x,y)=(3,2)\), con \(f=6\).</p>`}
  ],
  boss:{name:'El Guardián de la Colina',glyph:'λ',story:'Custodia un relieve lleno de cimas, valles y sillas. Para pasar, clasifica, optimiza y restringe.',phases:[
    {t:'Fase 1 · Relieve',q:T`Sea \(f(x,y)=x^3-3x+y^2\).`,parts:[qPts(T`Todos los puntos críticos`,[[1,0],[-1,0]],{chk:(q)=>gradN(F2('x^3-3*x+y^2'),q).every(g=>Math.abs(g)<1e-6)}),qNum(T`El valor de \(f\) en el mínimo local`,-2,{dec:0,chk:()=>F2('x^3-3*x+y^2')(1,0)})],hint:T`\(f_x=3x^2-3=0\Rightarrow x=\pm1\) y \(f_y=2y=0\). \(D=f_{xx}f_{yy}-f_{xy}^2=(6x)(2)\): mira su signo.`,sol:T`<p>Críticos: \((1,0)\) y \((-1,0)\). \(D=12x\): en \((1,0)\), \(D=12>0\) y \(f_{xx}=6>0\): mínimo, con \(f=-2\). En \((-1,0)\), \(D=-12\): silla.</p>`},
    {t:'Fase 2 · Restricción de plano',q:T`Minimiza \(f(x,y,z)=x^2+y^2+z^2\) sujeta a \(x+2y+2z=9\) (la distancia al cuadrado del origen al plano).`,parts:[qPts(T`El punto óptimo <code>(a, b, c)</code>`,[[1,2,2]],{chk:(q)=>Math.abs(q[0]+2*q[1]+2*q[2]-9)<1e-9&&Math.abs(q[1]-2*q[0])<1e-9&&Math.abs(q[2]-2*q[0])<1e-9}),qNum(T`El valor mínimo de \(f\)`,9,{dec:0,chk:()=>1+4+4})],hint:T`\(2(x,y,z)=\lambda(1,2,2)\Rightarrow(x,y,z)=\tfrac\lambda2(1,2,2)\). Sustituye en el plano.`,sol:T`<p>\(\tfrac\lambda2(1+4+4)=9\Rightarrow\lambda=2\Rightarrow(1,2,2)\). \(f=1+4+4=9\); la distancia mínima es \(3\).</p>`},
    {t:'Fase 3 · Presupuesto',q:T`Maximiza \(f(x,y)=xy^2\) sujeta a \(x+y=6\), con \(x,y\ge0\).`,parts:[qPts(T`El punto óptimo <code>(a, b)</code>`,[[2,4]],{chk:(q)=>Math.abs(q[0]+q[1]-6)<1e-9&&Math.abs(q[1]-2*q[0])<1e-9}),qNum(T`El valor máximo de \(f\)`,32,{dec:0,chk:()=>Math.max(...Array.from({length:1201},(_,i)=>{const x=i*0.005; return x*(6-x)*(6-x);}))})],hint:T`\((y^2,\,2xy)=\lambda(1,1)\Rightarrow y^2=2xy\Rightarrow y=2x\) (con \(y\ne0\)).`,sol:T`<p>\(y=2x\) y \(x+y=6\Rightarrow x=2,\;y=4\). \(f=2\cdot16=32\).</p>`}
  ]}
});

/* ================= MUNDO 6 · Integrales dobles y triples ================= */
defWorld({
  id:'int', name:'Integrales dobles y triples', short:'Integrales', glyph:'∬', hue:215,
  bg:'exp(-(x^2+y^2)*2.2)*1.7*cos(1.2*x)-0.25', thumb:{k:'surf',f:'exp(-(x^2+y^2)/1.5)*2',xr:[-2.5,2.5],yr:[-2.5,2.5]},
  sub:'Sumar infinitos pedacitos: áreas, volúmenes y masas.',
  brief:T`<p>La integral de una variable suma pedacitos a lo largo de un intervalo. La <b>integral doble</b> suma sobre una región del plano y mide, por ejemplo, el volumen bajo una superficie. La <b>triple</b> suma sobre un sólido. Aprenderás a plantearlas como <b>integrales iteradas</b>, a cambiar el orden y a usar coordenadas polares.</p>`,
  goals:['Calcular \\(\\iint_R f\\,dA\\) sobre rectángulos (Fubini)','Describir regiones tipo I y II y cambiar el orden','Usar coordenadas polares \\(dA=r\\,dr\\,d\\theta\\)','Calcular integrales triples y volúmenes'],
  ai:T`<p>Una densidad de probabilidad \(p(x,y)\) se normaliza con \(\iint p\,dA=1\). Esperanzas, probabilidades y la constante de una gaussiana 2D son integrales dobles. Por eso la integral de \(e^{-(x^2+y^2)}\) en polares es tan famosa.</p>`,
  recipe:['Dibuja la región y decide el orden de integración (a veces uno solo es posible).','Escribe los límites: de la variable interna en función de la externa; los externos, constantes.','Integra primero la variable interna, tratando la otra como constante.','En un disco o sector, considera polares: \\(x=r\\cos\\theta,\;y=r\\sin\\theta,\;dA=r\\,dr\\,d\\theta\\).'],
  pitfalls:['Olvidar el factor \\(r\\) al pasar a polares.','Poner límites variables en la integral externa.','Integrar con los límites en orden inverso y obtener el signo contrario.'],
  classQ:[T`¿Por qué \(\iint_R 1\,dA\) es el área de \(R\)? ¿Y \(\iiint_E 1\,dV\)?`,T`Da un ejemplo de integral cuyo orden \(dy\,dx\) no se puede resolver, pero \(dx\,dy\) sí.`],
  lessons:[
   {id:'l1',t:'Integral doble en rectángulos',sub:'Sumas de Riemann y Fubini',steps:[
     {h:'Sumas de Riemann',html:T`<p>Divide el rectángulo \(R=[a,b]\times[c,d]\) en rectangulitos de área \(\Delta A\). La suma \(\sum f(x_i,y_j)\,\Delta A\) aproxima el volumen bajo la superficie. Al refinar, converge a \(\iint_Rf\,dA\).</p>`,viz:{k:'riemann',f:'x*y+1',xr:[0,2],yr:[0,2],n0:3}},
     {h:'Teorema de Fubini',html:T`<p>Para \(f\) continua en un rectángulo, la doble integral es una <b>integral iterada</b> y el orden no importa:</p>\[\iint_R f\,dA=\int_a^b\!\int_c^d f(x,y)\,dy\,dx=\int_c^d\!\int_a^b f(x,y)\,dx\,dy.\]`},
     {h:'Un ejemplo',html:T`<p>\(\displaystyle\int_0^1\!\int_0^2(x+y)\,dy\,dx=\int_0^1\Big[xy+\tfrac{y^2}{2}\Big]_{0}^{2}dx=\int_0^1(2x+2)\,dx=1+2=3.\)</p><div class="callout warn"><b class="t">Ojo</b>Al integrar respecto a \(y\), \(x\) es una constante.</div>`}],
    quiz:[qNum(T`Calcula \(\displaystyle\int_0^1\!\int_0^2(x+y)\,dy\,dx\).`,3,{dec:0,chk:()=>integ2((x,y)=>x+y,0,1,0,2)})]},
   {id:'l2',t:'Regiones generales y polares',sub:'Tipo I, tipo II, cambio de orden',steps:[
     {h:'Región tipo I',html:T`<p>Si la región está entre \(y=g_1(x)\) y \(y=g_2(x)\) para \(a\le x\le b\):</p>\[\iint_Df\,dA=\int_a^b\!\int_{g_1(x)}^{g_2(x)}f(x,y)\,dy\,dx.\]<p>Desliza la franja ámbar: es la integral interna en cada \(x\); al barrer toda la región se acumula la externa.</p>`,viz:{k:'region',f:'x*y',ord:'x',a:0,b:1,lo:'x^2',hi:'sqrt(x)',xr:[-.3,1.4],yr:[-.3,1.4]}},
     {h:'Coordenadas polares',html:T`<p>En discos y sectores conviene \(x=r\cos\theta,\;y=r\sin\theta\), con \(dA=r\,dr\,d\theta\). Para \(f=x^2+y^2=r^2\) sobre el cuarto de disco de radio 2, \(\int_0^{\pi/2}\!\int_0^2r^2\cdot r\,dr\,d\theta=\tfrac\pi2\cdot4=2\pi\).</p>`,viz:{k:'region',f:'x^2+y^2',polar:{r:[0,2],th:[0,Math.PI/2]},xr:[-.5,2.5],yr:[-.5,2.5]}},
     {h:'Cambiar el orden',html:T`<div class="callout"><b class="t">Truco</b>\(\displaystyle\int_0^1\!\int_x^1e^{y^2}\,dy\,dx\) no tiene primitiva elemental en \(y\). Dibuja la región (\(0\le x\le y\le1\)) e integra primero en \(x\): \(\displaystyle\int_0^1\!\int_0^ye^{y^2}\,dx\,dy=\int_0^1ye^{y^2}\,dy=\tfrac{e-1}{2}\).</div>`}],
    quiz:[qNum(T`El área de la región entre \(y=x^2\) y \(y=x\) es \(\displaystyle\int_0^1\!\int_{x^2}^{x}1\,dy\,dx\). Calcúlala (3 decimales).`,1/6,{dec:3,show:T`\tfrac16`,chk:()=>integ2(()=>1,0,1,x=>x*x,x=>x)})]},
   {id:'l3',t:'Integrales triples',sub:'Sólidos, volúmenes y masas',steps:[
     {h:'La integral triple',html:T`<p>Sobre un sólido \(E\): \(\iiint_Ef\,dV=\displaystyle\int_a^b\!\int_{g_1(x)}^{g_2(x)}\!\int_{h_1(x,y)}^{h_2(x,y)}f\,dz\,dy\,dx\). Con \(f=1\) obtienes el <b>volumen</b>.</p>`},
     {h:'Un tetraedro',html:T`<p>\(E:\;x,y,z\ge0,\;x+y+z\le1\). Sus límites: \(0\le x\le1\), \(0\le y\le1-x\), \(0\le z\le1-x-y\). Su volumen es \(\tfrac16\).</p>`,viz:{k:'solid',box:{xr:[0,1.1],yr:[0,1.1],zr:[0,1.1]},items:[{t:'poly',pts:[[0,0,0],[1,0,0],[0,1,0]],col:[34,230,255],alpha:.35},{t:'poly',pts:[[0,0,0],[1,0,0],[0,0,1]],col:[255,61,240],alpha:.35},{t:'poly',pts:[[0,0,0],[0,1,0],[0,0,1]],col:[61,255,160],alpha:.35},{t:'poly',pts:[[1,0,0],[0,1,0],[0,0,1]],col:[255,194,77],alpha:.45}],legend:'tetraedro x+y+z≤1'}},
     {h:'Cilíndricas y esféricas',html:T`<p>Cilíndricas: \(dV=r\,dz\,dr\,d\theta\). Esféricas: \(dV=\rho^2\sin\varphi\,d\rho\,d\varphi\,d\theta\). El volumen de una esfera de radio \(R\) sale de \(\int_0^{2\pi}\!\int_0^\pi\!\int_0^R\rho^2\sin\varphi\,d\rho\,d\varphi\,d\theta=\tfrac43\pi R^3\).</p>`}],
    quiz:[qMC(T`En coordenadas cilíndricas, el elemento de volumen es:`,[T`\(dz\,dr\,d\theta\)`,T`\(r\,dz\,dr\,d\theta\)`,T`\(r^2\,dz\,dr\,d\theta\)`,T`\(\rho^2\sin\varphi\,dz\,dr\,d\theta\)`],1,{why:T`El factor \(r\) es el jacobiano de las coordenadas polares.`})]}
  ],
  retos:[

   {id:'p2',t:'Región tipo I',q:T`Sea \(D\) la región entre \(y=x^2\) y \(y=\sqrt x\), con \(0\le x\le1\), y \(f(x,y)=xy\).`,viz:{k:'region',f:'x*y',ord:'x',a:0,b:1,lo:'x^2',hi:'sqrt(x)',xr:[-.3,1.4],yr:[-.3,1.4]},
    parts:[qMC(T`¿Qué integral iterada calcula \(\iint_Dxy\,dA\)?`,[T`\(\displaystyle\int_0^1\!\int_{x^2}^{\sqrt x}xy\,dy\,dx\)`,T`\(\displaystyle\int_0^1\!\int_{\sqrt x}^{x^2}xy\,dy\,dx\)`,T`\(\displaystyle\int_0^1\!\int_0^1xy\,dy\,dx\)`,T`\(\displaystyle\int_{x^2}^{\sqrt x}\!\int_0^1xy\,dy\,dx\)`],0,{why:T`Para cada \(x\), \(y\) va de la curva inferior \(x^2\) a la superior \(\sqrt x\); los límites externos son constantes.`}),qNum(T`El valor de la integral (3 decimales)`,1/12,{dec:3,show:T`\tfrac1{12}`,chk:()=>integ2((x,y)=>x*y,0,1,x=>x*x,x=>Math.sqrt(x))})],
    hint:T`\(\int_{x^2}^{\sqrt x}xy\,dy=x\cdot\dfrac{(\sqrt x)^2-(x^2)^2}{2}=\dfrac{x^2-x^5}{2}\).`,
    sol:T`<p>\(\int_0^1\dfrac{x^2-x^5}{2}dx=\dfrac12\left(\dfrac13-\dfrac16\right)=\dfrac1{12}\).</p>`},
   {id:'p3',t:'Cambia el orden',q:T`Calcula \(\displaystyle\int_0^1\!\int_x^1e^{y^2}\,dy\,dx\). La primitiva de \(e^{y^2}\) no es elemental: hay que cambiar el orden.`,viz:{k:'region',f:'exp(y^2)',ord:'x',a:0,b:1,lo:'x',hi:'1',xr:[-.3,1.3],yr:[-.3,1.3]},
    parts:[qMC(T`Región: \(0\le x\le y\le1\). ¿Cuál es la integral con el orden invertido?`,[T`\(\displaystyle\int_0^1\!\int_0^{y}e^{y^2}\,dx\,dy\)`,T`\(\displaystyle\int_0^1\!\int_y^{1}e^{y^2}\,dx\,dy\)`,T`\(\displaystyle\int_0^1\!\int_0^{1}e^{y^2}\,dx\,dy\)`,T`\(\displaystyle\int_0^y\!\int_0^{1}e^{y^2}\,dx\,dy\)`],0,{why:T`Para cada \(y\in[0,1]\), \(x\) va de \(0\) hasta \(y\).`}),qNum(T`El valor de la integral (3 decimales)`,(Math.E-1)/2,{dec:3,show:T`\tfrac{e-1}{2}`,chk:()=>integ2((x,y)=>Math.exp(y*y),0,1,x=>x,1)})],
    hint:T`Tras invertir: \(\int_0^1ye^{y^2}dy\). Usa \(u=y^2\).`,

   {id:'p4',t:'Coordenadas polares',q:T`Sea \(D\) el disco \(x^2+y^2\le R^2\).`,viz:{k:'region',f:'x^2+y^2',polar:{r:[0,2],th:[0,2*Math.PI]},xr:[-2.6,2.6],yr:[-2.6,2.6]},
    parts:[qNum(T`\(\displaystyle\iint_D(x^2+y^2)\,dA\) con \(R=2\) (2 decimales; \(8\pi\approx25{,}13\))`,8*Math.PI,{dec:1,show:T`8\pi`,chk:()=>2*Math.PI*integ1(r=>r*r*r,0,2)}),qNum(T`\(\displaystyle\iint_De^{-(x^2+y^2)}\,dA\) con \(R=1\) (3 decimales)`,Math.PI*(1-1/Math.E),{dec:3,show:T`\pi\left(1-e^{-1}\right)`,chk:()=>2*Math.PI*integ1(r=>Math.exp(-r*r)*r,0,1)})],
    hint:T`En polares \(x^2+y^2=r^2\) y \(dA=r\,dr\,d\theta\). (b) \(\int_0^1re^{-r^2}dr=\tfrac12(1-e^{-1})\).`,
    sol:T`<p>(a) \(\int_0^{2\pi}\!\int_0^2r^3\,dr\,d\theta=2\pi\cdot4=8\pi\). (b) \(2\pi\cdot\tfrac12(1-e^{-1})=\pi(1-e^{-1})\approx1{,}986\).</p>`},
   {id:'p5',t:'Un tetraedro',q:T`Sea \(E\) el sólido \(x,y,z\ge0,\;x+y+z\le1\).`,viz:{k:'solid',box:{xr:[0,1.1],yr:[0,1.1],zr:[0,1.1]},items:[{t:'poly',pts:[[0,0,0],[1,0,0],[0,1,0]],col:[34,230,255],alpha:.35},{t:'poly',pts:[[0,0,0],[1,0,0],[0,0,1]],col:[255,61,240],alpha:.35},{t:'poly',pts:[[0,0,0],[0,1,0],[0,0,1]],col:[61,255,160],alpha:.35},{t:'poly',pts:[[1,0,0],[0,1,0],[0,0,1]],col:[255,194,77],alpha:.45}],legend:'tetraedro'},
    parts:[qNum(T`El volumen de \(E\) (3 decimales)`,1/6,{dec:3,show:T`\tfrac16`,chk:()=>integ3(()=>1,0,1,0,x=>1-x,0,(x,y)=>1-x-y)}),qNum(T`\(\displaystyle\iiint_Ez\,dV\) (4 decimales)`,1/24,{dec:4,show:T`\tfrac1{24}`,chk:()=>integ3((x,y,z)=>z,0,1,0,x=>1-x,0,(x,y)=>1-x-y)})],
    hint:T`Límites: \(0\le x\le1\), \(0\le y\le1-x\), \(0\le z\le1-x-y\). Para \(\iiint z\), integra \(z\) primero: \(\tfrac12(1-x-y)^2\).`,
    sol:T`<p>\(V=\int_0^1\!\int_0^{1-x}(1-x-y)\,dy\,dx=\int_0^1\tfrac{(1-x)^2}{2}dx=\tfrac16\). \(\iiint z\,dV=\int_0^1\!\int_0^{1-x}\tfrac{(1-x-y)^2}{2}dy\,dx=\int_0^1\tfrac{(1-x)^3}{6}dx=\tfrac1{24}\).</p>`}
  ],
  boss:{name:'El Titán de las Sumas',glyph:'∭',story:'Un titán formado de infinitos cubitos. Solo quien sepa sumarlos con integrales podrá pasar.',phases:[
    {t:'Fase 1 · Volumen bajo un paraboloide',q:T`Halla el volumen del sólido que está bajo \(z=4-x^2-y^2\) y sobre el plano \(z=0\).`,viz:{k:'solid',box:{xr:[-2,2],yr:[-2,2],zr:[0,4]},items:[{t:'surf',f:'4-x^2-y^2',xr:[-2,2],yr:[-2,2],col:[34,230,255],alpha:.6}],legend:'paraboloide'},parts:[qNum(T`Volumen (2 decimales)`,8*Math.PI,{dec:1,show:T`8\pi`,chk:()=>2*Math.PI*integ1(r=>(4-r*r)*r,0,2)})],hint:T`Polares: \(V=\int_0^{2\pi}\!\int_0^2(4-r^2)\,r\,dr\,d\theta\).`,sol:T`<p>\(\int_0^2(4r-r^3)\,dr=8-4=4\), así que \(V=2\pi\cdot4=8\pi\approx25{,}13\).</p>`},

    {t:'Fase 3 · Media esfera',q:T`Halla el volumen de la semiesfera sólida \(x^2+y^2+z^2\le4,\;z\ge0\) con coordenadas esféricas: \(dV=\rho^2\sin\varphi\,d\rho\,d\varphi\,d\theta\), con \(0\le\rho\le2,\;0\le\varphi\le\pi/2,\;0\le\theta\le2\pi\).`,parts:[qNum(T`Volumen (2 decimales)`,16*Math.PI/3,{dec:1,show:T`\tfrac{16\pi}3`,chk:()=>2*Math.PI*integ1(p=>p*p,0,2)*integ1(f=>Math.sin(f),0,Math.PI/2)})],hint:T`Las tres integrales se separan: \(2\pi\cdot\tfrac{2^3}{3}\cdot1\).`,sol:T`<p>\(\int_0^{2\pi}d\theta=2\pi\), \(\int_0^{\pi/2}\sin\varphi\,d\varphi=1\), \(\int_0^2\rho^2d\rho=\tfrac83\). \(V=\tfrac{16\pi}{3}\approx16{,}76\).</p>`}

/* ================= MUNDO 7 · Problemas de aplicación (IA y modelos) ================= */
defWorld({
  id:'app', name:'Aplicaciones: IA y modelos', short:'Aplicaciones', glyph:'AI', hue:14,
  bg:'(x^2+3*y^2)*0.9-0.5+0.2*sin(4*x)', thumb:{k:'cont',f:'(x-3)^2+2*(y+1)^2',xr:[-2,7],yr:[-4,3]},
  sub:'Regresión, descenso del gradiente, restricciones, masa y probabilidad.',
  brief:T`<p>Todo lo anterior converge aquí: <b>ajustar un modelo</b> (mínimos cuadrados y descenso del gradiente), <b>optimizar con restricciones</b> (cajas, presupuestos, entropía) y <b>usar integrales</b> para masas, promedios y probabilidades. Es el cálculo multivariable en acción.</p>`,
  goals:['Ajustar una recta minimizando \\(E(m,b)\\)','Aplicar pasos de descenso del gradiente','Resolver problemas de optimización con Lagrange','Usar integrales dobles para masa, promedio y probabilidad'],
  ai:T`<p>Este mundo <b>es</b> IA: regresión lineal (mínimos cuadrados), descenso del gradiente (entrenamiento), entropía máxima (softmax y distribuciones uniformes) y densidades de probabilidad (normalización con integrales).</p>`,
  recipe:['Traduce el enunciado: ¿qué es la función objetivo? ¿cuáles son las variables y las restricciones?','Elige la herramienta: \\(\\nabla f=\\mathbf0\\) (sin restricción), Lagrange (con restricción), integral (acumular).','Resuelve y comprueba que la respuesta tenga sentido físico (¿positiva? ¿unidades?).','Interpreta el resultado en el contexto del problema.'],
  pitfalls:['No verificar que el punto crítico sea realmente un mínimo (o máximo).','Usar una tasa de aprendizaje demasiado grande: el descenso diverge.','Olvidar el jacobiano \\(r\\) al integrar en polares una densidad.'],
  classQ:[T`¿Qué le pasa al descenso del gradiente en \(f(w)=w^2\) si \(\eta=1{,}1\)? Calcula tres pasos desde \(w_0=1\).`,T`¿Por qué una distribución uniforme maximiza la entropía cuando solo sabemos que las probabilidades suman 1?`],
  lessons:[
   {id:'l1',t:'Descenso del gradiente',sub:'Cómo aprende una máquina',steps:[
     {h:'Una superficie de pérdida',html:T`<p>Un modelo con dos pesos \((w_1,w_2)\) tiene una pérdida \(L(w_1,w_2)\). Aquí \(L=(w_1-3)^2+2(w_2+1)^2\), con su mínimo en \((3,-1)\). El descenso del gradiente parte de \(\mathbf w_0\) y repite</p>\[\mathbf w_{k+1}=\mathbf w_k-\eta\,\nabla L(\mathbf w_k).\]<p>Pasa el cursor: la flecha es \(\nabla L\); el paso va en sentido contrario.</p>`,viz:{k:'cont',f:'(x-3)^2+2*(y+1)^2',xr:[-2,7],yr:[-4,3],marks:[[3,-1,'#3dffa0','mínimo'],[0,0,'#ffc24d','w₀']],hoverGrad:true}},
     {h:'La tasa de aprendizaje',html:T`<p>\(\eta\) decide el tamaño del paso. Con \(f(w)=w^2\) (\(f'=2w\)): \(w_{k+1}=(1-2\eta)w_k\). Si \(\eta=0{,}1\), \(w\) se multiplica por \(0{,}8\) en cada paso y converge. Si \(\eta=1{,}1\), por \(-1{,}2\): oscila y <b>diverge</b>.</p>`},
     {h:'Regresión lineal',html:T`<p>Ajustar \(y\approx mx+b\) a datos \((x_i,y_i)\) es minimizar \(E(m,b)=\sum_i\bigl(y_i-(mx_i+b)\bigr)^2\). Se puede hacer con descenso del gradiente o resolviendo \(\nabla E=\mathbf 0\).</p><div class="callout ai"><b class="t">Conexión con IA</b>Las redes neuronales hacen exactamente esto, con millones de parámetros en lugar de dos.</div>`}],
    quiz:[qNum(T`Con \(f(w)=w^2\), \(w_0=5\) y \(\eta=0{,}1\), calcula \(w_1=w_0-\eta f'(w_0)\).`,4,{dec:1,chk:()=>5-0.1*2*5})]},
   {id:'l2',t:'Optimización con restricciones',sub:'Recursos limitados',steps:[
     {h:'Presupuesto y producción',html:T`<p>Maximizar una utilidad \(U(x,y)=xy\) con un presupuesto \(x+y=10\) es un problema de Lagrange: \(\nabla U=(y,x)=\lambda(1,1)\Rightarrow x=y=5\), con \(U=25\).</p>`,viz:{k:'lagr',f:'x*y',g:'x+y',p:['t','10-t'],tr:[0,10],gtxt:'x+y=10',opt:[{t:5,label:'Óptimo (5, 5)'}],xr:[-1,11],yr:[-1,11]}},
     {h:'Diseño con material fijo',html:T`<p>Una caja abierta con área de material \(xy+2yz+2xz=12\) que maximiza el volumen \(V=xyz\): Lagrange da \(x=y=2,\;z=1,\;V=4\).</p>`},
     {h:'Entropía máxima',html:T`<p>Si solo sabes que \(p_1+p_2+p_3=1\), la distribución que maximiza la entropía \(H=-\sum p_i\ln p_i\) es la uniforme \(p_i=\tfrac13\), con \(H=\ln3\).</p><div class="callout ai"><b class="t">Conexión con IA</b>La función <i>softmax</i> y los modelos de máxima entropía nacen de este problema con restricción.</div>`}],
    quiz:[qNum(T`Maximiza \(U=xy\) sujeta a \(x+y=10\). ¿Cuánto vale \(U\) en el óptimo?`,25,{dec:0,chk:()=>Math.max(...Array.from({length:1001},(_,i)=>i*0.01*(10-i*0.01)))})]},
   {id:'l3',t:'Integrales en aplicaciones',sub:'Masa, promedio y probabilidad',steps:[
     {h:'Masa y centro de masa',html:T`<p>Una lámina con densidad \(\rho(x,y)\) sobre la región \(D\): masa \(M=\iint_D\rho\,dA\); centro de masa \(\bar x=\dfrac1M\iint_Dx\rho\,dA,\;\bar y=\dfrac1M\iint_Dy\rho\,dA\).</p>`,viz:{k:'region',f:'x+y',ord:'x',a:0,b:2,lo:'0',hi:'1',xr:[-.4,2.4],yr:[-.4,1.4]}},
     {h:'Valor promedio',html:T`<p>El valor promedio de \(f\) en \(D\) es \(f_{\text{prom}}=\dfrac{1}{\text{Área}(D)}\iint_Df\,dA\). Para \(f=x+y\) en \([0,1]^2\): \(\iint(x+y)\,dA=1\) y el área es \(1\), así que el promedio es \(1\).</p>`},
     {h:'Probabilidad',html:T`<p>Una densidad conjunta \(p(x,y)\ge0\) cumple \(\iint p\,dA=1\). La probabilidad de que \((X,Y)\) caiga en \(D\) es \(\iint_Dp\,dA\); las esperanzas son \(E[X]=\iint x\,p\,dA\).</p><div class="callout ai"><b class="t">Conexión con IA</b>Normalizar una gaussiana 2D usa \(\iint e^{-(x^2+y^2)}dA=\pi\): el truco de las coordenadas polares.</div>`}],
    quiz:[qNum(T`Valor promedio de \(f(x,y)=x+y\) en el cuadrado \([0,1]\times[0,1]\).`,1,{dec:1,chk:()=>integ2((x,y)=>x+y,0,1,0,1)})]}
  ],
  retos:[
   {id:'p1',t:'Recta de mínimos cuadrados',q:T`Ajusta \(y=mx+b\) a los puntos \((0,1),\,(1,2),\,(2,4)\) minimizando \(E(m,b)=\sum_i\bigl(y_i-(mx_i+b)\bigr)^2\). En el mapa, \(x=m\) y \(y=b\).`,viz:{k:'cont',f:'(1-y)^2+(2-x-y)^2+(4-2*x-y)^2',xr:[-1,3],yr:[-1,3]},
    parts:[qNum(T`La pendiente óptima \(m\)`,1.5,{dec:2,chk:()=>{const E=(m,b)=>[[0,1],[1,2],[2,4]].reduce((s,q)=>s+(q[1]-(m*q[0]+b))**2,0); const g=gradN(E,[1.5,5/6]); return Math.hypot(g[0],g[1])<1e-6?1.5:NaN;}}),qNum(T`La ordenada al origen \(b\) (2 decimales)`,5/6,{dec:2,show:T`\tfrac56`,chk:()=>{const E=(m,b)=>[[0,1],[1,2],[2,4]].reduce((s,q)=>s+(q[1]-(m*q[0]+b))**2,0); const g=gradN(E,[1.5,5/6]); return Math.hypot(g[0],g[1])<1e-6?5/6:NaN;}}),qNum(T`El error mínimo \(E(m,b)\) (3 decimales)`,1/6,{dec:3,show:T`\tfrac16`,chk:()=>[[0,1],[1,2],[2,4]].reduce((s,q)=>s+(q[1]-(1.5*q[0]+5/6))**2,0)})],
    hint:T`\(\partial E/\partial m=0\) y \(\partial E/\partial b=0\) dan \(5m+3b=10\) y \(3m+3b=7\).`,
    sol:T`<p>Restando: \(2m=3\Rightarrow m=1{,}5\). Entonces \(3b=7-4{,}5\Rightarrow b=\tfrac56\). Residuos: \(\tfrac16,-\tfrac13,\tfrac16\): \(E=\tfrac1{36}+\tfrac19+\tfrac1{36}=\tfrac16\).</p>`},
   {id:'p2',t:'Dos pasos de descenso',q:T`Pérdida \(L(w_1,w_2)=(w_1-3)^2+2(w_2+1)^2\), inicio \(\mathbf w_0=(0,0)\) y tasa \(\eta=0{,}2\).`,viz:{k:'cont',f:'(x-3)^2+2*(y+1)^2',xr:[-2,7],yr:[-4,3],marks:[[3,-1,'#3dffa0','mínimo'],[0,0,'#ffc24d','w₀']]},
    parts:[qVec(T`\(\mathbf w_1=\mathbf w_0-\eta\nabla L(\mathbf w_0)\)`,[1.2,-0.8],[],{tol:0.01,chk:()=>{const g=gradN(F2('(x-3)^2+2*(y+1)^2'),[0,0]); return [-.2*g[0],-.2*g[1]];}}),qVec(T`\(\mathbf w_2\)`,[1.92,-0.96],[],{tol:0.01,chk:()=>{const f=F2('(x-3)^2+2*(y+1)^2'); const g0=gradN(f,[0,0]), w1=[-.2*g0[0],-.2*g0[1]], g1=gradN(f,w1); return [w1[0]-.2*g1[0],w1[1]-.2*g1[1]];}}),qNum(T`\(L(\mathbf w_2)\) (4 decimales)`,1.1696,{dec:3,chk:()=>F2('(x-3)^2+2*(y+1)^2')(1.92,-0.96)})],
    hint:T`\(\nabla L=\bigl(2(w_1-3),\,4(w_2+1)\bigr)\). En \(\mathbf w_0\): \((-6,4)\). Luego \(\mathbf w_1=(0+1{,}2,\;0-0{,}8)\).`,
    sol:T`<p>\(\mathbf w_1=(1{,}2;-0{,}8)\). \(\nabla L(\mathbf w_1)=(-3{,}6;\,0{,}8)\Rightarrow\mathbf w_2=(1{,}92;-0{,}96)\). \(L(\mathbf w_2)=1{,}1664+0{,}0032=1{,}1696\) (antes \(11\)).</p>`},
   {id:'p3',t:'Caja de volumen máximo',q:T`Una caja sin tapa (abierta arriba) tiene dimensiones \(x,y,z\) y se dispone de \(12\ \text{m}^2\) de material: \(xy+2yz+2xz=12\). Maximiza \(V=xyz\).`,
    parts:[qPts(T`Las dimensiones óptimas <code>(x, y, z)</code>`,[[2,2,1]],{chk:(q)=>Math.abs(q[0]*q[1]+2*q[1]*q[2]+2*q[0]*q[2]-12)<1e-9&&Math.abs(q[0]-q[1])<1e-9&&Math.abs(q[2]-q[0]/2)<1e-9}),qNum(T`El volumen máximo en \(\text{m}^3\)`,4,{dec:1,chk:()=>{let best=0; for(let x=0.05;x<3.4;x+=0.01)for(let y=0.05;y<3.4;y+=0.01){ const z=(12-x*y)/(2*(x+y)); if(z>0) best=Math.max(best,x*y*z);} return best;}})],
    hint:T`Por simetría \(x=y\). De \(\nabla V=\lambda\nabla g\): \(yz=\lambda(y+2z)\) y \(xy=\lambda(2x+2y)\). Eso da \(z=x/2\).`,
    sol:T`<p>\(x=y\), \(z=x/2\). El material: \(x^2+2x\cdot\tfrac x2\cdot2=3x^2=12\Rightarrow x=2\). Dimensiones \((2,2,1)\), \(V=4\ \text{m}^3\).</p>`},
   {id:'p4',t:'Masa y centro de masa',q:T`Una lámina ocupa \(D=[0,2]\times[0,1]\) con densidad \(\rho(x,y)=x+y\).`,viz:{k:'region',f:'x+y',ord:'x',a:0,b:2,lo:'0',hi:'1',xr:[-.4,2.4],yr:[-.4,1.4]},

/* ---- 04i-exam-bank.js ---- */
/* ================= NABLA · Banco de 20 problemas nuevos por mundo (solo para Simulacro de parcial) =================
   Estos problemas NO aparecen en las lecciones ni en los 5 retos normales de cada mundo: existen únicamente
   para que el Simulacro de parcial tenga preguntas que el estudiante no haya visto ya practicando el mundo.
   Cada valor numérico se calcula con las mismas funciones de verificación que usa el resto del juego
   (F2/F3, dfx/dfy, gradN, hess2, integ1/integ2/integ3), así que `v`/`comps`/`pts` y `chk` son, por construcción,
   el mismo cálculo — no hay margen para un error de álgebra al escribir el banco a mano. */
const pt=c=>c===0?'':(c>0?'+'+c:''+c);                                  // término constante opcional con signo
const diffTerm=(v,name)=>v===0?name:(v>0?name+'-'+v:name+'+'+(-v));     // "x-p" con p que puede ser negativo
const rnd6=v=>{ const r=Math.round(v*1e6)/1e6; return r===0?0:r; };     // corta el ruido de punto flotante de dfx/dfy/gradN (evita p.ej. 7e-11 en vez de 0)

/* ---------- Mundo 1 · fun: funciones de varias variables (paraboloides y sillas) ---------- */
function bankFun(){
  const PP=[2,-1,3,-2,1,-3,2,-1,3,1], QQ=[1,2,-1,3,-2,1,-1,2,-3,2];
  const out=[];
  for(let i=0;i<20;i++){
    const sub=Math.floor(i/2), up=i%2===0;
    const A=1+(sub%3), B=1+((sub+1)%3), C=(sub%5)-2;
    const p=PP[sub], q=QQ[sub];
    const e=up?(A+'*x^2+'+B+'*y^2'+pt(C)):(A+'*x^2-'+B+'*y^2'+pt(C));
    const tex=up?(A+'x^2+'+B+'y^2'+pt(C)):(A+'x^2-'+B+'y^2'+pt(C));
    const f=F2(e), val=f(p,q), trv=f(0,p);
    out.push({id:'e'+(i+1), t:(up?'Paraboloide elíptico':'Silla')+' · extra '+(sub+1),
      q:T`Sea \(f(x,y)=${tex}\).`,
      parts:[
        qNum(T`\(f(${p},${q})\)`,val,{dec:1,chk:()=>F2(e)(p,q)}),
        qMC(T`La traza de \(f\) en el plano \(x=0\) es una parábola (en el plano \(yz\)) que…`,
          [T`abre hacia arriba`,T`abre hacia abajo`,T`no es una parábola`,T`es una línea recta`],up?0:1,
          {why:up?T`En \(x=0\): \(z=${B}y^2${pt(C)}\), coeficiente positivo en \(y^2\): abre hacia arriba.`
                :T`En \(x=0\): \(z=-${B}y^2${pt(C)}\), coeficiente negativo en \(y^2\): abre hacia abajo.`}),
        qNum(T`El valor de esa traza en \(y=${p}\)`,trv,{dec:1,chk:()=>F2(e)(0,p)})
      ],
      hint:T`Sustituye directamente los valores en \(f\). Para la traza en \(x=0\), reemplaza \(x=0\) y mira el signo del coeficiente de \(y^2\).`,
      sol:T`<p>\(f(${p},${q})=${A}\cdot${p}^2${up?'+':'-'}${B}\cdot${q}^2${pt(C)}\). La traza en \(x=0\) es \(z=${up?'':'-'}${B}y^2${pt(C)}\), que ${up?'abre hacia arriba':'abre hacia abajo'}; en \(y=${p}\) vale ${trv.toFixed(1)}.</p>`});
  }
  return out;
}

/* ---------- Mundo 2 · niv: dominio y curvas de nivel ---------- */
function bankNiv(){
  const out=[]; const Rs=[4,9,16,25,36];
  for(let i=0;i<5;i++){ // A: dominio de un disco
    const R=Rs[i], L=[1,2,1,2,3][i], rad=Math.sqrt(R-L*L);
    out.push({id:'e'+(i+1), t:'Dominio de un disco · extra '+(i+1),
      q:T`Sea \(f(x,y)=\sqrt{${R}-x^2-y^2}\).`,
      parts:[
        qMC(T`El dominio natural de \(f\) es:`,[T`\(x^2+y^2\le ${R}\)`,T`\(x^2+y^2\ge ${R}\)`,T`\(x^2+y^2< ${R}\)`,T`\(x^2+y^2\le ${R*R}\)`],0,{why:T`Necesitamos \(${R}-x^2-y^2\ge0\).`}),
        qNum(T`La curva de nivel \(f=${L}\) es una circunferencia. ¿Cuál es su radio?`,rad,{dec:2,chk:()=>Math.sqrt(R-L*L)})
      ],
      hint:T`Bajo la raíz debe quedar \(\ge0\). Para el radio: \(${R}-x^2-y^2=${L}^2\Rightarrow x^2+y^2=${R}-${L*L}\).`,
      sol:T`<p>Dominio: \(x^2+y^2\le${R}\). Con \(f=${L}\): \(x^2+y^2=${R-L*L}\Rightarrow r=\sqrt{${R-L*L}}\approx${rad.toFixed(2)}\).</p>`});
  }
  for(let i=0;i<5;i++){ // B: dominio del exterior de un disco (logaritmo)
    const R=Rs[i], p=Math.ceil(Math.sqrt(R))+2, q=0, e='ln(x^2+y^2-'+R+')', val=F2(e)(p,q);
    out.push({id:'e'+(5+i+1), t:'Dominio exterior · extra '+(i+1),
      q:T`Sea \(g(x,y)=\ln\!\left(x^2+y^2-${R}\right)\).`,
      parts:[
        qMC(T`El dominio natural de \(g\) es:`,[T`\(x^2+y^2>${R}\)`,T`\(x^2+y^2\ge${R}\)`,T`\(x^2+y^2<${R}\)`,T`\(x\ne y\)`],0,{why:T`El logaritmo exige que el argumento sea \(>0\).`}),
        qNum(T`\(g(${p},${q})\)`,val,{dec:2,chk:()=>F2(e)(p,q)})
      ],
      hint:T`El argumento del logaritmo debe ser estrictamente positivo: \(x^2+y^2>${R}\).`,
      sol:T`<p>Dominio: \(x^2+y^2>${R}\). \(g(${p},${q})=\ln(${p*p+q*q}-${R})=\ln(${p*p+q*q-R})\approx${val.toFixed(2)}\).</p>`});
  }
  const P=[['x^2+y^2','x^2+y^2','circunferencias'],['3*x-2*y','3x-2y','rectas'],['x*y','xy','hipérbolas'],['x^2-y','x^2-y','parábolas'],['4*x^2+y^2','4x^2+y^2','elipses']];
  const PPp=[2,-1,3,-2,1], QQq=[1,2,-1,1,-2];
  for(let i=0;i<5;i++){ // C: forma de las curvas de nivel
    const t=P[i], p=PPp[i], q=QQq[i], f=F2(t[0]), val=f(p,q);
    const others=shuffle(P.filter((_,j)=>j!==i)).slice(0,3).map(x=>x[2]);
    const opts=shuffle([t[2],...others]);
    out.push({id:'e'+(10+i+1), t:'Curvas de nivel · extra '+(i+1),
      q:T`Sea \(f(x,y)=${t[1]}\).`,
      parts:[
        qMC(T`Las curvas de nivel de \(f\) son, en general…`,opts.map(o=>T`${o}`),opts.indexOf(t[2]),{why:T`Compara \(f(x,y)=c\) con las cónicas conocidas.`}),
        qNum(T`\(f(${p},${q})\)`,val,{dec:1,chk:()=>F2(t[0])(p,q)})
      ],
      hint:T`Iguala \(f(x,y)=c\) y reconoce la curva.`,
      sol:T`<p>Las curvas de nivel son ${t[2]}. \(f(${p},${q})=${val.toFixed(1)}\).</p>`});
  }
  const forms=[
    {e:'1/(x-y)',tex:'\\dfrac{1}{x-y}',dom:'x\\ne y',bad:['x>y','x=y','x\\ne0'],pt:i=>[i+2,i]},
    {e:'sqrt(y-x^2)',tex:'\\sqrt{y-x^2}',dom:'y\\ge x^2',bad:['y\\le x^2','y> x^2','y\\ge x'],pt:i=>[1,1+i]},
    {e:'sqrt(x-y)',tex:'\\sqrt{x-y}',dom:'x\\ge y',bad:['x\\le y','x> y','y\\ge x'],pt:i=>[3+i,1]}
  ];
  for(let i=0;i<5;i++){ // D: otros dominios
    const fm=forms[i%3], [p,q]=fm.pt(i), f=F2(fm.e), val=f(p,q);
    const opts=shuffle([fm.dom,...fm.bad]);
    out.push({id:'e'+(15+i+1), t:'Dominio · extra '+(i+1),
      q:T`Sea \(h(x,y)=${fm.tex}\).`,
      parts:[
        qMC(T`El dominio natural de \(h\) es:`,opts.map(o=>T`\(${o}\)`),opts.indexOf(fm.dom),{why:T`Revisa qué operación (raíz o división) restringe el dominio.`}),
        qNum(T`\(h(${p},${q})\)`,val,{dec:2,chk:()=>F2(fm.e)(p,q)})
      ],
      hint:T`Identifica qué operación (raíz cuadrada, división) impone la restricción.`,
      sol:T`<p>Dominio: \(${fm.dom}\). \(h(${p},${q})\approx${val.toFixed(2)}\).</p>`});
  }
  return out;
}

/* ---------- Mundo 3 · par: derivadas parciales ---------- */
function bankPar(){
  const forms=[
    {e:'x^2*y+3*y',tex:'x^2y+3y'},
    {e:'x^3*y^2-2*x*y',tex:'x^3y^2-2xy'},
    {e:'x*exp(y)',tex:'xe^{y}'},
    {e:'sin(x*y)+x^2',tex:'\\sin(xy)+x^2'}
  ];
  const PP=[1,2,-1,3,-2], QQ=[2,-1,3,1,-3];
  const out=[];
  for(let i=0;i<20;i++){
    const form=forms[i%4], sub=Math.floor(i/4), p=PP[sub], q=QQ[sub];
    const f=F2(form.e), val=rnd6(f(p,q)), gx=rnd6(dfx(f,p,q)), gy=rnd6(dfy(f,p,q));
    out.push({id:'e'+(i+1), t:'Parciales · extra '+(i+1),
      q:T`Sea \(f(x,y)=${form.tex}\) y el punto \((${p},${q})\).`,
      parts:[
        qNum(T`\(f(${p},${q})\)`,val,{dec:2,chk:()=>F2(form.e)(p,q)}),
        qNum(T`\(f_x(${p},${q})\)`,gx,{dec:2,chk:()=>dfx(F2(form.e),p,q)}),
        qNum(T`\(f_y(${p},${q})\)`,gy,{dec:2,chk:()=>dfy(F2(form.e),p,q)})
      ],
      hint:T`Deriva respecto a una variable tratando la otra como constante; luego evalúa en el punto.`,
      sol:T`<p>\(f_x(${p},${q})\approx${gx.toFixed(2)}\), \(f_y(${p},${q})\approx${gy.toFixed(2)}\) (derivando con las reglas usuales y evaluando).</p>`});
  }
  return out;
}

/* ---------- Mundo 4 · gra: gradiente y derivada direccional ---------- */
function bankGra(){
  const triples=[[3,4,5],[5,12,13],[6,8,10],[8,15,17],[7,24,25]];
  const AA=[1,2,3,4],BB=[2,3,4,1],PP=[1,2,-1,3],QQ=[2,-1,3,1];
  const out=[];
  for(let i=0;i<20;i++){
    const sub=i%5, variant=Math.floor(i/5), tr=triples[sub];
    const A=AA[variant],B=BB[variant],p=PP[variant],q=QQ[variant];
    const ux=tr[0]/tr[2], uy=tr[1]/tr[2];
    const e=A+'*x^2+'+B+'*y^2', f=F2(e), g=gradN(f,[p,q]), gx=rnd6(g[0]),gy=rnd6(g[1]);
    const norm=rnd6(Math.sqrt(gx*gx+gy*gy)), dir=rnd6(gx*ux+gy*uy);
    out.push({id:'e'+(i+1), t:'Gradiente · extra '+(i+1),
      q:T`Sea \(f(x,y)=${A}x^2+${B}y^2\), el punto \(P(${p},${q})\) y \(\mathbf u=\left(\tfrac{${tr[0]}}{${tr[2]}},\tfrac{${tr[1]}}{${tr[2]}}\right)\).`,
      parts:[
        qVec(T`\(\nabla f(${p},${q})\)`,[gx,gy],['x','y'],{chk:()=>gradN(F2(e),[p,q])}),
        qNum(T`\(\|\nabla f(${p},${q})\|\)`,norm,{dec:2,chk:()=>{const gg=gradN(F2(e),[p,q]);return Math.sqrt(gg[0]*gg[0]+gg[1]*gg[1]);}}),
        qNum(T`\(D_{\mathbf u}f(${p},${q})=\nabla f\cdot\mathbf u\)`,dir,{dec:2,chk:()=>{const gg=gradN(F2(e),[p,q]);return gg[0]*ux+gg[1]*uy;}})
      ],
      hint:T`\(\nabla f=(2${A}x,\,2${B}y)\). La derivada direccional es \(\nabla f\cdot\mathbf u\) (con \(\mathbf u\) unitario).`,
      sol:T`<p>\(\nabla f(${p},${q})\approx(${gx.toFixed(2)},${gy.toFixed(2)})\), \(\|\nabla f\|\approx${norm.toFixed(2)}\), \(D_{\mathbf u}f\approx${dir.toFixed(2)}\).</p>`});
  }
  return out;
}

/* ---------- Mundo 5 · ext: extremos y multiplicadores de Lagrange ---------- */
function bankExt(){
  const out=[];
  const PP=[1,-2,3,0,-1,2,-3,1,-2,3], QQ=[-1,2,0,3,-2,1,2,-3,1,-1];
  const CASE=['mínimo local','máximo local','punto silla','no es punto crítico'];
  for(let i=0;i<10;i++){ // A: crítico y clasificación
    const kase=i%3, p=PP[i], q=QQ[i], K=(i%5)-2;
    const xt=diffTerm(p,'x'), yt=diffTerm(q,'y');
    const e=kase===0?`(${xt})^2+(${yt})^2${pt(K)}`:kase===1?`-(${xt})^2-(${yt})^2${pt(K)}`:`(${xt})^2-(${yt})^2${pt(K)}`;
    const f=F2(e), val=f(p,q);
    out.push({id:'e'+(i+1), t:'Extremos · extra '+(i+1),
      q:T`Sea \(f(x,y)=${e}\).`,
      parts:[
        qPts(T`El punto crítico <code>(a, b)</code>`,[[p,q]],{chk:(qq)=>gradN(F2(e),qq).every(g=>Math.abs(g)<1e-4)}),
        qMC(T`En ese punto, \(f\) tiene un…`,CASE.map(c=>T`${c}`),kase,{why:T`Mira los signos de los coeficientes de \((x-${p})^2\) y \((y-${q})^2\).`}),
        qNum(T`El valor de \(f\) en ese punto`,val,{dec:0,chk:()=>F2(e)(p,q)})
      ],
      hint:T`\(\nabla f=0\) da el punto crítico. El signo de cada término al cuadrado dice si es mínimo, máximo o silla.`,
      sol:T`<p>Punto crítico: \((${p},${q})\). Es un ${CASE[kase]}, con \(f(${p},${q})=${K}\).</p>`});
  }
  const Ss=[4,6,8,10,12];
  for(let i=0;i<10;i++){ // B: Lagrange con restricción lineal
    const sub=Math.floor(i/2), form=i%2, S=Ss[sub], m=S/2;
    if(form===0){
      out.push({id:'e'+(10+i+1), t:'Lagrange · extra '+(i+1),
        q:T`Maximiza \(P(x,y)=xy\) sujeta a \(x+y=${S}\), con \(x,y\ge0\).`,
        parts:[
          qPts(T`El punto óptimo <code>(a, b)</code>`,[[m,m]],{chk:(qq)=>Math.abs(qq[0]+qq[1]-S)<1e-9&&Math.abs(qq[0]-qq[1])<1e-9}),
          qNum(T`El valor máximo de \(P\)`,m*m,{dec:0,chk:()=>m*m})
        ],
        hint:T`\((y,x)=\lambda(1,1)\Rightarrow x=y\). Con \(x+y=${S}\): \(x=y=${m}\).`,
        sol:T`<p>Óptimo en \((${m},${m})\), con \(P=${m}\cdot${m}=${m*m}\).</p>`});
    }else{
      out.push({id:'e'+(10+i+1), t:'Lagrange · extra '+(i+1),
        q:T`Minimiza \(f(x,y)=x^2+y^2\) sujeta a \(x+y=${S}\).`,
        parts:[
          qPts(T`El punto óptimo <code>(a, b)</code>`,[[m,m]],{chk:(qq)=>Math.abs(qq[0]+qq[1]-S)<1e-9&&Math.abs(qq[0]-qq[1])<1e-9}),
          qNum(T`El valor mínimo de \(f\)`,2*m*m,{dec:0,chk:()=>2*m*m})
        ],
        hint:T`\((2x,2y)=\lambda(1,1)\Rightarrow x=y\). Con \(x+y=${S}\): \(x=y=${m}\).`,
        sol:T`<p>Óptimo en \((${m},${m})\), con \(f=${m}^2+${m}^2=${2*m*m}\).</p>`});
    }
  }
  return out;
}

/* ---------- Mundo 6 · int: integrales dobles y triples ---------- */
function bankInt(){
  const out=[];
  const Aa=[2,3,1,4,2,3],Bb=[1,2,3,1,4,2],Cc=[0,1,-1,2,0,1];
  for(let i=0;i<6;i++){ // A: rectángulo
    const a=Aa[i],b=Bb[i],c=Cc[i];
    const area=a*b, val=integ2((x,y)=>x*y+c,0,a,0,b);
    out.push({id:'e'+(i+1), t:'Integral en rectángulo · extra '+(i+1),
      q:T`Sea \(R=[0,${a}]\times[0,${b}]\).`,
      parts:[
        qNum(T`El área de \(R\)`,area,{dec:0,chk:()=>a*b}),
        qNum(T`\(\displaystyle\iint_R(xy${pt(c)})\,dA\)`,val,{dec:2,chk:()=>integ2((x,y)=>x*y+c,0,a,0,b)})
      ],
      hint:T`Fubini: integra primero en \(y\) (tratando \(x\) constante) y luego en \(x\).`,
      sol:T`<p>Área \(=${a}\times${b}=${area}\). \(\displaystyle\int_0^{${a}}\!\int_0^{${b}}(xy${pt(c)})\,dy\,dx\approx${val.toFixed(2)}\).</p>`});
  }
  const Rr=[1,2,3,4,2];
  for(let i=0;i<5;i++){ // B: polares sobre un disco
    const R=Rr[i], area=2*Math.PI*integ1(r=>r,0,R), val=2*Math.PI*integ1(r=>r*r*r,0,R);
    out.push({id:'e'+(6+i+1), t:'Polares sobre un disco · extra '+(i+1),
      q:T`Sea \(D\) el disco \(x^2+y^2\le ${R*R}\).`,
      parts:[
        qNum(T`El área de \(D\) (2 decimales)`,area,{dec:2,chk:()=>2*Math.PI*integ1(r=>r,0,R)}),
        qNum(T`\(\displaystyle\iint_D(x^2+y^2)\,dA\) (2 decimales)`,val,{dec:2,chk:()=>2*Math.PI*integ1(r=>r*r*r,0,R)})
      ],
      hint:T`En polares, \(dA=r\,dr\,d\theta\) y \(x^2+y^2=r^2\). El radio del disco es \(${R}\).`,
      sol:T`<p>Área \(=\pi\cdot${R}^2\approx${area.toFixed(2)}\). \(\displaystyle\int_0^{2\pi}\!\int_0^{${R}}r^2\cdot r\,dr\,d\theta\approx${val.toFixed(2)}\).</p>`});
  }
  const Ac=[1,2,1,3,2],Bc=[2,1,3,1,2],Cc2=[1,3,2,2,1];
  for(let i=0;i<5;i++){ // C: triple sobre una caja
    const a=Ac[i],b=Bc[i],c=Cc2[i];
    const vol=a*b*c, val=integ3((x,y,z)=>x+y+z,0,a,0,b,0,c);
    out.push({id:'e'+(11+i+1), t:'Integral triple en caja · extra '+(i+1),
      q:T`Sea \(E=[0,${a}]\times[0,${b}]\times[0,${c}]\).`,
      parts:[
        qNum(T`El volumen de \(E\)`,vol,{dec:0,chk:()=>a*b*c}),
        qNum(T`\(\displaystyle\iiint_E(x+y+z)\,dV\) (2 decimales)`,val,{dec:2,chk:()=>integ3((x,y,z)=>x+y+z,0,a,0,b,0,c)})
      ],
      hint:T`Integra una variable a la vez, tratando las otras como constantes.`,
      sol:T`<p>Volumen \(=${a}\times${b}\times${c}=${vol}\). \(\displaystyle\iiint_E(x+y+z)\,dV\approx${val.toFixed(2)}\).</p>`});
  }
  const Ad=[3,6,2,4],Bd=[2,3,6,2],Cd=[1,2,3,6];
  for(let i=0;i<4;i++){ // D: sólido tipo tetraedro escalado
    const a=Ad[i],b=Bd[i],c=Cd[i];
    const val=integ3(()=>1,0,a,0,x=>b*(1-x/a),0,(x,y)=>c*(1-x/a-y/b));
    out.push({id:'e'+(16+i+1), t:'Sólido tipo tetraedro · extra '+(i+1),
      q:T`Sea \(E\) el sólido \(x,y,z\ge0,\ \dfrac{x}{${a}}+\dfrac{y}{${b}}+\dfrac{z}{${c}}\le1\).`,
      parts:[
        qNum(T`El volumen de \(E\) (2 decimales)`,val,{dec:2,chk:()=>integ3(()=>1,0,a,0,x=>b*(1-x/a),0,(x,y)=>c*(1-x/a-y/b))})
      ],
      hint:T`Es un tetraedro con catetos \(${a},${b},${c}\) sobre los ejes: su volumen es \(\dfrac{${a}\cdot${b}\cdot${c}}{6}\).`,
      sol:T`<p>\(V=\dfrac{${a}\cdot${b}\cdot${c}}{6}\approx${val.toFixed(2)}\).</p>`});
  }
  return out;
}

/* ---------- Mundo 7 · app: aplicaciones a la IA / ML ---------- */
function bankApp(){
  const out=[];
  const AA=[1,2,3,1,2,3,1,2,3,1],BB=[2,1,2,3,1,2,3,1,2,3],PP=[2,-1,3,-2,1,2,-1,3,-2,1],QQ=[1,2,-1,3,-2,1,-1,2,-3,2];
  for(let i=0;i<10;i++){ // A: un paso de descenso de gradiente sobre una pérdida cuadrática
    const A=AA[i],B=BB[i],p=PP[i],q=QQ[i], eta=0.1;
    const e=A+'*x^2+'+B+'*y^2', gg0=gradN(F2(e),[p,q]), g=[rnd6(gg0[0]),rnd6(gg0[1])];
    const nx=rnd6(p-eta*g[0]), ny=rnd6(q-eta*g[1]);
    out.push({id:'e'+(i+1), t:'Descenso de gradiente · extra '+(i+1),
      q:T`La pérdida es \(L(w_1,w_2)=${A}w_1^2+${B}w_2^2\). Estás en \(w=(${p},${q})\) con tasa de aprendizaje \(\eta=0{,}1\).`,
      parts:[
        qVec(T`\(\nabla L(${p},${q})\)`,[g[0],g[1]],['x','y'],{chk:()=>gradN(F2(e),[p,q])}),
        qPts(T`El nuevo punto tras un paso: \(w'=w-\eta\nabla L(w)\)`,[[nx,ny]],{tol:0.02,chk:(qq)=>{const gg=gradN(F2(e),[p,q]);return Math.abs(qq[0]-(p-0.1*gg[0]))<0.02&&Math.abs(qq[1]-(q-0.1*gg[1]))<0.02;}})
      ],
      hint:T`\(\nabla L=(2${A}w_1,\,2${B}w_2)\). Luego \(w'=w-\eta\nabla L(w)\), componente a componente.`,
      sol:T`<p>\(\nabla L(${p},${q})\approx(${g[0].toFixed(2)},${g[1].toFixed(2)})\). \(w'\approx(${nx.toFixed(2)},${ny.toFixed(2)})\).</p>`});
  }
  const T1=[1,-1,2,0,-2,1,3,-1,0,2],T2=[0,2,-1,1,1,-2,0,3,-1,1];
  const PP2=[3,-3,4,2,-1,3,5,-3,2,4],QQ2=[2,4,-2,-1,3,0,-3,5,3,-2];
  for(let i=0;i<10;i++){ // B: evaluar una pérdida cuadrática y su gradiente
    const t1=T1[i],t2=T2[i],p=PP2[i],q=QQ2[i];
    const e=`(x-${t1})^2+(y-${t2})^2`, f=F2(e), val=rnd6(f(p,q)), gg0=gradN(f,[p,q]), g=[rnd6(gg0[0]),rnd6(gg0[1])];
    out.push({id:'e'+(10+i+1), t:'Error cuadrático · extra '+(i+1),
      q:T`La pérdida es \(L(w_1,w_2)=(w_1-${t1})^2+(w_2-${t2})^2\) (el objetivo es \((${t1},${t2})\)). Evalúa en \(w=(${p},${q})\).`,
      parts:[
        qNum(T`\(L(${p},${q})\)`,val,{dec:1,chk:()=>F2(e)(p,q)}),
        qVec(T`\(\nabla L(${p},${q})\)`,[g[0],g[1]],['x','y'],{chk:()=>gradN(F2(e),[p,q])})
      ],
      hint:T`\(L\) es una suma de cuadrados: \(\nabla L=(2(w_1-${t1}),\,2(w_2-${t2}))\).`,
      sol:T`<p>\(L(${p},${q})=(${p}-${t1})^2+(${q}-${t2})^2=${val.toFixed(1)}\). \(\nabla L\approx(${g[0].toFixed(2)},${g[1].toFixed(2)})\).</p>`});
  }
  return out;
}
