/* ================= NABLA · Proyecto final: descenso de gradiente en superficies de pérdida ================= */
/* Rango vertical de una superficie por muestreo directo (no depende del motor de gráficas, para poder
   probarse en Node sin DOM/canvas). */
function mlZr(f,xr,yr){
  const F=F2(f); let lo=1e18,hi=-1e18,n=30;
  for(let j=0;j<=n;j++){ const y=yr[0]+(yr[1]-yr[0])*j/n; for(let i=0;i<=n;i++){ const x=xr[0]+(xr[1]-xr[0])*i/n, v=F(x,y); if(isFinite(v)){ if(v<lo) lo=v; if(v>hi) hi=v; } } }
  if(hi<lo){ lo=0; hi=1; } else if(hi-lo<1e-9){ lo-=1; hi+=1; }
  const pad=Math.max(.15,(hi-lo)*.08); return [lo-pad,hi+pad];
}

/* Un paso de descenso de gradiente sobre la superficie s, desde pos=[x,y] con tasa lr */
function mlStep(s,pos,lr){
  const g=grad2(s.F,pos[0],pos[1]);
  return {pos:[pos[0]-lr*g[0],pos[1]-lr*g[1]],g};
}
const mlDiverged=pos=>!isFinite(pos[0])||!isFinite(pos[1])||Math.abs(pos[0])>60||Math.abs(pos[1])>60;

/* ---------- XP y métricas ---------- */
function xpOfSolved(k,r){ const boss=k==='b'; return r.r?(boss?XP.bossRev:XP.retRev):(boss?XP.boss+XP.bossStar*r.s:XP.ret+XP.retStar*r.s); }

const achById={}; ACH.forEach(a=>{ achById[a.id]=a; });
function computeAch(g){ const bak=G; G=g; try{ let again=true; while(again){ again=false; const m=metrics(G); for(const a of ACH){ if(G.ach[a.id]) continue; const p=a.prog(m); if(p[0]>=p[1]){ G.ach[a.id]=1; again=true; } } } } finally{ G=bak; } }

/* ---------- Progreso ---------- */
const solvedCount=w=>{ let n=0; for(let i=1;i<=5;i++) if(G.solved[w.id+'.p'+i]) n++; return n; };
function unlocked(idx){
  if(isClass()||idx<=0) return true;
  const prev=WORLDS[idx-1]; return solvedCount(prev)>=3||!!G.solved[prev.id+'.b'];
}
const bossUnlocked=w=>isClass()||solvedCount(w)>=3;
const worldStars=w=>{ let s=0; EXK.forEach(k=>{ const r=G.solved[w.id+'.'+k]; if(r&&!r.r) s+=r.s; }); return s; };
const worldLessons=w=>['l1','l2','l3'].filter(k=>G.les[w.id+'.'+k]).length;
function snap(){ const xp=xpFor(G); return {xp,rank:rankOf(xp).i,ach:Object.assign({},G.ach)}; }
/* Compara con un estado anterior y devuelve los eventos para la interfaz */
function settle(before){
  const evs=[]; computeAch(G);
  Object.keys(G.ach).forEach(id=>{ if(!before.ach[id]&&achById[id]) evs.push({t:'ach',a:achById[id]}); });
  const now=snap(); if(now.rank>before.rank) evs.push({t:'rank',from:before.rank,to:now.rank,rank:RANKS[now.rank-1]});
  evs.push({t:'hud',dxp:now.xp-before.xp}); saveGame(); return evs;
}
const calcStars=o=>o.rev?1:Math.max(1,3-(o.hint?1:0)-(o.att>0?1:0));
/* ---------- Repaso espaciado: última vez que se practicó cada mundo ---------- */
const REVIEW_DAYS=4;
function touchWorld(wid){ if(isClass()||!wid) return; G.last=G.last||{}; G.last[wid]=Date.now(); saveGame(); }
function spacedReview(){
  if(isClass()) return [];
  const now=Date.now(), out=[];
  WORLDS.forEach((w,i)=>{
    if(!unlocked(i)) return;
    const has=worldStars(w)>0||worldLessons(w)>0||!!G.solved[w.id+'.b'];
    if(!has) return;
    const last=(G.last||{})[w.id]; if(!last) return;
    const days=(now-last)/864e5;
    if(days>=REVIEW_DAYS) out.push({w,days});
  });
  out.sort((a,b)=>b.days-a.days);
  return out;
}
function dismissReminder(){ if(isClass()) return; G.remindDismiss=Date.now()+864e5; saveGame(); }
function recordSolve(w,k,o){
  const key=exKey(w,k), before=snap(), prev=G.solved[key], s=calcStars(o), evs0=[];
  let rec;
  if(o.rev){ if(!prev) rec={s:1,r:1}; else rec=prev; }
  else rec=(!prev||prev.r||s>prev.s)?{s,r:0}:prev;
  const first=!prev; if(!isClass()) G.solved[key]=rec;
  if(!isClass()){
    if(!o.rev){ if(first){ G.streak++; G.best=Math.max(G.best,G.streak); } }
    else G.streak=0;
    touchWorld(w.id);
  }
  const evs=isClass()?[]:settle(before);
  return {stars:o.rev?0:s,rec,first,xp:isClass()?0:xpFor(G)-before.xp,evs,demo:isClass()};
}
function completeLesson(w,k){
  const key=exKey(w,k), before=snap(), first=!G.les[key];
  if(isClass()) return {first:false,xp:0,evs:[]};
  G.les[key]=1; touchWorld(w.id); const evs=settle(before); return {first,xp:xpFor(G)-before.xp,evs};
}
const TEL_KEYS='ngphvt';
function telRec(key,type){ if(isClass()) return; const t=G.tel[key]||(G.tel[key]={}); t[type]=Math.min(99,(t[type]||0)+1); saveGame(); }
function telTime(key,sec){ if(isClass()) return; const t=G.tel[key]||(G.tel[key]={}); if(!t.t){ t.t=Math.max(1,Math.min(3600,Math.round(sec))); saveGame(); } }
function breakStreak(){ if(isClass()||!G.streak) return; G.streak=0; saveGame(); }
function addBonus(pts){ if(isClass()) return {evs:[],xp:0}; const before=snap(); G.bonus=Math.min(XP.bonusCap,(G.bonus||0)+pts); const evs=settle(before); return {evs,xp:xpFor(G)-before.xp}; }
function arcadeDone(score){
  if(isClass()) return {best:false,evs:[],xp:0};
  const before=snap(), isBest=score>G.arc.best; G.arc.runs++; if(isBest) G.arc.best=score; G.bonus=Math.min(XP.bonusCap,(G.bonus||0)+Math.floor(score/3));
  const evs=settle(before); return {best:isBest,evs,xp:xpFor(G)-before.xp};
}
/* ---------- Simulacro de parcial: guarda el intento y da un pequeño bono de XP ---------- */
function recordExam(entry){
  if(isClass()) return {evs:[],xp:0};
  G.exam=G.exam||{hist:[]}; G.exam.hist=(G.exam.hist||[]).slice(-11); G.exam.hist.push(entry);
  Object.keys(entry.byWorld||{}).forEach(touchWorld);
  return addBonus(Math.min(40,entry.ok*2));
}

/* ---------- Proyecto final: descenso de gradiente ---------- */
function recordMl(surfId,steps){
  if(isClass()) return {evs:[],xp:0,first:false};
  G.ml=G.ml||{done:{}};
  const first=!G.ml.done[surfId];
  G.ml.done[surfId]=Math.max(1,Math.round(steps)||1);
  if(!first){ saveGame(); return {evs:[],xp:0,first:false}; }
  const r=addBonus(15);
  return {evs:r.evs,xp:r.xp,first:true};
}

/* ---------- Compactar el historial de simulacros para el código de partida / reporte ---------- */
function packExamHist(hist){
  return (hist||[]).map(e=>{
    const bw=Object.keys(e.byWorld||{}).map(id=>id+'='+e.byWorld[id].ok+'/'+e.byWorld[id].total).join(';');
    return [Math.round(e.ts)||0,e.parts|0,e.ok|0,e.dur|0,bw].join(':');
  }).join('|');
}
function unpackExamHist(str){
  return String(str||'').split('|').filter(Boolean).map(tok=>{
    const seg=tok.split(':'), ts=+seg[0]||0, parts=Math.max(0,+seg[1]||0), ok=Math.max(0,+seg[2]||0), dur=Math.max(0,+seg[3]||0), byWorld={};
    String(seg[4]||'').split(';').filter(Boolean).forEach(p=>{ const m=/^([a-z]+)=(\d+)\/(\d+)$/.exec(p); if(m&&byId[m[1]]) byWorld[m[1]]={ok:+m[2],total:+m[3]}; });
    return {ts,parts,ok:Math.min(ok,parts),dur,byWorld};
  }).filter(e=>e.ts>0).slice(-12);
}

/* ---------- Código de partida y reportes ---------- */
const b64u={
  enc:bytes=>{let s='';bytes.forEach(b=>{s+=String.fromCharCode(b);});return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');},
  dec:str=>{const s=atob(str.replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(s,c=>c.charCodeAt(0));}
};
const checksum=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36);};
function packState(){
  const sv=Object.keys(G.solved).map(k=>{const r=G.solved[k];return k+':'+r.s+(r.r?'r':'');}).join(',');
  const tl=Object.keys(G.tel).map(k=>{const t=G.tel[k];const s=[...TEL_KEYS].filter(c=>t[c]).map(c=>c+t[c]).join('');return s?k+':'+s:'';}).filter(Boolean).join(',');
  return JSON.stringify({n:G.name,u:G.uid||'',s:sv,l:Object.keys(G.les).join(','),a:Object.keys(G.ach).join(','),k:G.streak,b:G.best,z:G.bonus,f:Object.keys(G.fl).join(','),t:tl,r:G.arc.best+'/'+G.arc.runs,x:packExamHist(G.exam&&G.exam.hist)});
}
function unpackState(json){
  const o=JSON.parse(json), g=defaultState();
  g.name=String(o.n||'').slice(0,24);
  String(o.s||'').split(',').filter(Boolean).forEach(t=>{ const m=/^([a-z]+)\.(p[1-5]|b):([1-3])(r)?$/.exec(t); if(m&&byId[m[1]]) g.solved[m[1]+'.'+m[2]]={s:+m[3],r:m[4]?1:0}; });
  String(o.l||'').split(',').filter(Boolean).forEach(t=>{ t=Object.keys(fixLes({[t]:1}))[0]; const m=/^([a-z]+)\.(l[1-3])$/.exec(t); if(m&&byId[m[1]]) g.les[t]=1; });
  String(o.a||'').split(',').filter(Boolean).forEach(t=>{ if(achById[t]) g.ach[t]=1; });
  if(/^[a-z0-9]{4,16}$/.test(String(o.u||''))) g.uid=String(o.u);
  String(o.t||'').split(',').filter(Boolean).forEach(tok=>{
    const m=/^([a-z]+)\.(p[1-5]|b):((?:[a-z]\d+)+)$/.exec(tok); if(!m||!byId[m[1]]) return;
    const t={}; String(m[3]).replace(/([a-z])(\d+)/g,(_,c,n)=>{ if(TEL_KEYS.includes(c)) t[c]=Math.min(c==='t'?3600:99,+n); return ''; });
    if(Object.keys(t).length) g.tel[m[1]+'.'+m[2]]=t;
  });
  g.streak=Math.max(0,Math.min(999,+o.k||0)); g.best=Math.max(0,Math.min(999,+o.b||0)); g.bonus=Math.max(0,Math.min(99999,+o.z||0));
  const ar=/^(\d+)\/(\d+)$/.exec(String(o.r||'')); if(ar){ g.arc.best=Math.min(9999,+ar[1]); g.arc.runs=Math.min(9999,+ar[2]); }
  String(o.f||'').split(',').filter(Boolean).forEach(t=>{ if(['saved','loaded','reported'].includes(t)) g.fl[t]=1; });

  return g;
}
async function encodeCode(prefix,json){
  const bytes=new TextEncoder().encode(json); let body,tag='p';
  try{
    if(typeof CompressionStream!=='undefined'){
      const cs=new CompressionStream('deflate-raw'), w=cs.writable.getWriter(); w.write(bytes).catch(()=>{}); w.close().catch(()=>{});
      const buf=new Uint8Array(await new Response(cs.readable).arrayBuffer()); body=b64u.enc(buf); tag='z';
    }
  }catch(e){body=null;}
  if(!body){ body=b64u.enc(bytes); tag='p'; }
  return prefix+'.'+tag+'.'+body+'.'+checksum(json);
}
async function decodeCode(prefix,code,nombre){
  const parts=String(code).trim().split('.');
  if(parts.length!==4||parts[0]!==prefix) throw new Error('Ese código no parece '+(nombre||'de este juego')+'. Debe empezar por '+prefix+'.');
  let bytes; try{bytes=b64u.dec(parts[2]);}catch(e){throw new Error('El código está incompleto o tiene caracteres de más.');}
  let json;
  if(parts[1]==='z'){
    if(typeof DecompressionStream==='undefined') throw new Error('Este navegador no puede leer códigos comprimidos. Prueba con uno más reciente.');
    try{const ds=new DecompressionStream('deflate-raw'), w=ds.writable.getWriter(); w.write(bytes).catch(()=>{}); w.close().catch(()=>{}); json=new TextDecoder().decode(await new Response(ds.readable).arrayBuffer());}
    catch(e){throw new Error('El código está dañado: revisa que lo copiaste completo.');}
  }else json=new TextDecoder().decode(bytes);
  if(checksum(json)!==parts[3]) throw new Error('El código está dañado: revisa que lo copiaste completo.');
  return json;
}

}

/* ---------- Fórmulas (MathJax) con cola y respaldo ---------- */
const TJ={q:new Set(),ready:false,failed:false,busy:false};
function typeset(el){
  if(!el||TJ.failed) return;
  TJ.q.add(el); el.classList.add('tex-wait'); flushTex();
}
function flushTex(){
  if(!TJ.ready||TJ.busy) return;
  const els=[...TJ.q].filter(e=>e.isConnected); TJ.q.clear();
  if(!els.length) return;
  TJ.busy=true;
  window.MathJax.typesetPromise(els).catch(()=>{}).then(()=>{ els.forEach(e=>e.classList.remove('tex-wait')); TJ.busy=false; if(TJ.q.size) flushTex(); });
}
function initMath(){
  let n=0; const t=setInterval(()=>{
    if(window.MathJax&&window.MathJax.typesetPromise){
      clearInterval(t);
      const go=()=>{ TJ.ready=true; flushTex(); };
      (window.MathJax.startup&&window.MathJax.startup.promise?window.MathJax.startup.promise:Promise.resolve()).then(go,go);
    }else if(++n>240){ clearInterval(t); TJ.failed=true; $$('.tex-wait').forEach(e=>e.classList.remove('tex-wait')); }
  },100);
}
/* TeX -> texto legible si MathJax no está disponible */
function texPlain(s){
  return String(s).replace(/\\dfrac|\\frac/g,'').replace(/\\left|\\right/g,'').replace(/\\cdot/g,'·').replace(/\\sqrt/g,'√').replace(/\\pi/g,'π').replace(/\\infty/g,'∞').replace(/\\(?:text|mathbf|mathrm)\{([^}]*)\}/g,'$1').replace(/\\[,;:! ]/g,' ').replace(/[{}]/g,'');
}

/* ---------- Pila de paneles ---------- */
const Panels=(()=>{
  const host=()=>$('#panels'); const stack=[]; let back=null;
  function syncBg(){
    stack.forEach((p,i)=>{ p.el.classList.toggle('behind',i<stack.length-1); p.el.setAttribute('aria-hidden',i<stack.length-1?'true':'false'); });
    if(back) back.classList.toggle('in',stack.length>0);
    BG.dim(stack.length>0);
  }
  function open(o){
    if(!back){ back=el('div','pback'); back.addEventListener('pointerdown',()=>{ if(stack.length&&!stack[stack.length-1].locked) Panels.closeTop(); }); host().appendChild(back); }
    const p={id:o.id||'',el:el('section','panel'),disposers:[],onClose:o.onClose||null,refresh:null,locked:!!o.locked,parent:stack[stack.length-1]||null};
    p.el.setAttribute('role','dialog'); p.el.setAttribute('aria-modal','true'); p.el.setAttribute('aria-label',o.title||'Panel');
    p.el.style.setProperty('--wh',o.hue!=null?o.hue:190);
    p.el.innerHTML='<header class="phead"><div class="pt"><div class="pk"></div><h2></h2></div><div class="px"></div></header><div class="pbody"></div><footer class="pfoot" hidden></footer>';
    $('.pk',p.el).textContent=o.kicker||''; $('h2',p.el).textContent=o.title||'';
    p.body=$('.pbody',p.el); p.foot=$('.pfoot',p.el); p.head=$('.px',p.el);
    const close=el('button','btn ghost icon','<span class="sr">Cerrar</span>'+ICON.x); close.type='button'; close.setAttribute('aria-label','Cerrar'); close.addEventListener('click',()=>Panels.close(p)); p.head.appendChild(close);
    host().appendChild(p.el); stack.push(p);
    host().style.pointerEvents='auto';
    SND.open();
    o.render(p);
    requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ p.el.classList.add('in'); syncBg(); }); });
    setTimeout(()=>{ try{ close.focus({preventScroll:true}); }catch(e){} },380);
    return p;
  }
  function close(p,quiet){
    const i=stack.indexOf(p); if(i<0) return;
    // cierra también los paneles que estén encima
    for(let j=stack.length-1;j>=i;j--){ const q=stack[j]; stack.pop(); q.disposers.forEach(d=>{ try{d();}catch(e){} }); q.disposers=[]; q.el.classList.remove('in'); q.el.classList.add('out'); setTimeout(()=>q.el.remove(),340); if(q.onClose) try{q.onClose();}catch(e){} }
    if(!quiet) SND.close();
    syncBg();
    const top=stack[stack.length-1];
    if(top){ if(top.refresh) top.refresh(); }
    else { host().style.pointerEvents='none'; if(UI.onAllClosed) UI.onAllClosed(); }
  }
  return {open,close,closeTop(){ if(stack.length) close(stack[stack.length-1]); },closeAll(){ if(stack.length) close(stack[0],true); },get top(){ return stack[stack.length-1]||null; },get depth(){ return stack.length; },stack};
})();

/* ================= NABLA · Partes de respuesta: numérica, expresión, vector, puntos, opción, gráficas ================= */
const numShow=v=>{ const r=Math.round(v); if(Math.abs(v-r)<1e-9) return String(r).replace('-','−'); return fmt(v,4).replace(/0+$/,'').replace(/,$/,''); };
const numTexShow=v=>numShow(v).replace(',','{,}').replace('−','-');
function ansTeX(p){
  try{
    if(p.k==='num') return '\\('+(p.show||numTexShow(p.v))+'\\)';
    if(p.k==='expr') return '\\('+strTeX(p.e)+'\\)';
    if(p.k==='vec') return '\\(\\left(\\,'+p.comps.map(c=>typeof c==='number'?numTexShow(c):strTeX(c)).join(',\\;')+'\\,\\right)\\)';
    if(p.k==='pts') return '\\('+p.pts.map(q=>'\\left('+q.map(v=>numTexShow(v)).join(',\\,')+'\\right)').join(';\\ ')+'\\)';
    if(p.k==='mc'){ const o=p.opts[p.ans]; return o.tex?o.tex:'la opción marcada en verde'; }
  }catch(e){}
  return p.k==='paint'?'La región correcta aparece marcada con borde verde.':p.k==='dir'?'La flecha cian marca la dirección correcta.':p.k==='pt'?'La curva verde marca dónde debías hacer clic.':'';
}
const KEYS=[['π','pi'],['√','sqrt()',1],['^','^'],['( )','()',1],['sen','sen()',1],['cos','cos()',1],['ln','ln()',1],['eˣ','e^()',1],['|x|','abs()',1]];
function insertAt(inp,txt,back){
  const a=inp.selectionStart==null?inp.value.length:inp.selectionStart, b=inp.selectionEnd==null?a:inp.selectionEnd;
  inp.value=inp.value.slice(0,a)+txt+inp.value.slice(b); const pos=a+txt.length-(back||0); inp.focus(); try{inp.setSelectionRange(pos,pos);}catch(e){}
  inp.dispatchEvent(new Event('input'));
}
const angDiff=(a,b)=>{ const d=Math.abs(a-b)%360; return d>180?360-d:d; };

/* ctx: {onWrong(p,type,msg), onPartOk(p), onDone(), canAnswer(), quiet}   Devuelve un control con dispose/revealAll */
function mountParts(host,parts,ctx){
  host.innerHTML=''; const items=[], disposers=[]; let finished=false;
  const fbBox=(root)=>{ let f=$('.fb',root); if(!f){ f=el('div','fb'); f.setAttribute('role','status'); root.appendChild(f); } return f; };
  const showFb=(root,kind,title,msg,warn)=>{
    const f=fbBox(root); f.className='fb '+kind; f.innerHTML='<b></b><span></span>'; $('b',f).textContent=title||''; const sp=$('span',f); if(msg&&/\\\(|\\\[/.test(msg)) sp.innerHTML=msg; else sp.textContent=msg||''; if(warn){ const w=el('span'); w.style.display='block'; w.style.opacity='.8'; w.textContent=warn; f.appendChild(w); } if(/\\\(|\\\[/.test(msg||'')) typeset(f);
  };
  const markOk=(it,note)=>{
    if(it.done) return; it.done=true; it.root.classList.add('ok');
    $$('input,button.btn',it.root).forEach(e=>{ if(!e.closest('.vz')) e.disabled=true; });
    $$('.kp',it.root).forEach(e=>e.remove());
    if(!ctx.quiet){ SND.part(); const an=$('.plab',it.root).getBoundingClientRect(); FX.ring((an.left+22)/window.innerWidth,(an.top+an.height/2)/window.innerHeight,COL.lime,64); }
    if(note) showFb(it.root,'ok','¡Correcto!',note); else showFb(it.root,'ok','¡Correcto!','');
    ctx.onPartOk&&ctx.onPartOk(it.p);
    if(items.every(x=>x.done||x.revealed)&&!finished){ finished=true; ctx.onDone&&ctx.onDone(); }
  };
  const wrong=(it,type,msg,title,warn)=>{
    if(it.done||it.revealed) return; it.att++;
    showFb(it.root,type==='p'?'warn':'bad',title||(type==='p'?'No pude leer tu respuesta':'Todavía no'),msg,warn);
    if(!ctx.quiet){ SND.bad(); FX.shake(it.root); }
    ctx.onWrong&&ctx.onWrong(it.p,type,msg);
  };
  const guard=()=>!ctx.canAnswer||ctx.canAnswer();

  parts.forEach((p,i)=>{
    const root=el('div','part'), it={p,root,done:false,revealed:false,att:0,ctl:null}; items.push(it);
    root.appendChild(el('div','plab',p.lab||'')); host.appendChild(root);
    const k=p.k;
    if(k==='num'||k==='expr'||k==='vec'||k==='pts'){
      const row=el('div','arow'), inp=el('input'); inp.type='text'; inp.id='ans-'+Math.random().toString(36).slice(2,7); inp.autocomplete='off'; inp.spellcheck=false; inp.setAttribute('autocapitalize','off'); inp.setAttribute('aria-label','Tu respuesta'+(parts.length>1?' ('+(i+1)+')':''));
      inp.placeholder=k==='num'?'Ej.: 7,2   36/5   8*pi':k==='expr'?'Ej.: 2*x*y - 1':k==='vec'?'Ej.: (2x, x^2 + 1)':'Ej.: (1, 2); (0, 0)';
      const btn=el('button','btn primary','Comprobar'); btn.type='button';
      row.append(inp,btn); root.appendChild(row);
      const prev=el('div','prev'); root.appendChild(prev);
      if(k!=='pts'&&k!=='num'||k==='num'){
        const kp=el('div','kp'); KEYS.forEach(kk=>{ if(k==='num'&&(kk[0]==='|x|'||kk[0]==='eˣ')) return; const b=el('button','',esc(kk[0])); b.type='button'; b.title='Insertar '+kk[1]; b.addEventListener('click',()=>insertAt(inp,kk[1],kk[2]?1:0)); kp.appendChild(b); }); root.appendChild(kp);
      }
      let tmr=0;
      const updPrev=()=>{
        clearTimeout(tmr); tmr=setTimeout(()=>{
          const v=inp.value.trim(); if(!v){ prev.innerHTML=''; return; }
          try{
            if(k==='expr'){ const r=prepExpr(v,p.vars||['x','y']); prev.innerHTML='\\('+toTeX(r.ast)+'\\)'; typeset(prev); }
            else if(k==='num'){ const x=evalConst(stripLhs(v)); prev.textContent='≈ '+fmt(x,4); }
            else if(k==='vec'){ const parts2=parseVecParts(v); prev.innerHTML='\\(\\left(\\,'+parts2.map(s=>toTeX(prepExpr(s,p.vars||[]).ast)).join(',\\;')+'\\,\\right)\\)'; typeset(prev); }
            else prev.textContent='';
          }catch(e){ prev.textContent=''; }
        },260);
      };
      inp.addEventListener('input',updPrev);
      const check=()=>{
        if(it.done||it.revealed||!guard()) return; const v=inp.value; if(!v.trim()){ showFb(root,'warn','Escribe tu respuesta','Escríbela en el cuadro y pulsa Comprobar.'); return; }
        const r=k==='num'?chkNum(p,v):k==='expr'?chkExpr(p,v):k==='vec'?chkVec(p,v):chkPoints(p,v);
        if(r.ok) markOk(it,''); else wrong(it,r.kind==='parse'?'p':'n',r.msg,r.kind==='parse'?'No pude leer tu respuesta':(r.partial?'Vas por buen camino':'Todavía no'),r.warn);
      };
      btn.addEventListener('click',check); inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); check(); } });
      it.focus=()=>inp.focus(); it.disable=()=>{ inp.disabled=true; btn.disabled=true; $$('.kp',root).forEach(e=>e.remove()); };
    }else if(k==='mc'){
      const list=el('div','opts'+(p.opts.some(o=>o.thumb)?' thumbs':'')); const order=p.opts.map((o,j)=>({o:typeof o==='string'?{tex:o}:o,j}));
      const ord=p.noShuffle?order:shuffle(order);
      ord.forEach((e,idx)=>{
        const b=el('button','opt'); b.type='button'; b.innerHTML='<span class="ol">'+'ABCDEFGH'[idx]+'</span>'+(e.o.thumb?'<span class="thumbhost"></span>':'')+(e.o.tex?'<span class="ot">'+e.o.tex+'</span>':'');
        if(e.o.thumb){ const h=$('.thumbhost',b); const t=makeThumb(h,e.o.thumb); disposers.push(()=>t.dispose()); }
        b.addEventListener('click',()=>{
          if(it.done||it.revealed||!guard()) return;
          if(e.j===p.ans){ b.classList.add('ok'); $$('.opt',list).forEach(x=>{x.disabled=true;}); markOk(it,p.why||''); }
          else{ b.classList.add('bad'); b.disabled=true; wrong(it,'g','Esa no es. Descártala y prueba con otra.','Casi'); }
        });
        list.appendChild(b);
      });
      root.appendChild(list); typeset(list);
      it.disable=()=>{ $$('.opt',list).forEach(x=>{x.disabled=true;}); };
      it.revealMC=()=>{ $$('.opt',list).forEach((b,idx)=>{ if(ord[idx].j===p.ans) b.classList.add('ok'); b.disabled=true; }); };
    }else if(k==='paint'||k==='dir'||k==='pt'){
      const vh=el('div','vzhost'); root.appendChild(vh);
      const ctl=k==='paint'?makePaint(vh,p.cfg):k==='dir'?makeDirPick(vh,p.cfg):makePtPick(vh,p.cfg); it.ctl=ctl; disposers.push(()=>ctl.dispose());
      const row=el('div','arow'); row.style.marginTop='10px'; const btn=el('button','btn primary','Comprobar'); btn.type='button'; row.appendChild(btn); root.appendChild(row);
      btn.addEventListener('click',()=>{
        if(it.done||it.revealed||!guard()) return;
        if(k==='paint'){
          const r=ctl.check(); if(r.empty){ showFb(root,'warn','Falta pintar','Pinta primero la región (clic o arrastra sobre las celdas).'); return; }
          if(r.ok) markOk(it,p.why||''); else wrong(it,'g',r.fp>r.fn?'Pintaste celdas que no están en el dominio. Revisa qué lado de la frontera cumple la condición.':r.fn>r.fp?'Te faltan celdas del dominio. Revisa las desigualdades.':'La región no coincide todavía: mira dónde está la frontera y prueba un punto.','Todavía no');
        }else if(k==='dir'){
          const a=ctl.angle(); if(a==null){ showFb(root,'warn','Elige una dirección','Haz clic en el mapa para que la flecha ámbar salga de P.'); return; }
          const d=angDiff(a,ctl.target()); if(d<=(p.tol||14)) markOk(it,''); else wrong(it,'g','Estás a unos '+Math.round(d)+'° de la dirección correcta. Recuerda: ∇f apunta hacia donde f crece más rápido.','Todavía no');
        }else{
          const pt=ctl.point(); if(!pt){ showFb(root,'warn','Elige un punto','Haz clic sobre el mapa.'); return; }
          if(p.ok(pt[0],pt[1])) markOk(it,''); else wrong(it,'g','Ese punto no cumple la condición (x = '+fmt(pt[0])+', y = '+fmt(pt[1])+'). '+(p.cfg.hint||'Usa las curvas de nivel para guiarte.'),'Todavía no');
        }
      });
      it.disable=()=>{ btn.disabled=true; };
    }
  });
  const ctl={
    items,
    get done(){ return items.every(x=>x.done||x.revealed); },
    get solved(){ return items.every(x=>x.done); },
    focusFirst(){ const it=items.find(x=>!x.done&&x.focus); if(it&&it.focus) try{it.focus();}catch(e){} },
    revealAll(){
      finished=true;
      items.forEach(it=>{
        if(it.done||it.revealed) return; it.revealed=true; it.root.classList.add('rev'); if(it.disable) it.disable(); if(it.revealMC) it.revealMC(); if(it.ctl&&it.ctl.reveal) it.ctl.reveal();
        const a=ansTeX(it.p); const box=el('div','ansbox'); box.innerHTML='<b>Respuesta:</b> '+a; it.root.appendChild(box); typeset(box);
      });
    },
    dispose(){ disposers.forEach(d=>{ try{d();}catch(e){} }); disposers.length=0; }
  };
  typeset(host);
  return ctl;
}

/* ---------- Un ejercicio completo (enunciado, gráfica, partes, pista, solución) ---------- */
/* st: estado compartido {att,hint,rev,broke,t0}. o: {key, onSolved(rev)} */
function exView(host,ex,o){
  const st=o.st, disp=[]; host.innerHTML='';
  let solved=false;
  const q=el('div','exq'); q.innerHTML=ex.q; host.appendChild(q); typeset(q);
  if(ex.viz){ const vh=el('div','vzhost'); host.appendChild(vh); try{ const v=makeViz(vh,ex.viz); disp.push(()=>v.dispose()); }catch(e){} }
  const ph=el('div','parts'); host.appendChild(ph);
  const bar=el('div','exbar'), starsEl=el('div','starsrow'); starsEl.setAttribute('role','img');
  const bHint=el('button','btn sm','Pista'); bHint.type='button';
  const bSol=el('button','btn sm ghost','Ver solución'); bSol.type='button';
  bar.append(bHint,bSol,el('span','grow'),starsEl); host.appendChild(bar);
  const hintBox=el('div'), rewardHost=el('div'), solHost=el('div'); host.append(hintBox,rewardHost,solHost);
  const updStars=()=>{ const n=st.rev?0:calcStars({hint:st.hint,att:st.att}); starsEl.innerHTML=starsHTML(n); starsEl.setAttribute('aria-label',n+' de 3 estrellas posibles'); starsEl.title='Estrellas posibles ahora: '+n+' (bajan con pistas y errores)'; if(isClass()) starsEl.hidden=true; };
  updStars();
  const finish=rev=>{
    if(solved) return; solved=true; bHint.disabled=true; bSol.disabled=true;
    const sb=el('div','solbox','<h4>Solución explicada</h4>'+(ex.sol||'')); solHost.appendChild(sb); typeset(sb);
    o.onSolved&&o.onSolved(rev,rewardHost);
  };
  const ctl=mountParts(ph,ex.parts,{
    canAnswer:()=>!solved,
    onWrong:(pt,type)=>{ telRec(o.key,type); if(type!=='p'){ st.att++; if(!st.broke){ st.broke=1; breakStreak(); updateHud(0,true); } updStars(); } },
    onDone:()=>finish(st.rev)
  });
  disp.push(()=>ctl.dispose());
  bHint.addEventListener('click',()=>{
    if(solved) return;
    if(!st.hint){ st.hint=true; telRec(o.key,'h'); updStars(); }
    hintBox.innerHTML=''; const f=el('div','fb hint','<b>Pista</b><span></span>'); $('span',f).innerHTML=ex.hint||''; hintBox.appendChild(f); typeset(f); SND.step();
  });
  bSol.addEventListener('click',async()=>{
    if(solved) return;
    if(!isClass()){ const ok=await confirmBox('¿Ver la solución?','Verás las respuestas y este ejercicio no dará estrellas. Puedes repetirlo después para ganarlas.','Ver solución'); if(!ok||solved) return; }
    st.rev=true; telRec(o.key,'v'); updStars(); ctl.revealAll(); finish(true);
  });
  return {ctl,dispose(){ disp.forEach(d=>{ try{d();}catch(e){} }); disp.length=0; },focus(){ ctl.focusFirst(); }};
}

/* ---------- Tarjeta de recompensa ---------- */

  c.innerHTML='<h3></h3><div class="rstars" aria-label="'+n+' de 3 estrellas">'+starsHTML(n).replace(/<svg /g,'<svg ')+'</div><div class="rxp"></div><p class="note" style="margin:8px 0 0"></p>';
  $('h3',c).textContent=rev?(o.boss?'Jefe estudiado':'Solución revelada'):(o.boss?'¡'+o.name+' derrotado!':(n===3?'¡Reto perfecto!':'¡Reto superado!'));
  const xpEl=$('.rxp',c), note=$('.note',c);
  if(res.demo){ xpEl.textContent='Modo clase'; note.textContent='No se guarda progreso ni se registran errores.'; }
  else{
    xpEl.textContent='+0 XP';
    note.textContent=rev?'Sin estrellas esta vez. Vuelve a intentarlo cuando quieras: la solución ya está abajo para repasar.':(!res.first&&res.xp===0?'Ya lo tenías resuelto con igual o mejor puntuación. Repetir no resta nada.':(n===3?'Sin pistas ni errores: máxima puntuación.':'Con menos pistas y errores ganas más estrellas al repetirlo.'));
  }

  const dur=800, t0=performance.now(), target=res.xp||0;
  if(!res.demo&&target>0){ const tick=()=>{ const k=Math.min(1,(performance.now()-t0-300)/dur); if(k>0) xpEl.textContent='+'+Math.round(target*(1-Math.pow(1-k,3)))+' XP'; if(k<1&&c.isConnected) requestAnimationFrame(tick); }; requestAnimationFrame(tick); }
  else if(!res.demo) xpEl.textContent='+0 XP';
  if(!rev){ SND.ok(); FX.burst(o.boss?200:n===3?130:80,{x:.5,y:.35,up:true}); if(n===3) setTimeout(()=>FX.ring(.5,.4,COL.amber,300),400); }

  return c;
}

function openReto(w,idx0){

    setWorldBg(w);
    let cur=null; p.disposers.push(()=>{ if(cur) cur.dispose(); });
    const load=idx=>{
      if(cur){ cur.dispose(); cur=null; }
      const ex=w.retos[idx], key=exKey(w,ex.id), st={att:0,hint:false,rev:false,broke:false,t0:Date.now()}, prev=G.solved[key];
      $('h2',p.el).textContent=ex.t; $('.pk',p.el).textContent='Reto '+(idx+1)+' de 5 · '+w.short;
      p.body.innerHTML='<div class="pin"></div>'; p.body.scrollTop=0;
      const box=$('.pin',p.body);
      if(prev){ const b=el('div','chip'+(prev.r?' amber':' lime'),prev.r?'Solución vista antes':'Resuelto antes · '+prev.s+' ★'); b.style.marginBottom='12px'; box.appendChild(b); }
      const host=el('div'); box.appendChild(host);
      p.foot.hidden=false; p.foot.innerHTML='';
      const bBack=el('button','btn','Mundo'); bBack.type='button'; bBack.innerHTML=ICON.back+'<span>Volver al mundo</span>'; bBack.addEventListener('click',()=>Panels.close(p));
      const nav=el('div'); nav.style.cssText='display:flex;gap:8px;flex-wrap:wrap';
      const bPrev=el('button','btn','Anterior'); bPrev.type='button'; bPrev.disabled=idx===0; bPrev.addEventListener('click',()=>load(idx-1));
      const last=idx===w.retos.length-1;
      const bNext=el('button','btn primary',last?'Ir al jefe':'Siguiente reto'); bNext.type='button';
      bNext.disabled=!(prev||isClass()); if(last&&!bossUnlocked(w)) bNext.disabled=true;
      bNext.addEventListener('click',()=>{ if(last){ Panels.close(p,true); openBoss(w); } else load(idx+1); });
      nav.append(bPrev,bNext); p.foot.append(bBack,nav);
      cur=exView(host,ex,{key,st,onSolved:(rev,rh)=>{
        telTime(key,(Date.now()-st.t0)/1000);
        const res=recordSolve(w,ex.id,{hint:st.hint,att:st.att,rev});
        rewardCard(rh,res,{rev,boss:false});
        bNext.disabled=last&&!bossUnlocked(w); bNext.classList.add('pulse-in');
        handleEvents(res.evs,1300);

      }});
      setTimeout(()=>cur&&cur.focus(),420);
    };
    load(idx0);
  }});
}

/* ---------- Lección ---------- */
function openLesson(w,li0){
  Panels.open({id:'lesson',title:'',kicker:'',hue:w.hue,render(p){
    setWorldBg(w);
    let cur=null, step=0, quiz=null, LI=li0, L=w.lessons[LI]; p.disposers.push(()=>{ if(cur) cur.dispose(); if(quiz) quiz.dispose(); });
    const kill=()=>{ if(cur){ cur.dispose(); cur=null; } if(quiz){ quiz.dispose(); quiz=null; } };
    const show=i=>{
      kill(); step=i; const n=L.steps.length, isQuiz=i===n, isDone=i>n;
      $('h2',p.el).textContent=L.t; $('.pk',p.el).textContent='Lección '+(LI+1)+' de 3 · '+w.short;
      p.body.innerHTML=''; p.body.scrollTop=0; const box=el('div','pin'); p.body.appendChild(box);
      p.foot.hidden=false; p.foot.innerHTML='';
      const dots=el('div','dots'); for(let k=0;k<=n;k++) dots.appendChild(el('i',k<i?'done':k===i?'on':''));
      const bPrev=el('button','btn',ICON.back+'<span>Anterior</span>'); bPrev.type='button'; bPrev.disabled=i===0||isDone; bPrev.addEventListener('click',()=>{ SND.step(); show(i-1); });
      const bNext=el('button','btn primary',isQuiz?'Terminar lección':'Siguiente'); bNext.type='button';
      p.foot.append(bPrev,dots,bNext);
      if(isDone){
        p.foot.hidden=true;
        const res=completeLesson(w,L.id);
        const c=el('div','reward','<h3>Lección completada</h3><div class="rxp"></div><p class="note"></p><div class="mactions" style="justify-content:center"></div>'); box.appendChild(c);
        $('.rxp',c).textContent=res.demo||isClass()?'Modo clase':(res.first?'+'+res.xp+' XP':'+0 XP'); $('.note',c).textContent=isClass()?'No se guarda progreso.':(res.first?'Ahora ve por los retos de este mundo.':'Ya la habías completado antes.');
        const act=$('.mactions',c), b1=el('button','btn','Volver al mundo'); b1.type='button'; b1.addEventListener('click',()=>Panels.close(p)); act.appendChild(b1);
        if(LI<w.lessons.length-1){ const b2=el('button','btn primary','Siguiente lección'); b2.type='button'; b2.addEventListener('click',()=>{ LI++; L=w.lessons[LI]; show(0); }); act.appendChild(b2); }
        else{ const b2=el('button','btn primary','Ir a los retos'); b2.type='button'; b2.addEventListener('click',()=>Panels.close(p)); act.appendChild(b2); }
        SND.ok(); FX.burst(70,{x:.5,y:.35,up:true}); handleEvents(res.evs,900); return;
      }
      if(!isQuiz){
        const S=L.steps[i];
        const st=el('div','lstep'); st.innerHTML='<h3></h3><div class="lbody">'+S.html+'</div>'; $('h3',st).textContent=S.h; box.appendChild(st);
        if(S.viz){ const vh=el('div','vzhost'); st.appendChild(vh); try{ cur=makeViz(vh,S.viz); }catch(e){} }
        typeset(st);
        bNext.addEventListener('click',()=>{ SND.step(); show(i+1); });
      }else{
        const st=el('div','lstep'); st.innerHTML='<h3>Ahora tú</h3><p class="note">Resuelve para cerrar la lección. Aquí no hay penalización: es práctica.</p>'; box.appendChild(st);
        const qz=el('div','qz'); qz.innerHTML='<h4>Comprueba lo aprendido</h4>'; const host=el('div'); qz.appendChild(host); st.appendChild(qz);
        bNext.disabled=true;
        quiz=mountParts(host,L.quiz,{canAnswer:()=>true,onWrong:()=>{},onDone:()=>{ bNext.disabled=false; bNext.classList.add('pulse-in'); const rv=quiz&&quiz.items.some(x=>x.revealed); if(!rv){ SND.ok(); FX.burst(40,{x:.5,y:.6}); } }});
        const rv=el('button','btn sm ghost','Ver respuesta'); rv.type='button'; rv.style.marginTop='10px'; rv.addEventListener('click',()=>{ quiz.revealAll(); bNext.disabled=false; rv.remove(); }); qz.appendChild(rv);
        bNext.addEventListener('click',()=>{ show(n+1); });
        setTimeout(()=>quiz&&quiz.focusFirst(),420);
      }
    };
    show(0);
  }});
}

    p.body.innerHTML='<div class="pin"><div class="brief"><div class="card"><h3>De qué trata</h3><p>El descenso de gradiente es el algoritmo que entrena a la gran mayoría de los modelos de IA de hoy: redes neuronales, regresiones, casi todo. Aquí lo ves en cámara lenta, moviendo un punto sobre una superficie de pérdida, paso a paso, en la dirección opuesta al gradiente.</p></div>'+
      '<div class="card ai"><h3>La regla de actualización</h3><div id="mlFormula"></div><p>η (eta) es la <b>tasa de aprendizaje</b>: qué tan grande es cada paso. Muy chica y avanzas casi sin moverte; muy grande y puedes rebotar o divergir. Ajustarla bien es buena parte del arte de entrenar un modelo.</p></div></div>'+
      '<div class="phase-tabs" id="mlTabs"></div><div id="mlStage"></div><div class="card" id="mlNarr"></div></div>';

/* ---------- SHA-256 en JavaScript puro (no depende de contextos seguros) ---------- */
const SHA_K=new Uint32Array([
0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256(bytes){
  const H=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  const l=bytes.length, nb=((l+9+63)>>6)<<6, buf=new Uint8Array(nb); buf.set(bytes); buf[l]=0x80;
  const dv=new DataView(buf.buffer); dv.setUint32(nb-8,Math.floor(l/0x20000000)); dv.setUint32(nb-4,(l<<3)>>>0);
  const w=new Uint32Array(64);
  for(let o=0;o<nb;o+=64){
    for(let i=0;i<16;i++) w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){
      const a=w[i-15], b=w[i-2];
      w[i]=w[i-16]+(((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3))+w[i-7]+(((b>>>17)|(b<<15))^((b>>>19)|(b<<13))^(b>>>10));
    }
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let i=0;i<64;i++){
      const t1=h+(((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7)))+((e&f)^(~e&g))+SHA_K[i]+w[i];
      const t2=(((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)))+((a&b)^(a&c)^(b&c));
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
    }
    H[0]+=a;H[1]+=b;H[2]+=c;H[3]+=d;H[4]+=e;H[5]+=f;H[6]+=g;H[7]+=h;
  }
  const out=new Uint8Array(32), ov=new DataView(out.buffer); for(let i=0;i<8;i++) ov.setUint32(i*4,H[i]); return out;
}
/* Misma contraseña docente que Diferencialia (mismos parámetros) */
const PW_SALT='diferencialia|casallas|v1', PW_ROUNDS=30000;
const PW_HASH='1a682e8829eb595a28212b5a6ea4eb0df0c09167592e691070052ea7910ed63b';
function pwHash(pw){
  const enc=new TextEncoder(), salt=enc.encode(PW_SALT);
  let h=sha256(enc.encode(PW_SALT+'|'+pw)); const buf=new Uint8Array(32+salt.length); buf.set(salt,32);
  for(let i=0;i<PW_ROUNDS;i++){ buf.set(h,0); h=sha256(buf); }
  return Array.from(h,b=>b.toString(16).padStart(2,'0')).join('');
}
let pwFails=0, pwLock=0, PW_OK=false;
function askTeacherPw(title,text){
  if(PW_OK) return Promise.resolve(true);
  return new Promise(res=>{
    let done=false;
    const m=openModal({cls:'small',label:'Acceso docente',onClose:()=>{ if(!done){ done=true; res(false); } },html:
      '<h2>'+esc(title||'Acceso docente')+'</h2><p>'+esc(text||'Escribe la contraseña docente para continuar.')+'</p>'+
      '<label class="sr" for="tpw">Contraseña</label><input type="password" id="tpw" autocomplete="off" spellcheck="false" placeholder="Contraseña" data-autofocus>'+
      '<div class="fb bad" id="tpe" hidden></div>'+
      '<div class="mactions"><button class="btn" data-m="close">Cancelar</button><button class="btn primary" id="tpb">Entrar</button></div>'});
    const inp=$('#tpw',m.box), er=$('#tpe',m.box), btn=$('#tpb',m.box); let busy=false;
    const showErr=t=>{ er.hidden=false; er.innerHTML='<b>No pude abrir el acceso docente</b><span></span>'; $('span',er).textContent=t; SND.bad(); m.box.classList.remove('shake'); void m.box.offsetWidth; m.box.classList.add('shake'); };
    const submit=async()=>{
      if(busy) return; const left=pwLock-Date.now();
      if(left>0){ showErr('Espera '+Math.ceil(left/1000)+' s antes de intentarlo otra vez.'); return; }
      busy=true; btn.disabled=true; await wait(40);
      const ok=pwHash(inp.value)===PW_HASH; busy=false; btn.disabled=false;
      if(!m.box.isConnected) return;
      if(ok){ pwFails=0; PW_OK=true; done=true; res(true); closeModal(); return; }
      pwFails++; inp.value='';
      if(pwFails>=4){ pwLock=Date.now()+Math.min(60000,5000*Math.pow(2,pwFails-4)); showErr('La contraseña no es correcta. Espera '+Math.ceil((pwLock-Date.now())/1000)+' s para volver a intentarlo.'); }
      else showErr('La contraseña no es correcta. Revisa las mayúsculas.');
      inp.focus();
    };
    btn.addEventListener('click',submit);
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } });
  });
}

  const out=[];
  WORLDS.forEach(w=>EXK.forEach(k=>{
    const key=w.id+'.'+k, e={key,w,k,n:0,s:0,rv:0,h:0,f:{n:0,g:0,p:0},times:[]};
    list.forEach(su=>{
      const r=su.g.solved[key], t=su.g.tel[key]; if(!r&&!t) return;
      e.n++; if(r){ e.s++; if(r.r) e.rv++; }
      if(t){ ['n','g','p'].forEach(c=>{ e.f[c]+=t[c]||0; }); if(t.h) e.h++; if(t.t) e.times.push(t.t); }
    });
    e.fails=e.f.n+e.f.g+e.f.p; e.avg=e.n?e.fails/e.n:0; e.rvr=e.n?e.rv/e.n:0; e.hr=e.n?e.h/e.n:0;
    e.idx=e.avg+3*e.rvr; e.med=median(e.times);
    out.push(e);
  }));
  return out;
}
function worldAgg(exs){
  return WORLDS.map(w=>{
    const a={w,n:0,s:0,rv:0,h:0,f:{n:0,g:0,p:0}};
    exs.filter(e=>e.w===w).forEach(e=>{ a.n+=e.n; a.s+=e.s; a.rv+=e.rv; a.h+=e.h; for(const c in a.f) a.f[c]+=e.f[c]; });
    a.fails=a.f.n+a.f.g+a.f.p; a.avg=a.n?a.fails/a.n:0; a.rvr=a.n?a.rv/a.n:0; a.idx=a.avg+3*a.rvr;
    return a;
  });
}
function advice(a){
  if(a.n<3) return 'Todavía hay pocos datos de este mundo.';
  const parts=[], big=Math.max(a.f.n,a.f.g,a.f.p);
  if(a.avg>=0.8||a.rvr>=0.2){
    if(big>0&&big===a.f.n) parts.push('Fallan sobre todo al calcular o aplicar el procedimiento: repasa la receta paso a paso y los errores típicos de la guía del mundo, y resuelve un ejemplo en clase.');
    else if(big>0&&big===a.f.g) parts.push('Les cuesta interpretar gráficas: proyecta la superficie y sus curvas de nivel en clase y pídeles predecir antes de calcular.');
    else if(big>0&&big===a.f.p) parts.push('Les cuesta escribir la respuesta: repasa la notación (x^2*y, sqrt(), paréntesis) y el teclado de símbolos.');
    if(a.rvr>=0.2) parts.push('Varios ven la solución sin agotar los intentos: conviene un ejemplo guiado antes de que se frustren.');
  }else parts.push('Este mundo va bien: pocos fallos y casi nadie necesita ver la solución.');
  return parts.join(' ');
}

async function importReports(text){
  const codes=[...new Set(String(text).match(/NABR\.[zp]\.[A-Za-z0-9_-]+\.[a-z0-9]+/g)||[])];
  const res={total:codes.length,nuevos:0,actualizados:0,iguales:0,antiguos:0,errores:[]};
  for(const c of codes){
    try{
      const r=await importReport(c), cur=ROSTER.s[r.uid];
      if(cur&&cur.at>=r.at){ if(cur.at===r.at) res.iguales++; else res.antiguos++; continue; }
      const hist=((cur&&cur.hist)||[]).slice(-59);
      hist.push([r.at,xpFor(r.g),Object.keys(r.g.solved).filter(k=>!/\.b$/.test(k)).length,failsOf(r.g)]);
      ROSTER.s[r.uid]={n:r.g.name,g:r.group,at:r.at,json:r.json,hist};
      if(cur) res.actualizados++; else res.nuevos++;
    }catch(e){ res.errores.push(e.message); }
  }
  if(res.nuevos||res.actualizados) saveRoster();
  return res;
}

function rng(seed){ let a=seed>>>0; return ()=>{ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
const DEMO_NAMES=['Valentina R.','Santiago M.','Camila G.','Mateo P.','Isabella T.','Sebastián L.','Daniela O.','Andrés C.','Laura V.','Felipe A.','Mariana S.','Nicolás B.','Juliana H.','David F.'];
const DEMO_HARD=[.7,1.1,1.3,1.7,2.2,2.0,1.8];
const DEMO_ERR=['n','g','n','g','n','n','p'];
function demoStudent(idx,now){
  const r=rng(9100+idx*37), g=defaultState(), skill=0.35+0.6*((idx*0.61803)%1), reach=Math.max(1,Math.min(WORLDS.length,Math.round(1.6+skill*5.6-r()*1.2)));
  g.name=DEMO_NAMES[idx%DEMO_NAMES.length]; g.uid='ej'+String(idx).padStart(2,'0')+'ab';
  let streak=0;
  for(let wi=0;wi<reach;wi++){
    const w=WORLDS[wi]; let stop=false;
    ['l1','l2','l3'].forEach(k=>{ if(r()<0.55+skill*0.45) g.les[w.id+'.'+k]=1; });
    EXK.forEach((k,ki)=>{
      if(stop) return; if(k==='b'&&Object.keys(g.solved).filter(x=>x.startsWith(w.id+'.p')).length<3) return;
      if(r()>0.6+skill*0.45){ stop=true; return; }
      const key=w.id+'.'+k, hard=DEMO_HARD[wi]*(1.45-skill)*(1+ki*0.08);
      const fails=Math.min(9,Math.floor(-Math.log(1-r())*hard)), tel={};
      const dom=DEMO_ERR[wi];
      for(let f=0;f<fails;f++){ const c=r()<0.6?dom:['n','g','p'][Math.floor(r()*3)]; tel[c]=(tel[c]||0)+1; }
      if(fails>=2&&r()<0.6) tel.h=1;
      const stuck=fails>=6&&r()<0.6, reveal=!stuck&&fails>=4&&r()<0.5;
      tel.t=Math.round(45+fails*50+r()*110);
      if(reveal) tel.v=1;
      if(Object.keys(tel).length) g.tel[key]=tel;
      if(stuck){ stop=true; return; }
      const stars=reveal?1:Math.max(1,3-(tel.h?1:0)-(fails>0?1:0));
      g.solved[key]={s:stars,r:reveal?1:0};
      if(!reveal){ streak++; g.best=Math.max(g.best,streak); } else streak=0;
    });
  }
  g.streak=streak; g.bonus=Object.keys(g.solved).length*3; g.arc.best=Math.round(r()*30);
  const examN=Math.max(0,Math.round(r()*3*skill+(skill>0.6?1:0)));
  if(examN>0){
    const hist=[];
    for(let i=0;i<examN;i++){
      const nw=Math.min(reach,1+Math.floor(r()*3)), picks=[];
      for(let j=0;j<nw;j++){ const wi2=Math.floor(r()*reach); if(!picks.includes(wi2)) picks.push(wi2); }
      const byWorld={}; let parts=0,ok=0;
      picks.forEach(wi2=>{ const w=WORLDS[wi2], tp=2+Math.floor(r()*2), pr=Math.min(tp,Math.round(tp*(0.4+skill*0.55+r()*0.15))); byWorld[w.id]={ok:pr,total:tp}; parts+=tp; ok+=pr; });
      if(parts) hist.push({ts:now-Math.round(r()*10*864e5)-1800e3,parts,ok,dur:Math.round(300+r()*900),byWorld});
    }
    hist.sort((a,b)=>a.ts-b.ts);
    if(hist.length) g.exam={hist};
  }
  computeAch(g);
  const bak=G; G=g; let json; try{ json=packState(); } finally{ G=bak; }
  const o=JSON.parse(json), group=idx%2?'Ejemplo · Grupo B':'Ejemplo · Grupo A', at=now-Math.round(r()*6*864e5)-3600e3;
  o.g=group; o.at=at;
  const xp=xpFor(g), retos=Object.keys(g.solved).filter(k=>!/\.b$/.test(k)).length, fl=failsOf(g), hist=[];
  for(let i=1;i<=4;i++){ const f=i/4; hist.push([at-(4-i)*4*864e5,Math.round(xp*f*f),Math.round(retos*f),Math.round(fl*f)]); }
  return {uid:g.uid,rec:{n:g.name,g:group,at,json:JSON.stringify(o),hist,ex:1}};
}
function loadDemo(){ const now=Date.now(); for(let i=0;i<DEMO_NAMES.length;i++){ const d=demoStudent(i,now); ROSTER.s[d.uid]=d.rec; } saveRoster(); }

function spark(h){
  if(h.length<2) return '';
  const W=260,H=64,px=8,py=10, xs=h.map(p=>p[0]), ys=h.map(p=>p[1]), x0=Math.min(...xs), x1=Math.max(...xs), y1=Math.max(...ys,1);
  const X=t=>px+(x1===x0?0:(t-x0)/(x1-x0))*(W-2*px-34), Y=v=>H-py-(v/y1)*(H-2*py);
  const pts=h.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' '), last=h[h.length-1];
  return '<svg class="tp-spark" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="XP en cada reporte: de '+ys[0]+' a '+last[1]+'"><line x1="'+px+'" x2="'+(W-px-34)+'" y1="'+(H-py)+'" y2="'+(H-py)+'" stroke="rgba(120,190,255,.3)" stroke-width="1"/><polyline points="'+pts+'" fill="none" stroke="#3dffa0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+X(last[0]).toFixed(1)+'" cy="'+Y(last[1]).toFixed(1)+'" r="4.5" fill="#3dffa0" stroke="#050818" stroke-width="2"/><text x="'+(X(last[0])+9).toFixed(1)+'" y="'+(Y(last[1])+4).toFixed(1)+'" fill="#e4eeff" font-size="12" font-weight="700">'+last[1]+'</text></svg>';

/* ================= NABLA · Pulso: reto relámpago de 60 segundos ================= */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nzr=(a,b)=>{ let v=0; while(!v) v=ri(a,b); return v; };
const nt=v=>numTexShow(v);                 // número en TeX
const ptTex=(x,y)=>'\\left('+nt(x)+',\\,'+nt(y)+'\\right)';
const coef=(c,s)=>c===1?s:c===-1?'-'+s:c+s;                     // término inicial
const addT=(c,s)=>c===0?'':(c>0?'+':'-')+(Math.abs(c)===1?'':Math.abs(c))+s;  // término con signo
function build(cat,tex,good,bad,fill){
  const seen=new Set([good]), out=[good];
  bad.forEach(b=>{ if(!seen.has(b)){ seen.add(b); out.push(b); } });
  for(let k=1;out.length<4&&k<40;k++){ const f=fill(k); if(!seen.has(f)){ seen.add(f); out.push(f); } }
  const opts=shuffle(out.slice(0,4)); return {cat,tex,opts,ans:opts.indexOf(good)};
}
const two=(a,b)=>'\\begin{gathered}'+a+'\\\\[5pt]'+b+'\\end{gathered}';
const fillN=a=>k=>nt(a+(k%2?1:-1)*Math.ceil(k/2));
const GENS=[
  ()=>{ const a=ri(1,4),b=ri(1,5),p=ri(-3,3),q=ri(-3,3), v=a*p*p-b*q;
    return build('Evaluar','f(x,y)='+coef(a,'x^2')+'-'+coef(b,'y')+',\\quad f('+p+','+q+')=\\ ?',nt(v),[nt(a*p*p+b*q),nt(-a*p*p-b*q),nt(a*p-b*q)],fillN(v)); },
  ()=>{ const c=ri(1,5),p=ri(-3,3),q=nzr(-3,3), v=2*p*q;

    };

      p.body.innerHTML='<div class="pin"><div class="arc-final"><div class="big" id="cd">…</div><p class="note" id="cdn">Preparando fórmulas</p></div></div>';
      await mathReady(3500); if(!alive) return;
      const cd=$('#cd',p.body), note=$('#cdn',p.body);
      for(const n of ['3','2','1']){ if(!alive) return; cd.textContent=n; note.textContent='Prepárate'; SND.beep(false); FX.ringAt(cd,COL.mag); await wait(720); }
      if(!alive) return; SND.beep(true); play();
    }
    function play(){
      S={t:60,score:0,combo:0,n:0,ok:0,last:performance.now(),cur:null,queue:[],lock:false};
      p.body.innerHTML='<div class="pin"><div class="arc-hud"><div class="arc-score" id="as">0</div><span class="combo" id="ac"></span><div class="arc-time" aria-hidden="true"><i id="at"></i></div><span class="chip" id="atl">60</span></div><div id="astage"></div><p class="note" style="text-align:center">Teclas 1–4 para responder</p></div>';
      const stage=$('#astage',p.body);
      const prep=()=>{
        const q=genQ(); if(!q) return null;
        const box=el('div','arc-card'); box.hidden=true;
        box.innerHTML='<div class="arc-q"><span class="cat"></span><span class="qt"></span></div><div class="opts two"></div>';
        $('.cat',box).textContent=q.cat;
        const wrapT=s=>TJ.failed?esc(texPlain(s)):'\\('+s+'\\)';
        $('.qt',box).innerHTML=wrapT(q.tex);
        const list=$('.opts',box);
        q.opts.forEach((o,i)=>{ const b=el('button','opt','<span class="ol">'+(i+1)+'</span><span class="ot">'+wrapT(o)+'</span>'); b.type='button'; b.addEventListener('click',()=>answer(i)); list.appendChild(b); });
        stage.appendChild(box); typeset(box); q.box=box; return q;
      };
      const fillQ=()=>{ while(S.queue.length<2){ const q=prep(); if(!q) break; S.queue.push(q); } };
      const next=()=>{
        if(S.cur&&S.cur.box) S.cur.box.remove();
        S.cur=S.queue.shift(); fillQ(); if(!S.cur) return;
        S.cur.box.hidden=false; S.lock=false; S.cur.t0=performance.now();
      };
      const hud=()=>{
        const sc=$('#as',p.body); if(sc) sc.textContent=S.score;
        const cb=$('#ac',p.body); if(cb) cb.textContent=S.combo>=2?'Racha ×'+S.combo+'':'';
      };
      function answer(i){
        if(S.lock||!S.cur||S.t<=0) return; S.lock=true; const q=S.cur, btns=$$('.opt',q.box); S.n++;
        if(i===q.ans){
          S.ok++; S.combo++; const pts=S.combo>=10?3:S.combo>=5?2:1; S.score+=pts; btns[i].classList.add('ok'); SND.combo(S.combo); FX.float('+'+pts,btns[i],pts>1?'amber':'');
          if(S.combo%5===0){ FX.burst(40,{x:.5,y:.4,cols:[COL.amber,COL.mag,'#fff']}); }
          hud(); setTimeout(()=>{ if(alive&&S) next(); },160);
        }else{
          S.combo=0; S.t=Math.max(0,S.t-3); btns[i].classList.add('bad'); btns[q.ans].classList.add('ok'); SND.bad(); FX.shake(q.box); FX.float('−3 s',btns[i],'red'); hud();
          setTimeout(()=>{ if(alive&&S) next(); },560);
        }
      }
      keyH=e=>{ if(!S||e.ctrlKey||e.metaKey||e.altKey) return; const k=e.key; if(k>='1'&&k<='4'){ e.preventDefault(); answer(+k-1); } };
      document.addEventListener('keydown',keyH);
      fillQ(); next(); hud();
      let lastTick=60;
      timer=setInterval(()=>{
        if(!S) return; const now=performance.now(); S.t-=(now-S.last)/1000; S.last=now;
        const t=Math.max(0,S.t), bar=$('#at',p.body), lab=$('#atl',p.body);
        if(bar) bar.style.transform='scaleX('+(t/60)+')'; if(lab) lab.textContent=Math.ceil(t);
        if(t<=10&&Math.ceil(t)!==lastTick){ lastTick=Math.ceil(t); SND.tickTock(); }
        if(t<=0) finish();
      },100);
    }
    function finish(){
      clearInterval(timer); if(keyH){ document.removeEventListener('keydown',keyH); keyH=null; }
      const s=S; S=null; if(!alive) return;
      const res=arcadeDone(s.score), acc=s.n?Math.round(100*s.ok/s.n):0;
      p.body.innerHTML='<div class="pin"><div class="reward boss"><h3>¡Tiempo!</h3><div class="arc-final"><div class="big">'+s.score+'</div><p class="note" style="margin:0">puntos</p></div>'+
        (res.best&&!isClass()?'<p><span class="chip amber">Récord nuevo</span></p>':'')+
        '<p class="note">'+s.ok+' aciertos de '+s.n+' ('+acc+' %)'+(isClass()?' · modo clase: sin récord ni XP':' · +'+res.xp+' XP · récord '+G.arc.best)+'</p>'+
        '<div class="mactions" style="justify-content:center"><button class="btn primary" id="aAgain" type="button">Jugar de nuevo</button><button class="btn" id="aClose" type="button">Cerrar</button></div></div></div>';
      SND.level(); FX.burst(res.best?200:90,{x:.5,y:.35,up:true}); handleEvents(res.evs,900);
      $('#aAgain',p.body).addEventListener('click',start); $('#aClose',p.body).addEventListener('click',()=>Panels.close(p));
    }
    intro();
  }});
}

/* ================= NABLA · Simulacro de parcial y plan de refuerzo ================= */
const fmtClock=s=>{ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const EXAM_COUNTS=[6,10,15,0];
const EXAM_TIMES=[900,1500,2400,0];
let EXCFG=null;

/* ---------- Selección de problemas: reparte por mundo, en orden aleatorio ----------
   Si el mundo tiene un banco de examen (20 problemas nuevos, ver 04i-exam-bank.js) se usa ese banco
   en vez de los 5 retos normales, para que el simulacro no repita lo que el estudiante ya practicó. */
function examPool(w){ return (w.examBank&&w.examBank.length)?w.examBank:w.retos; }
function findRB(w,k){ return w.retos.find(r=>r.id===k)||(w.examBank||[]).find(r=>r.id===k); }
function pickExamItems(worldIds,total){
  const byW=worldIds.map(id=>{ const w=byId[id]; return {q:shuffle(examPool(w).map((r,i)=>({w,reto:r,idx:i})))}; });
  const out=[]; let i=0,guard=0;
  while(out.length<total&&byW.some(b=>b.q.length)&&guard++<999){ const b=byW[i%byW.length]; i++; if(b.q.length) out.push(b.q.shift()); }
  return out;
}
/* ---------- Debilidades: qué repasar según los errores, soluciones vistas y simulacros recientes ---------- */
function examWeak(){
  const map=new Map();
  const add=(w,k,weight,rec,tel)=>{ const key=w.id+'.'+k, cur=map.get(key); if(cur) cur.weight+=weight; else map.set(key,{w,k,weight,rec:rec||null,tel:tel||null}); };
  WORLDS.forEach(w=>{
    EXK.forEach(k=>{
      const key=w.id+'.'+k, rec=G.solved[key], t=G.tel[key];
      if(!rec&&!t) return;
      let weight=0;
      if(t) weight+=(t.n||0)+(t.g||0)+(t.p||0);
      if(rec&&rec.r) weight+=3; else if(rec) weight+=Math.max(0,3-rec.s);
      if(weight>0) add(w,k,weight,rec,t);
    });
  });
  /* Lo que falló en tus últimos simulacros también cuenta, aunque el simulacro no toca las estrellas ni el reto en sí. */
  ((G.exam&&G.exam.hist)||[]).slice(-3).forEach(entry=>{
    (entry.miss||[]).forEach(x=>{ const w=byId[x.w]; if(w) add(w,x.k,Math.max(1,x.total-x.ok)*1.5); });
  });
  return [...map.values()].sort((a,b)=>b.weight-a.weight);
}
function pendingLessons(){
  const out=[];
  WORLDS.forEach((w,wi)=>{ if(!unlocked(wi)) return; w.lessons.forEach((ls,i)=>{ if(!G.les[w.id+'.'+ls.id]) out.push({w,li:i,ls}); }); });
  return out;
}
const exWeakTitle=x=>x.k==='b'?x.w.boss.name:(findRB(x.w,x.k)||{}).t||'';

/* ---------- Simulacro: jugar un lote de problemas con navegación libre ---------- */
function runExam(items,opts){
  opts=opts||{};
  if(!items.length){ toast({kind:'info',title:'Nada para practicar',text:'No hay problemas disponibles con esa selección.'}); return; }
  Panels.open({id:'exam',title:opts.label||'Simulacro de parcial',kicker:items.length+' problema'+(items.length===1?'':'s')+(opts.timeSec?' · con cronómetro':''),hue:210,locked:true,render(p){
    setWorldBg({hue:210,bg:'sin(2.1*x)*cos(2.1*y)*0.6+0.2*x',n:1,id:'exm'}); SND.setMood('calm');
    const views=[], hosts=[]; let idx=0, timer=0, tLeft=opts.timeSec||0, finished=false, t0=Date.now(), timeEl=null;
    p.disposers.push(()=>clearInterval(timer));
    if(opts.timeSec){ timeEl=el('span','chip extimer',fmtClock(tLeft)); p.head.insertBefore(timeEl,p.head.firstChild); }
    const stateOf=i=>{ const v=views[i]; if(!v) return {total:0,ok:0,touched:false}; const total=v.items.length, ok=v.items.filter(x=>x.done).length; return {total,ok,touched:v.items.some(x=>x.att>0||x.done)}; };
    const paintNav=()=>{
      $$('#exNav button',p.foot).forEach((b,i)=>{
        const s=stateOf(i); b.classList.remove('ok','bad'); b.classList.toggle('on',i===idx);
        if(s.total&&s.ok===s.total) b.classList.add('ok'); else if(s.touched) b.classList.add('bad');
      });
    };
    const renderChrome=()=>{
      p.foot.hidden=false;
      p.foot.innerHTML='<button class="btn" id="exSub" type="button">Entregar</button><div class="exnav" id="exNav"></div><button class="btn primary" id="exNext" type="button">Siguiente →</button>';
      $('#exNav',p.foot).innerHTML=items.map((it,i)=>'<button type="button" class="exn-b" data-i="'+i+'" aria-label="Problema '+(i+1)+'">'+(i+1)+'</button>').join('');
      $$('#exNav button',p.foot).forEach(b=>b.addEventListener('click',()=>go(+b.dataset.i)));
      $('#exSub',p.foot).addEventListener('click',()=>submit(false));
      $('#exNext',p.foot).addEventListener('click',()=>go(Math.min(items.length-1,idx+1)));
    };
    const go=i=>{
      idx=i; $('.pk',p.el).textContent='Problema '+(i+1)+' de '+items.length;
      if(!hosts[i]){
        const it=items[i], box=el('div','pin'), host=el('div');
        box.dataset.rid=it.reto.id;
        box.appendChild(el('div','chip','Reto de '+esc(it.w.short))); box.appendChild(host);
        hosts[i]=box;
        /* Se adjunta al documento ANTES de rellenar: MathJax ignora los elementos desconectados del DOM. */
        p.body.innerHTML=''; p.body.appendChild(box); p.body.scrollTop=0;
        const q=el('div','exq'); q.innerHTML=it.reto.q; host.appendChild(q);
        let vdisp=null;
        if(it.reto.viz){ const vh=el('div','vzhost'); host.appendChild(vh); try{ const v=makeViz(vh,it.reto.viz); vdisp=()=>v.dispose(); }catch(e){} }
        const ph=el('div','parts'); host.appendChild(ph);
        const ctl=mountParts(ph,it.reto.parts,{canAnswer:()=>!finished,onWrong:()=>paintNav(),onPartOk:()=>paintNav(),onDone:()=>paintNav()});
        views[i]={items:ctl.items}; p.disposers.push(()=>{ ctl.dispose(); if(vdisp) vdisp(); });
        typeset(q);
      }else{
        p.body.innerHTML=''; p.body.appendChild(hosts[i]); p.body.scrollTop=0;
      }
      paintNav(); const nx=$('#exNext',p.foot); if(nx) nx.disabled=(i===items.length-1);
      setTimeout(()=>{ const inp=$('.part input',hosts[i]); if(inp&&!inp.disabled) try{ inp.focus(); }catch(e){} },260);
    };
    const reportOf=()=>{
      let totalParts=0,okParts=0; const byWorld={};
      items.forEach((it,i)=>{
        const w=it.w; byWorld[w.id]=byWorld[w.id]||{ok:0,total:0};
        const parts=it.reto.parts.length; totalParts+=parts; byWorld[w.id].total+=parts;
        const s=stateOf(i); okParts+=s.ok; byWorld[w.id].ok+=s.ok;
      });
      return {totalParts,okParts,byWorld,pct:totalParts?Math.round(100*okParts/totalParts):0};
    };
    async function submit(auto){
      if(finished) return;
      const rep=reportOf();
      if(!auto&&rep.okParts<rep.totalParts){
        const ok=await confirmBox('¿Entregar el simulacro?','Te faltan '+(rep.totalParts-rep.okParts)+' de '+rep.totalParts+' partes por responder bien. ¿Entregar de todas formas?','Entregar');
        if(!ok||finished) return;
      }
      finish(rep);
    }
    function finish(rep){
      finished=true; clearInterval(timer);
      const dur=Math.round((Date.now()-t0)/1000), entry={ts:Date.now(),n:items.length,parts:rep.totalParts,ok:rep.okParts,dur,byWorld:{},miss:[]};
      Object.keys(rep.byWorld).forEach(id=>{ entry.byWorld[id]={ok:rep.byWorld[id].ok,total:rep.byWorld[id].total}; });
      const missed=items.map((it,i)=>({it,i,s:stateOf(i)})).filter(x=>x.s.ok<x.it.reto.parts.length);
      missed.forEach(x=>entry.miss.push({w:x.it.w.id,k:x.it.reto.id,ok:x.s.ok,total:x.it.reto.parts.length}));
      const res=isClass()?{evs:[],xp:0}:recordExam(entry);
      paintReport(rep,entry,res,missed);
    }
    function paintReport(rep,entry,res,missed){
      p.foot.hidden=true; if(timeEl){ timeEl.remove(); timeEl=null; }
      const b=examBand(rep.pct);
      p.body.innerHTML='<div class="pin"><div class="reward"><h3>Simulacro terminado</h3>'+
        '<span class="chip '+b.c+'" style="font-size:1rem;padding:8px 18px;margin:6px 0 4px">'+rep.pct+' % · '+b.t+'</span>'+
        '<p class="note">'+rep.okParts+' de '+rep.totalParts+' partes correctas · '+durTxt(entry.dur)+(isClass()?' · modo clase: no se guarda':(res.xp>0?' · +'+res.xp+' XP de bono':''))+'</p></div>'+
        '<div class="card" style="margin-top:14px"><h3>Por mundo</h3>'+worldBarsHTML(rep.byWorld)+'</div>'+
        (missed.length?'<div class="card" style="margin-top:14px"><h3>Para repasar</h3><ul class="rf-list" id="exMiss"></ul></div>':'<p class="note" style="margin-top:14px">Respondiste bien todo. ¡Buen trabajo!</p>')+
        '<div class="mactions" style="justify-content:flex-start;margin-top:16px"><button class="btn primary" id="exRef" type="button">Ver plan de refuerzo</button><button class="btn" id="exClose" type="button">Cerrar</button></div></div>';
      if(missed.length){
        const L=$('#exMiss',p.body);
        missed.forEach(x=>{
          const li=el('li','rf-item'), sid='exs'+x.i;
          li.innerHTML='<button class="rf-b" type="button"><span class="rf-w" style="--wh:'+x.it.w.hue+'">'+esc(x.it.w.glyph)+'</span><span class="rf-t"><b>'+esc(x.it.w.short)+'</b><span>'+esc(x.it.reto.t)+'</span></span><span class="rf-badge">Ver solución</span></button><div class="rf-sol" id="'+sid+'" hidden></div>';
          $('button',li).addEventListener('click',()=>{ const d=$('#'+sid,li); d.hidden=!d.hidden; if(!d.hidden&&!d.dataset.f){ d.dataset.f='1'; d.innerHTML='<div class="solbox"><h4>Solución explicada</h4>'+(x.it.reto.sol||'')+'</div>'; typeset(d); } });
          L.appendChild(li);
        });
      }
      $('#exRef',p.body).addEventListener('click',()=>{ Panels.close(p,true); openRefuerzo(); });
      $('#exClose',p.body).addEventListener('click',()=>Panels.close(p));
      SND.level(); FX.burst(rep.pct>=75?150:70,{x:.5,y:.35,up:true}); handleEvents(res.evs,700);
    }
    if(opts.timeSec){ timer=setInterval(()=>{ tLeft-=1; if(timeEl) timeEl.textContent=fmtClock(tLeft); if(tLeft<=0){ clearInterval(timer); submit(true); } },1000); }
    renderChrome(); go(0);
  }});
}
function examBand(pct){
  if(pct>=90) return {t:'Excelente',c:'lime'};
  if(pct>=75) return {t:'Bien',c:'lime'};
  if(pct>=60) return {t:'Regular',c:'amber'};
  return {t:'Necesita repaso',c:'red'};
}
function worldBarsHTML(byWorld){
  return Object.keys(byWorld).map(id=>{ const w=byId[id]; if(!w) return ''; const o=byWorld[id], pct=o.total?Math.round(100*o.ok/o.total):0;
    return '<div class="exw-row"><span class="exw-l">'+esc(w.short)+'</span><div class="wbar"><i style="width:'+pct+'%"></i></div><b>'+o.ok+'/'+o.total+'</b></div>'; }).join('');
}

/* ---------- Configurar el simulacro ---------- */
function openExamSetup(){
  if(!EXCFG) EXCFG={worlds:new Set(WORLDS.filter((w,i)=>unlocked(i)).map(w=>w.id)),count:10,timeSec:1500};
  Panels.open({id:'examsetup',title:'Simulacro de parcial',kicker:'Configura tu examen',hue:210,render(p){
    setHubBg();
    const draw=()=>{
      [...EXCFG.worlds].forEach(id=>{ const i=WORLDS.findIndex(w=>w.id===id); if(i<0||!unlocked(i)) EXCFG.worlds.delete(id); });
      const avail=[...EXCFG.worlds].reduce((s,id)=>s+examPool(byId[id]).length,0);
      const hist=((G.exam&&G.exam.hist)||[]).slice(-6).reverse();
      p.body.innerHTML='<div class="pin">'+
        '<p class="note">Elige qué mundos entran, cuántos problemas y si quieres cronómetro. Cada problema trae varias partes, como en un parcial real: no hay pistas ni «ver solución» hasta entregar.</p>'+
        '<h3 class="tp-h2b">Mundos</h3><div class="wtogs" id="exW"></div>'+
        '<h3 class="tp-h2b">Número de problemas</h3><div class="chipsel" id="exN"></div>'+
        '<h3 class="tp-h2b">Tiempo</h3><div class="chipsel" id="exTm"></div>'+
        '<div class="mactions" style="justify-content:flex-start;margin-top:16px"><button class="btn primary" id="exStart" type="button">Empezar simulacro</button><span class="note" id="exAvail" style="margin-left:2px"></span></div>'+
        (hist.length?'<div class="card" style="margin-top:22px"><h3>Tus simulacros anteriores</h3><ul class="list">'+hist.map(h=>'<li>'+dateTxt(h.ts)+' · '+h.ok+'/'+h.parts+' partes ('+(h.parts?Math.round(100*h.ok/h.parts):0)+' %) · '+durTxt(h.dur)+'</li>').join('')+'</ul></div>':'')+
        '</div>';
      const W=$('#exW',p.body);
      WORLDS.forEach((w,i)=>{
        const ok=unlocked(i), b=el('button','wtog'+(EXCFG.worlds.has(w.id)?' on':''),'<span style="--wh:'+w.hue+'">'+esc(w.glyph)+'</span>'+esc(w.short));
        b.type='button'; if(!ok){ b.disabled=true; b.title='Bloqueado'; } else b.addEventListener('click',()=>{ if(EXCFG.worlds.has(w.id)) EXCFG.worlds.delete(w.id); else EXCFG.worlds.add(w.id); draw(); });
        W.appendChild(b);
      });
      const N=$('#exN',p.body);
      EXAM_COUNTS.forEach(c=>{ const b=el('button','btn sm'+(EXCFG.count===c?' on':''),c===0?'Todos':String(c)); b.type='button'; b.addEventListener('click',()=>{ EXCFG.count=c; draw(); }); N.appendChild(b); });
      const Tm=$('#exTm',p.body);
      EXAM_TIMES.forEach(t=>{ const b=el('button','btn sm'+(EXCFG.timeSec===t?' on':''),t===0?'Sin límite':Math.round(t/60)+' min'); b.type='button'; b.addEventListener('click',()=>{ EXCFG.timeSec=t; draw(); }); Tm.appendChild(b); });
      const n=EXCFG.worlds.size?Math.min(avail,EXCFG.count||avail):0;
      $('#exAvail',p.body).textContent=EXCFG.worlds.size?n+' problema'+(n===1?'':'s')+' disponibles.':'Elige al menos un mundo.';
      const sb=$('#exStart',p.body); sb.disabled=!EXCFG.worlds.size;
      sb.addEventListener('click',()=>{
        const items=pickExamItems([...EXCFG.worlds],EXCFG.count||avail);
        Panels.close(p,true); runExam(items,{label:'Simulacro de parcial',timeSec:EXCFG.timeSec});
      });
    };
    draw();
  }});
}

/* ---------- Plan de refuerzo adaptativo ---------- */
function openRefuerzo(){
  Panels.open({id:'refuerzo',title:'Plan de refuerzo',kicker:'Repaso guiado para tu parcial',hue:280,render(p){
    setHubBg();
    const weak=examWeak(), pend=pendingLessons(), top=weak.slice(0,10);
    let h='<div class="pin">';
    if(!weak.length&&!pend.length) h+='<div class="intro"><h3 style="margin-bottom:6px">Todavía no hay suficiente información</h3><p style="margin:0">Resuelve algunos retos o haz un <b>Simulacro de parcial</b> y aquí verás exactamente qué repasar.</p></div>';
    else{
      if(pend.length) h+='<div class="card"><h3>Lecciones sin terminar</h3><p class="note">Repásalas antes de practicar: son la base de los retos.</p><div class="tiles t3" id="rfL"></div></div>';
      if(top.length) h+='<div class="card" style="margin-top:14px"><h3>Tus temas más débiles</h3><p class="note">Ordenados por lo que más te ha costado: errores, pistas usadas y soluciones vistas.</p><ol class="rf-list" id="rfW"></ol>'+
        (top.filter(x=>x.k!=='b').length>1?'<div class="mactions" style="justify-content:flex-start;margin-top:12px"><button class="btn primary" id="rfGo" type="button">Practicar seguido</button></div>':'')+'</div>';
    }
    h+='</div>'; p.body.innerHTML=h;
    if(pend.length){ const L=$('#rfL',p.body); pend.slice(0,6).forEach(x=>L.appendChild(tileEl('','Mundo '+x.w.n,esc(x.ls.t),esc(x.w.short),null,()=>{ Panels.close(p,true); openLesson(x.w,x.li); }))); }
    if(top.length){
      const L=$('#rfW',p.body);
      top.forEach(x=>{
        const tag=x.k==='b'?'Jefe':'Reto '+x.k.slice(1);
        const badge=x.rec&&x.rec.r?'Vio la solución':x.rec?x.rec.s+' ★':'Sin resolver';
        const li=el('li','rf-item');
        li.innerHTML='<button class="rf-b" type="button"><span class="rf-w" style="--wh:'+x.w.hue+'">'+esc(x.w.glyph)+'</span><span class="rf-t"><b>'+esc(x.w.short)+' · '+tag+'</b><span>'+esc(exWeakTitle(x))+'</span></span><span class="rf-badge">'+esc(badge)+'</span></button>';
        $('button',li).addEventListener('click',()=>{
          if(x.k==='b'){ Panels.close(p,true); openBoss(x.w); return; }
          const inRetos=x.w.retos.some(r=>r.id===x.k);
          Panels.close(p,true);
          if(inRetos) openReto(x.w,+x.k.slice(1)-1);
          else{ const r=findRB(x.w,x.k); if(r) runExam([{w:x.w,reto:r}],{label:'Refuerzo',timeSec:0}); }
        });
        L.appendChild(li);
      });
      const go=$('#rfGo',p.body);
      if(go) go.addEventListener('click',()=>{
        const items=top.filter(x=>x.k!=='b').slice(0,8).map(x=>({w:x.w,reto:findRB(x.w,x.k)})).filter(x=>x.reto);
        Panels.close(p,true); runExam(items,{label:'Refuerzo',timeSec:0});
      });
    }
  }});
}

/* ---- 09-boot.js ---- */
/* ================= NABLA · Arranque ================= */
(function boot(){
  UI.startedAt=Date.now();
  try{ FX.init(); }catch(e){}
  try{ BG.init(); }catch(e){}
  initMath(); applyClassUi();
  try{ setHubBg(); }catch(e){}
  const start=$('#start'), go=$('#go'), boot=$('#boot'), sSound=$('#stSound'), sClass=$('#stClass');
  const nl=WORLDS.length, nLes=nl*3, nRet=nl*5;
  const lines=['> núcleo de cálculo ............ <i>listo</i>','> motor gráfico 3D ............. <i>listo</i>','> '+nl+' mundos · '+nLes+' lecciones · '+nRet+' retos · '+nl+' jefes <i>cargados</i>','> audio sintético ............... <i>en espera</i>'];
  (async()=>{
    if(REDUCED){ boot.innerHTML=lines.join('<br>'); return; }
    for(const ln of lines){ const d=el('div'); boot.appendChild(d); d.innerHTML=ln; d.style.animation='fadeUp .4s both'; await wait(340); }
  })();
  const syncSound=()=>{ sSound.textContent='Sonido: '+(CFG.sound||CFG.music?'sí':'no'); };
  syncSound();
  sSound.addEventListener('click',()=>{ const on=!(CFG.sound||CFG.music); CFG.sound=on; CFG.music=on; saveCfg(); SND.unlock(); SND.apply(); syncSound(); if(on) SND.ok(); });
  sClass.addEventListener('click',()=>{ if(isClass()){ exitClass(); } else enterClass().then(applyClassUi); });
  document.addEventListener('pointerdown',()=>SND.unlock(),{once:true,capture:true});
  let started=false;
  const enter=()=>{
    if(started) return; started=true; SND.unlock(); SND.warp(); BG.warp(); FX.ring(.5,.42,COL.cyan,520); FX.burst(70,{x:.5,y:.42});
    start.classList.add('out'); go.disabled=true;
    setTimeout(()=>{
      start.hidden=true; showHub(); SND.apply();
      if(!CFG.welcomed&&!isClass()) setTimeout(()=>openWelcome(false),500);
    },REDUCED?50:950);
  };
  go.addEventListener('click',enter);
  document.addEventListener('keydown',e=>{ if(!started&&(e.key==='Enter')&&!MODAL&&document.activeElement===document.body){ e.preventDefault(); enter(); } });
  setTimeout(()=>{ try{ go.focus({preventScroll:true}); }catch(e){} },400);
})();

})();
